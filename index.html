<title>Ôn tập Tiếng Anh 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: mot cot hep (toi da 760px), trang chu la luoi the, de thi la thanh tab I-IX va mot phan lam bai moi lan. */
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ink:#16263F; --mute:#55657D; --line:#D9E1EC;
  --accent:#16406F; --accent-ink:#FFFFFF; --kite:#E9A524; --ok:#1B7F55; --ok-bg:#E2F4EB; --bad:#C23B2A; --bad-bg:#FBE8E5; --warn-bg:#FFF4DB; --sel:#DCE9F8;
  --head:'Be Vietnam Pro','Segoe UI',Arial,sans-serif; --body:'Nunito','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
#app{max-width:760px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--head);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1.02rem;font-weight:600}
p{margin:0 0 .6em}
a{color:var(--accent)}
.top{margin-bottom:8px}
.brand{font-family:var(--head);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sub{color:var(--mute);margin-top:6px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;text-decoration:none}
.back::before{content:"\2190  "}
.who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin-top:20px}
.who h2{margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row label{flex:1 1 200px;min-width:0;font-size:.85rem;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.grid,.grid3{display:grid;gap:12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--head);font-size:1.05rem}
.card span{font-size:.85rem;color:var(--mute)}
.card .mini{color:var(--accent);font-weight:700}
.gcard{border-top:4px solid var(--kite)}
.gl{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gc h3{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ic{flex:none;color:var(--accent)}
.gc p{font-size:.96rem}
.tip{background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:10px}
.tb{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto}
.tb td{border:1px solid var(--line);padding:5px 9px}
.pn{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pn a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-weight:600;font-size:.9rem}
.pn a.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:none;min-width:44px;height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 .95rem var(--head);cursor:pointer}
.tab.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.done::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
.tab.cur.done::after{background:var(--kite)}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ah{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.instr{font-size:.88rem;color:var(--mute);font-style:italic;margin-top:4px}
.stars{display:flex;gap:2px}
.st{color:var(--line)} .st.on{color:var(--kite)} .st .ic{color:inherit;fill:currentColor}
.box{list-style:none;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg);border:1px dashed var(--mute);border-radius:8px}
.box li{font-weight:700;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.ql{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:14px}
.q{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:start}
.no{font-family:var(--head);font-weight:700;color:var(--accent)}
.qs{margin:0 0 6px;overflow-wrap:anywhere}
.hint{margin:0 0 4px;padding:4px 9px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 6px 6px 0;font-size:.92rem;overflow-wrap:anywhere}
.hl{margin:10px 0 4px;font-weight:700}
.hints{margin:0 0 10px;padding-left:0;list-style:none;display:grid;gap:4px}
.hints li{padding:4px 9px;border-left:3px solid var(--ok);background:var(--ok-bg);border-radius:0 6px 6px 0;font-size:.92rem}
.stub{font-size:.88rem;color:var(--mute);margin:0 0 6px}
.un{font-size:.72rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.unrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk{display:inline-block;width:3.2em;border-bottom:2px solid var(--mute);margin-inline:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt b{color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.q.ok .opt.sel{background:var(--ok-bg);border-color:var(--ok)}
.q.bad .opt.sel{background:var(--bad-bg);border-color:var(--bad)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);opacity:.7}
.opt.no span{text-decoration:line-through}
.qfb{margin:6px 0 0;padding:6px 10px;border-radius:0 6px 6px 0;font-size:.92rem;overflow-wrap:anywhere}
.qfb.no{background:var(--bad-bg);border-left:3px solid var(--bad);font-weight:400;color:var(--ink,inherit)}
.qfb.ok{background:var(--ok-bg);border-left:3px solid var(--ok);font-weight:600}
.btn.sm{padding:5px 12px;font-size:.88rem;margin-top:6px}
.q.now{box-shadow:0 0 0 2px var(--kite);border-radius:8px}
.opts.long{grid-template-columns:1fr}
.opt.key{background:var(--ok-bg);border-color:var(--ok)}
.opt.key b{color:var(--ok)}
.ans{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:.92rem}
.ty + .ans{display:block;margin:6px 0 0;width:fit-content}
.more{margin-top:4px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600}
.more p{margin:6px 0 0}
.fb.stop{background:var(--warn-bg)}
.rule{font-size:.85rem;color:var(--mute);margin:12px 0 0}
.gp{width:9.5em;max-width:100%;display:inline-block;padding:4px 8px}
.ty{width:100%;resize:vertical}
input.ok,textarea.ok,select.ok{border-color:var(--ok);background:var(--ok-bg)}
input.bad,textarea.bad,select.bad{border-color:var(--bad);background:var(--bad-bg)}
.pass{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:8px;line-height:2.2}
.pass h4{font-size:1rem;margin-bottom:6px}
.pass p{margin:0}
.pb{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pb i{font-style:normal;font-size:.75rem;font-weight:700;color:var(--accent)}
.sl{padding:4px 6px;max-width:100%}
.fb{margin-top:16px;border-radius:8px;padding:10px 14px}
.fb p{margin:0 0 6px}
.fb.warn{background:var(--warn-bg)} .fb.good{background:var(--ok-bg)}
.how{font-size:.94rem}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:600 .95rem var(--head);padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk{font-weight:700}
@media (max-width:520px){h1{font-size:1.55rem}.q{grid-template-columns:26px minmax(0,1fr)}.q .un{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.tab{transition:border-color .15s,background .15s}}
</style>

<script>window.WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyAGlyqjXibI0DkrKTYHs1U_sT_woOWttm5__EueZr37fl7Gh-7KvmWXzsChEDhwZRd/exec";</script>
<script>window.DES = [{"id": "d1", "no": 1, "title": "Đề số 1", "acts": [{"id": "d1-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo</u>l", "p<u>oo</u>l", "w<u>o</u>lf", "b<u>oo</u>t"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>ou</u>ld", "p<u>u</u>sh", "b<u>oo</u>t", "w<u>o</u>lf"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>ui</u>ld", "sil<u>e</u>nt", "b<u>a</u>nana", "fam<u>ou</u>s"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["hands<u>o</u>me", "bagg<u>age</u>", "<u>re</u>new", "cour<u>age</u>"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo</u>r", "t<u>ou</u>r", "p<u>oo</u>r", "v<u>oi</u>ce"], "a": 3, "u": 3}]}, {"id": "d1-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "We enjoy ___ board games with our cousins at weekends.", "o": ["play", "playing", "to play", "played"], "a": 1, "u": 1}, {"s": "My sister is keen ___ knitting and making crafts.", "o": ["in", "at", "on", "with"], "a": 2, "u": 1}, {"s": "Many teenagers are fond ___ chatting with friends online.", "o": ["of", "on", "in", "about"], "a": 0, "u": 1}, {"s": "Hoa ___ doing puzzles in her free time.", "o": ["adore", "adores", "to adore", "adoring"], "a": 1, "u": 1}, {"s": "A horse can run ___ than a buffalo.", "o": ["fast", "more fast", "faster", "fastest"], "a": 2, "u": 2}, {"s": "Nam writes ___ than his brother.", "o": ["more neat", "more neatly", "neatly", "neatest"], "a": 1, "u": 2}, {"s": "It rained heavily; ___, the farmers still went to the field.", "o": ["so", "and", "however", "or"], "a": 2, "u": 3}, {"s": "The bus was late, ___ we walked to school.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "You must study hard, ___ you will fail the midterm test.", "o": ["and", "so", "or else", "however"], "a": 2, "u": 3}, {"s": "People in the countryside are kind and ___.", "o": ["hospitable", "noisy", "crowded", "tiring"], "a": 0, "u": 2}]}, {"id": "d1-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Ninh often (play) ___ chess after school.", "a": ["plays"], "u": 1}, {"s": "My father detests (wait) ___ in long queues.", "a": ["waiting"], "u": 1}, {"s": "Mai (not do) ___ her homework last night.", "a": ["did not do", "didn't do"], "u": 1}, {"s": "Minh is keen on (join) ___ the school club.", "a": ["joining"], "u": 1}, {"s": "They fancy (listen) ___ to folk music.", "a": ["listening"], "u": 1}]}, {"id": "d1-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Cars run ___ than buffalo carts. (FAST)", "a": ["faster"], "u": 2}, {"s": "My cousin speaks English ___ than I do. (FLUENT)", "a": ["more fluently"], "u": 2}, {"s": "My brother adores ___ comic books. (READ)", "a": ["reading"], "u": 1}, {"s": "Hoa and Lan ___ go to the library on Sundays. (USUAL)", "a": ["usually"], "u": 1}, {"s": "I have a good ___ of stamps. (COLLECT)", "a": ["collection"], "u": 2}]}, {"id": "d1-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She was ill, ___ she stayed at home.", "a": ["so"], "u": 3}, {"s": "My brother is not keen ___ cooking.", "a": ["on"], "u": 1}, {"s": "We like football, ___ we don't like volleyball.", "a": ["but"], "u": 3}, {"s": "Linh is crazy ___ doing DIY.", "a": ["about"], "u": 1}, {"s": "Is your sister interested ___ crafts?", "a": ["in"], "u": 1}], "box": ["on", "so", "about", "but", "in"]}, {"id": "d1-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["life"], "u": 2}, {"a": ["than"], "u": 2}, {"a": ["harvest"], "u": 2}, {"a": ["with"], "u": 2}, {"a": ["riding"], "u": 2}], "box": ["life", "than", "harvest", "with", "riding"], "passage": "I live in a village in the countryside. Life here is simple, and I love country {1}. In the past, farmers worked harder {2} they do now, because they had no machines. Today, they use combine harvesters, so they finish the {3} time earlier. Our houses are better equipped {4} electric fans and TVs. Many boys enjoy {5} buffaloes in the afternoon."}, {"id": "d1-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["playing", "play", "played", "plays"], "a": 0, "u": 1}, {"o": ["on", "of", "in", "at"], "a": 1, "u": 1}, {"o": ["so", "but", "for", "or"], "a": 1, "u": 3}, {"o": ["spend", "to spending", "spending", "spent"], "a": 2, "u": 1}, {"o": ["relax", "relaxing", "relaxed", "relaxation"], "a": 2, "u": 3}], "passage": "Teenagers today have many ways to relax. Some teenagers love {1} games online. Others are fond {2} listening to music. Boys often play football {3} girls prefer swimming. They also like {4} time with friends at the weekend. They feel {5} after these activities, so they can study better.", "ptitle": "How do teenagers relax?"}, {"id": "d1-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I enjoy making origami in my free time. (keen)", "a": ["I am keen on making origami in my free time."], "u": 1}, {"s": "Lan is a more careful driver than Nam. (carefully)", "a": ["Lan drives more carefully than Nam."], "u": 2}, {"s": "My sister dislikes cooking. (hates)", "a": ["My sister hates cooking."], "u": 1}, {"s": "This road is wider than that one. (narrower)", "a": ["That road is narrower than this one."], "u": 2}, {"s": "The film was boring. We left early. (therefore)", "a": ["The film was boring; therefore, we left early."], "u": 3}]}, {"id": "d1-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mr Hung spends an hour travelling to work every day.", "stub": "It takes", "a": ["It takes Mr Hung an hour to travel to work every day.", "Mr Hung an hour to travel to work every day."], "u": 1}, {"s": "She loves collecting stamps in her leisure time.", "stub": "She is fond", "a": ["She is fond of collecting stamps in her leisure time.", "of collecting stamps in her leisure time."], "u": 1}, {"s": "Tom dislikes playing computer games.", "stub": "Tom isn't keen", "a": ["Tom isn't keen on playing computer games.", "on playing computer games."], "u": 1}, {"s": "She feels stressed now, for she has a midterm test tomorrow.", "stub": "She has", "a": ["She has a midterm test tomorrow, so she feels stressed now.", "a midterm test tomorrow, so she feels stressed now."], "u": 3}, {"s": "Nam doesn't run as quickly as Tuan.", "stub": "Tuan runs", "a": ["Tuan runs more quickly than Nam.", "more quickly than Nam."], "u": 2}]}]}, {"id": "d2", "no": 2, "title": "Đề số 2", "acts": [{"id": "d2-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, , "hardest"], "a": 1, "u": 2}, {"s": "He is clever; ___, he never studies hard.", "o": ["therefore", "however", "so", "and"], "a": 1, "u": 3}, {"s": "I'd like to join the club, ___ I'm too busy.", "o": ["so", "and", "but", "or"], "a": 2, "u": 3}, {"s": "Hurry up, ___ you will miss the bus.", "o": ["or else", "and", "so", "however"], "a": 0, "u": 3}, {"s": "We use a ___ to carry rice in the countryside.", "o": ["buffalo-drawn cart", "lighthouse", "website", "helpline"], "a": 0, "u": 2}]}, {"id": "d4-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Lan (go) ___ to the library every Saturday.", "a": ["goes"], "u": 1}, {"s": "Do you fancy (play) ___ chess with me?", "a": ["playing"], "u": 1}, {"s": "My father (not like) ___ cooking.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "We (visit) ___ our grandparents last weekend.", "a": ["visited"], "u": 2}, {"s": "She hates (get) ___ up early.", "a": ["getting", "to get"], "u": 1}]}, {"id": "d4-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My sister dances ___ than I do. (BEAUTIFUL)", "a": ["more beautifully"], "u": 2}, {"s": "Farmers work ___ than city workers in summer. (HARD)", "a": ["harder"], "u": : "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["surf", "to surf", "surfing", "surfed"], "a": 2, "u": 1}, {"o": ["message", "messaging", "to message", "messaged"], "a": 1, "u": 1}, {"o": ["in", "on", "at", "of"], "a": 1, "u": 1}, {"o": ["At", "In", "On", "By"], "a": 2, "u": 1}, {"o": ["quiet", "quieter", "more quiet", "quietest"], "a": 1, "u": 2}], "passage": "Vietnamese teenagers have many leisure activities. Many of them enjoy {1} the net and {2} with friends online. Girls are often keen {3} making crafts, but boys prefer playing sports. {4} Sundays, families often go to the countryside. The countryside is much {5} than the city.", "ptitle": "Free time in Viet Nam"}, {"id": "d4-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "He likes reading comics in his free time. (fond)", "a": ["He is fond of reading comics in his free time."], "u": 1}, {"s": "Nam is a more careful worker than Minh. (carefully)", "a": ["Nam works more carefully than Minh."], "u": 2}, {"s": "My cousin is crazy about fishing. (adores)", "a": ["My cousin adores fishing."], "u": 1}, {"s": "Our garden is larger than theirs. (smaller)", "a": ["Their garden is smaller than ours."], "u": 2}, {"s": "Hoa was ill. She missed the class. (therefore)", "a": ["Hoa was ill; therefore, she missed the class."], "u": 3}]}, {"id": "d4-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My brother spends two hours playing games every evening.", "stub": "It takes", "a": ["It takes my brother two hours to play games every evening.", "my brother two hours to play games every evening."], "u": 1}, {"s": "Mai loves drawing in her free time.", "stub": "Mai is fond", "a": ["Mai is fond of drawing in her free time.", "of drawing in her free time."], "u": 1}, {"s": "My father hates watching football.", "stub": "My father isn't keen", "a": ["My father isn't keen on watching football.", "on watching football."], "u": 1}, {"s": "He feels hungry, for he didn't have breakfast.", "stub": "He didn't", "a": ["He didn't have breakfast, so he feels hungry.", "have breakfast, so he feels hungry."], "u": 3}, {"s": "Mai doesn't speak as fluently as her friend.", "stub": "Her friend", "a": ["Her friend speaks more fluently than Mai.", "speaks more fluently than Mai."], "u": 2}]}]}, {"id": "d5", "no": 5, "title": "Đề số 5", "acts": [{"id": "d5-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>u</u>ll", "bl<u>ue</u>", "l<u>o</u>se", "j<u>ui</u>ce"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["g<u>oo</u>d", "z<u>oo</u>", "p<u>u</u>sh", "w<u>ou</u>ld"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["cott<u>age</u>", "<u>a</u>partment", "s<u>u</u>rprise", "freed<u>o</u>m"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["short<u>age</u>", "s<u>u</u>rprise", "<u>de</u>cide", "<u>re</u>new"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou</u>rist", "b<u>oi</u>l", "m<u>oo</u>r", "p<u>oo</u>r"], "a": 1, "u": 3}]}, {"id": "d5-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My little brother loves ___ with toy cars.", "o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"s": "She is not keen ___ camping in winter.", "o": ["on", "in", "of", "about"], "a": 0, "u": 1}, {"s": "He ___ doing puzzles. He thinks they are boring.", "o": ["detests", "adore", "fancy", "keen"], "a": 0, "u": 1}, {"s": "What do you do in your ___ time?", "o": ["leisure", "vast", "local", "cruel"], "a": 0, "u": 1}, {"s": "A tractor ploughs the field ___ than a buffalo.", "o": ["fast", "more fast", "faster", "fastest"], "a": 2, "u": 2}, {"s": "Hoa sings ___ than any other girl in my class.", "o": ["beautiful", "more beautiful", "beautifully", "more beautifully"], "a": 3, "u": 2}, {"s": "We hurried to the station; ___, we missed the train.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "My uncle is a farmer, ___ he gets up very early.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Would you like to go to the cinema ___ stay at home?", "o": ["and", "so", "or", "but"], "a": 2, "u": 3}, {"s": "I like the countryside because it is ___ and peaceful.", "o": ["quiet", "noisy", "crowded", "polluted"], "a": 0, "u": 2}]}, {"id": "d5-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mr Hai often (go) ___ fishing on Sundays.", "a": ["goes"], "u": 1}, {"s": "My sister adores (cook) ___ new dishes.", "a": ["cooking"], "u": 1}, {"s": "We (not watch) ___ TV last night.", "a": ["did not watch", "didn't watch"], "u": 1}, {"s": "Tom is fond of (ride) ___ his bike in the park.", "a": ["riding"], "u": 1}, {"s": "She fancies (join) ___ the Art Club.", "a": ["joining"], "u": 3}]}, {"id": "d5-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My brother plays football ___ than I do. (WELL)", "a": ["better"], "u": 2}, {"s": "This is a very ___ place for a picnic. (ENJOY)", "a": ["enjoyable"], "u": 3}, {"s": "I have a strong ___ for classical music. (PREFER)", "a": ["preference"], "u": 1}, {"s": "Farmers live ___ in the village than in the city. (HAPPY)", "a": ["more happily"], "u": 2}, {"s": "Teachers give ___ to students before exams. (ADVISE)", "a": ["advice"], "u": 3}]}, {"id": "d5-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is not keen ___ playing chess.", "a": ["on"], "u": 1}, {"s": "My grandfather is fond ___ gardening.", "a": ["of"], "u": 1}, {"s": "I called him, ___ he didn't answer.", "a": ["but"], "u": 3}, {"s": "Mai felt stressed, ___ she talked to her teacher.", "a": ["so"], "u": 3}, {"s": "He is tired now, ___ he stayed up late last night.", "a": ["for"], "u": 3}], "box": ["for", "but", "of", "on", "so"]}, {"id": "d5-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["join"], "u": 3}, {"a": ["forum"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["calm"], "u": 3}, {"a": ["more"], "u": 2}], "box": ["forum", "join", "more", "however", "calm"], "passage": "Linh is a teenager. She likes school clubs, so she wants to {1} the English Club. She often posts questions on the school {2} and chats with her friends. Sometimes she feels stressed; {3}, she always stays {4} during tests. Linh studies {5} carefully than before."}, {"id": "d5-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["because", "because of", "so", "but"], "a": 1, "u": 3}, {"o": ["on", "in", "about", "of"], "a": 2, "u": 3}, {"o": ["or", "so", "but", "however"], "a": 0, "u": 3}, {"o": ["do", "doing", "to doing", "done"], "a": 1, "u": 1}, {"o": ["calm", "calmly", "calming", "calmness"], "a": 0, "u": 3}], "passage": "Many teenagers feel stressed {1} their schoolwork. Some of them also worry {2} exams. To reduce stress, it is a good idea to talk to your family {3} friends. You should also spend time {4} sports or hobbies you enjoy. Teenagers who feel {5} can study more effectively.", "ptitle": "Teen stress"}, {"id": "d5-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I fancy learning to knit. (interested)", "a": ["I am interested in learning to knit."], "u": 1}, {"s": "Tom is a more fluent speaker than Hoa. (fluently)", "a": ["Tom speaks more fluently than Hoa."], "u": 2}, {"s": "He enjoys playing board games. (adores)", "a": ["He adores playing board games."], "u": 1}, {"s": "My house is bigger than yours. (smaller)", "a": ["Your house is smaller than mine."], "u": 2}, {"s": "The weather was bad. We still went camping. (however)", "a": ["The weather was bad; however, we still went camping."], "u": 3}]}, {"id": "d5-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Linh spends an hour doing her homework every night.", "stub": "It takes", "a": ["It takes Linh an hour to do her homework every night.", "Linh an hour to do her homework every night."], "u": 1}, {"s": "Mr Kim loves growing flowers.", "stub": "Mr Kim is fond", "a": ["Mr Kim is fond of growing flowers.", "of growing flowers."], "u": 1}, {"s": "My brother doesn't like cooking.", "stub": "My brother isn't keen", "a": ["My brother isn't keen on cooking.", "on cooking."], "u": 1}, {"s": "She felt sleepy, for she got up very early.", "stub": "She got", "a": ["She got up very early, so she felt sleepy.", "up very early, so she felt sleepy."], "u": 3}, {"s": "Lan doesn't walk as slowly as her sister.", "stub": "Her sister", "a": ["Her sister walks more slowly than Lan.", "walks more slowly than Lan."], "u": 2}]}]}, {"id": "d6", "no": 6, "title": "Đề số 6", "acts": [{"id": "d6-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo</u>n", "t<u>oo</u>l", "p<u>u</u>ll", "n<u>oo</u>n"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o</u>lf", "b<u>oo</u>k", "fr<u>ui</u>t", "c<u>oo</u>k"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["vill<u>age</u>", "freed<u>o</u>m", "c<u>o</u>ntrol", "hands<u>o</u>me"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>a</u>partment", "cott<u>age</u>", "<u>re</u>turn", "vill<u>age</u>"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oi</u>l", "destr<u>oy</u>", "t<u>oy</u>", "p<u>oo</u>r"], "a": 3, "u": 3}]}, {"id": "d6-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Nam doesn't mind ___ the chickens in the morning.", "o": ["feed", "feeding", "to feed", "fed"], "a": 1, "u": 1}, {"s": "My cousin is crazy ___ video games.", "o": ["about", "in", "on", "at"], "a": 0, "u": 1}, {"s": "She is really ___ origami and folds paper cranes every day.", "o": ["into", "in", "at", "of"], "a": 0, "u": 1}, {"s": "They ___ visiting museums at weekends.", "o": ["fancy", "fond", "keen", "crazy"], "a": 0, "u": 1}, {"s": "Buffaloes move ___ than tractors.", "o": ["slow", "more slow", "more slowly", "slowliest"], "a": 2, "u": 2}, {"s": "Tuan studies ___ than he used to.", "o": ["harder", "hard", "hardest", "more hardly"], "a": 0, "u": 2}, {"s": "The test was easy; ___, many students made mistakes.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "I'm busy, ___ I can't go with you.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Do you want to join the Chess Club ___ the Music Club?", "o": ["so", "but", "or", "therefore"], "a": 2, "u": 3}, {"s": "In my village, people ___ rice in the sun after the harvest.", "o": ["dry", "catch", "load", "herd"], "a": 0, "u": 2}]}, {"id": "d6-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "The farmers (harvest) ___ the rice last week.", "a": ["harvested"], "u": 2}, {"s": "Mai (like) ___ going to the beach.", "a": ["likes"], "u": 1}, {"s": "My brother (not mind) ___ doing housework.", "a": ["does not mind", "doesn't mind"], "u": 1}, {"s": "He detests (be) ___ late for school.", "a": ["being"], "u": 1}, {"s": "We love (hang) ___ out with friends.", "a": ["hanging", "to hang"], "u": 1}]}, {"id": "d6-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "The sun shines ___ in summer than in winter. (BRIGHT)", "a": ["more brightly"], "u": 2}, {"s": "My grandfather has a valuable ___ of old coins. (COLLECT)", "a": ["collection"], "u": 2}, {"s": "She is very ___ with her classmates. (COMMUNICATE)", "a": ["communicative"], "u": 1}, {"s": "Her results were very ___. (SATISFY)", "a": ["satisfactory"], "u": 1}, {"s": "Playing sports helps us improve muscle ___. (STRONG)", "a": ["strength"], "u": 1}]}, {"id": "d6-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["hang"], "u": 1}, {"a": ["group"], "u": 1}, {"a": ["stressed"], "u": 3}, {"a": ["concentrate"], "u": 3}, {"a": ["balance"], "u": 1}], "box": ["hang", "group", "stressed", "balance", "concentrate"], "passage": "After school, I often {1} out with a small {2} of friends. When I feel {3}, I listen to music. It helps me {4} on my homework. I try to keep a {5} between study and fun."}, {"id": "d7-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"o": ["in", "on", "at", "of"], "a": 1, "u": 1}, {"o": ["drink", "drinking", "drank", "drinks"], "a": 1, "u": 1}, {"o": ["In", "At", "On", "By"], "a": 2, "u": 1}, {"o": ["so", "but", "or", "for"], "a": 0, "u": 3}], "passage": "People in Viet Nam have many leisure activities. Many people like {1} badminton in the park. Teenagers are keen {2} playing computer games and messaging friends. Older people prefer {3} tea and chatting with neighbours. {4} Saturdays, some families go to the countryside, {5} they can enjoy fresh air.", "ptitle": "Leisure activities in Viet Nam"}, {"id": "d7-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và gi rigami", "relax"], "passage": "My favourite {1} is paper folding. I {2} about an hour on it every day. I like to {3} coloured paper into cranes and flowers. This Japanese art is called {4}. It helps me {5} after a long school day."}, {"id": "d8-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["so", "or", "but", "for"], "a": 1, "u": 3}, {"o": ["from", "at", "on", "with"], "a": 0, "u": 3}, {"o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"o": ["reduce", "reducing", "reduced", "reduces"], "a": 0, "u": 3}, {"o": ["good", "better", "more good", "best"], "a": 1, "u": 2}], "passage": "Many schools have clubs for teenagers. Students can join the English Club {1} the Science Club. In the clubs, students learn teamwork and make new friends. They also get advice {2} their leaders. Some students feel shy; {3}, they become more confident after a few weeks. Club activities help students {4} stress, so they can study {5}.", "ptitle": "Teen clubs"}, {"id": "d8-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My sister loves collecting stamps. (fond)", "a": ["My sister is fond of collecting stamps."], "u": 1}, {"s": "Tuan is a faster swimmer than Minh. (fast)", "a": ["Tuan swims faster than Minh."], "u": 2}, {"s": "I hate getting up early. (stand)", "a": ["I can't stand getting up early."], "u": 1}, {"s": "Math is easier than English for me. (harder)", "a": ["English is harder than math for me."], "u": 2}, {"s": "It was raining. We didn't go out. (so)", "a": ["It was raining, so we didn't go out."], "u": 3}]}, {"id": "d8-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "He spends an hour doing exercise every morning.", "stub": "It takes", "a": ["It takes him an hour to do exercise every morning.", "him an hour to do exercise every morning."], "u": 1}, {"s": "She likes playing tennis at the weekend.", "stub": "She is keen", "a": ["She is keen on playing tennis at the weekend.", "on playing tennis at the weekend."], "u": 1}, {"s": "My brother dislikes doing puzzles.", "stub": "My brother isn't fond", "a": ["My brother isn't fond of doing puzzles.", "of doing puzzles."], "u": 1}, {"s": "She is tired now, for she worked late last night.", "stub": "She worked", "a": ["She worked late last night, so she is tired now.", "late last night, so she is tired now."], "u": 3}, {"s": "Hoa doesn't cook as well as her mother.", "stub": "Her mother", "a": ["Her mother cooks better than Hoa.", "cooks better than Hoa."], "u": 2}]}]}, {"id": "d9", "no": 9, "title": "Đề số 9", "acts": [{"id": "d9-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo</u>d", "bl<u>ue</u>", "g<u>oo</u>se", "l<u>oo</u>k"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo</u>l", "g<u>oo</u>d", "w<u>oo</u>l", "f<u>oo</u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["bagg<u>age</u>", "gener<u>ou</u>s", "op<u>e</u>n", "pict<u>u</u>re"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>i</u>t", "sil<u>e</u>nt", "<u>pre</u>dict", "cour<u>age</u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo</u>r", "p<u>oo</u>r", "t<u>ou</u>rist", "v<u>oi</u>ce"], "a": 3, "u": 3}]}, {"id": "d9-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Minh is keen on ___ his bike in the park.", "o": ["ride", "riding", "to ride", "rode"], "a": 1, "u": 1}, {"s": "My brother is fond ___ cartoons.", "o": ["of", "on", "in", "at"], "a": 0, "u": 1}, {"s": "She is not interested ___ fashion.", "o": ["of", "on", "in", "at"], "a": 2, "u": 1}, {"s": "We don't mind ___ for you.", "o": ["wait", "waiting", "to wait", "waited"], "a": 1, "u": 1}, {"s": "The tractor runs ___ than the old machine.", "o": ["quiet", "more quiet", "more quietly", "quietest"], "a": 2, "u": 2}, {"s": "He speaks ___ than his brother.", "o": ["loud", "louder", "more loud", "loudest"], "a": 1, "u": 2}, {"s": "Nam is tired, ___ he keeps working.", "o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"s": "The sky was dark; ___, it didn't rain.", "o": ["therefore", "however", "so", "and"], "a": 1, "u": 3}, {"s": "I have a midterm test tomorrow, ___ I am studying tonight.", "o": ["but", "or", "so", "however"], "a": 2, "u": 3}, {"s": "The ___ shines over the sea to guide ships at night.", "o": ["lighthouse", "orchard", "forum", "ger"], "a": 0, "u": 2}]}, {"id": "d9-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mrs Hoa (milk) ___ cows every morning.", "a": ["milks"], "u": 2}, {"s": "I detest (eat) ___ out alone.", "a": ["eating"], "u": 1}, {"s": "Lan (not like) ___ climbing mountains.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "They (invite) ___ us to the party last Sunday.", "a": ["invited"], "u": 1}, {"s": "My cousin fancies (join) ___ the chess club.", "a": ["joining"], "u": 3}]}, {"id": "d9-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Fish swim ___ than people. (FAST)", "a": ["faster"], "u": 2}, {"s": "She sang ___ than anyone else in class. (BEAUTIFUL)", "a": ["more beautifully"], "u": 2}, {"s": "Our ___ was cancelled because of the rain. (COMPETE)", "a": ["competition"], "u": 3}, {"s": "The trip was very ___. (ENJOY)", "a": ["enjoyable"], "u": 3}, {"s": "My ___ with my friends is strong. (CONNECT)", "a": ["connection"], "u": 3}]}, {"id": "d9-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is really ___ rock music.", "a": ["into"], "u": 1}, {"s": "Hoa is interested ___ learning English.", "a": ["in"], "u": 1}, {"s": "He is fond ___ playing chess.", "a": ["of"], "u": 1}, {"s": "He studied hard, ___ he got a good mark.", "a": ["so"], "u": 3}, {"s": "I wanted to go out, ___ it was raining.", "a": ["but"], "u": 3}], "box": ["of", "but", "in", "so", "into"]}, {"id": "d9-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["early"], "u": 2}, {"a": ["cattle"], "u": 2}, {"a": ["poultry"], "u": 2}, {"a": ["than"], "u": 2}, {"a": ["ploughs"], "u": 2}], "box": ["early", "cattle", "poultry", "than", "ploughs"], "passage": "My uncle is a farmer. He gets up {1} every day. He feeds the {2} in the field and the {3} such as chickens and ducks near the house. He works harder {4} other farmers in the village. In spring, he {5} his fields with a buffalo."}, {"id": "d9-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["in", "at", "on", "of"], "a": 0, "u": 2}, {"o": ["but", "and", "so", "or"], "a": 1, "u": 3}, {"o": ["milk", "milking", "to milking", "milked"], "a": 1, "u": 2}, {"o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"o": ["relax", "relaxing", "relaxed", "relaxation"], "a": 2, "u": 1}], "passage": "Last month, our class went on a trip to the countryside. We visited a farm {1} a small village. The farmers were very friendly {2} hospitable. We tried {3} cows and feeding chickens. It was not easy, {4} we enjoyed it. We felt {5} after a day in the fresh air.", "ptitle": "A school trip to the countryside"}, {"id": "d9-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My brother loves skateboarding. (crazy)", "a": ["My brother is crazy about skateboarding."], "u": 1}, {"s": "She is a more patient listener than me. (patiently)", "a": ["She listens more patiently than I do."], "u": 2}, {"s": "Nam is fond of fishing. (adores)", "a": ["Nam adores fishing."], "u": 1}, {"s": "My bag is heavier than yours. (lighter)", "a": ["Your bag is lighter than mine."], "u": 2}, {"s": "He worked very hard. He failed the exam. (however)", "a": ["He worked very hard; however, he failed the exam."], "u": 3}]}, {"id": "d9-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "She spends forty minutes travelling to work every day.", "stub": "It takes", "a": ["It takes her forty minutes to travel to work every day.", "her forty minutes to travel to work every day."], "u": 1}, {"s": "They enjoy swimming in the sea.", "stub": "They are fond", "a": ["They are fond of swimming in the sea.", "of swimming in the sea."], "u": 1}, {"s": "He hates doing homework at night.", "stub": "He isn't keen", "a": ["He isn't keen on doing homework at night.", "on doing homework at night."], "u": 1}, {"s": "I'm hungry, for I skipped lunch.", "stub": "I skipped", "a": ["I skipped lunch, so I'm hungry.", "lunch, so I'm hungry."], "u": 3}, {"s": "Hoa doesn't work as hard as Nam.", "stub": "Nam works", "a": ["Nam works harder than Hoa.", "harder than Hoa."], "u": 2}]}]}, {"id": "d10", "no": 10, "title": "Đề số 10", "acts": [{"id": "d10-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>oo</u>n", "j<u>ui</u>ce", "m<u>oo</u>n", "l<u>oo</u>k"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oo</u>t", "l<u>oo</u>k", "w<u>oo</u>l", "w<u>oo</u>d"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sil<u>e</u>nt", "pict<u>u</u>re", "b<u>i</u>t", "fam<u>ou</u>s"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>u</u>rprise", "k<u>i</u>t", "vill<u>age</u>", "s<u>i</u>t"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>oi</u>l", "p<u>oo</u>r", "destr<u>oy</u>", "c<u>oi</u>n"], "a": 1, "u": 3}]}, {"id": "d10-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "We love ___ outdoors at weekends.", "o": ["be", "being", "been", "to being"], "a": 1, "u": 1}, {"s": "Is your sister keen ___ knitting?", "o": ["in", "on", "of", "about"], "a": 1, "u": 1}, {"s": "Lan adores ___ her grandmother in the kitchen.", "o": ["help", "to help", "helping", "helped"], "a": 2, "u": 1}, {"s": "My brother is ___ playing chess; he plays every evening.", "o": ["into", "in", "on", "at"], "a": 0, "u": 1}, {"s": "A bike moves ___ than a car.", "o": ["slow", "more slow", "more slowly", "slowliest"], "a": 2, "u": 2}, {"s": "Hoa speaks English ___ than I do.", "o": ["good", "well", "better", "more well"], "a": 2, "u": 2}, {"s": "My sister is shy; ___, she is a good speaker.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "I have a lot of schoolwork, ___ I feel stressed.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Would you like to join a school club ___ a sports team?", "o": ["so", "but", "or", "for"], "a": 2, "u": 3}, {"s": "Teenagers should balance schoolwork and ___ activities.", "o": ["leisure", "vast", "local", "cruel"], "a": 0, "u": 1}]}, {"id": "d10-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Binh often (play) ___ badminton after school.", "a": ["plays"], "u": 1}, {"s": "We enjoy (fly) ___ kites in the fields.", "a": ["flying"], "u": 2}, {"s": "Lan (not like) ___ crowded places.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "He (spend) ___ an hour surfing the net last night.", "a": ["spent"], "u": 1}, {"s": "They are interested in (learn) ___ new skills.", "a": ["learning"], "u": 3}]}, {"id": "d10-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He plays chess ___ than his sister. (WELL)", "a": ["better"], "u": 2}, {"s": "Mai drives ___ than her father. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "Speaking skills are important for ___ with other people. (COMMUNICATE)", "a": ["communication"], "u": 1}, {"s": "She felt ___ when she heard the good news. (DELIGHT)", "a": ["delighted"], "u": 3}, {"s": "Students need ___ to study well. (CONCENTRATE)", "a": ["concentration"], "u": 3}]}, {"id": "d10-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is keen ___ gardening.", "a": ["on"], "u": 1}, {"s": "He is crazy ___ video games.", "a": ["about"], "u": 1}, {"s": "I'm interested ___ science.", "a": ["in"], "u": 1}, {"s": "I like tea, ___ I don't like coffee.", "a": ["but"], "u": 3}, {"s": "He is ill, ___ he stays in bed.", "a": ["so"], "u": 3}], "box": ["on", "so", "about", "in", "but"]}, {"id": "d10-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["log"], "u": 3}, {"a": ["account"], "u": 3}, {"a": ["update"], "u": 3}, {"a": ["share"], "u": 3}, {"a": ["notification"], "u": 3}], "box": ["log", "account", "update", "share", "notification"], "passage": "Teenagers often {1} on to their social media {2} every day. They {3} their profiles every week, and they {4} news with friends. When they receive a {5}, they check it at once."}, {"id": "d10-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["but", "so", "or", "for"], "a": 0, "u": 3}, {"o": ["than", "as", "then", "that"], "a": 0, "u": 2}, {"o": ["so", "and", "or", "however"], "a": 1, "u": 3}, {"o": ["help", "helping", "to help", "helped"], "a": 1, "u": 1}, {"o": ["happy", "happily", "happier", "happiness"], "a": 0, "u": 2}], "passage": "Hanh lives in the city, {1} she often visits her grandparents in the countryside. Life there is quieter {2} life in the city. Her grandfather ploughs the fields, {3} her grandmother feeds the chickens. Hanh enjoys {4} them with the farm work. She feels very {5} in the village.", "ptitle": "A weekend in the countryside"}, {"id": "d10-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My brother likes making models. (keen)", "a": ["My brother is keen on making models."], "u": 1}, {"s": "Tom is a more skilful player than Nam. (skilfully)", "a": ["Tom plays more skilfully than Nam."], "u": 2}, {"s": "She hates going out at night. (dislikes)", "a": ["She dislikes going out at night."], "u": 1}, {"s": "This story is shorter than that one. (longer)", "a": ["That story is longer than this one."], "u": 2}, {"s": "He was very tired. He finished his work. (however)", "a": ["He was very tired; however, he finished his work."], "u": 3}]}, {"id": "d10-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My father spends half an hour reading the news every morning.", "stub": "It takes", "a": ["It takes my father half an hour to read the news every morning.", "my father half an hour to read the news every morning."], "u": 1}, {"s": "She loves playing the violin.", "stub": "She is fond", "a": ["She is fond of playing the violin.", "of playing the violin."], "u": 1}, {"s": "My sister dislikes being late.", "stub": "My sister isn't keen", "a": ["My sister isn't keen on being late.", "on being late."], "u": 1}, {"s": "He feels sleepy now, for he got up early.", "stub": "He got", "a": ["He got up early, so he feels sleepy now.", "up early, so he feels sleepy now."], "u": 3}, {"s": "Nam doesn't jump as high as Tuan.", "stub": "Tuan jumps", "a": ["Tuan jumps higher than Nam.", "higher than Nam."], "u": 2}]}]}, {"id": "d11", "no": 11, "title": "Đề số 11", "acts": [{"id": "d11-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["n<u>oo</u>n", "f<u>u</u>ll", "f<u>oo</u>d", "sch<u>oo</u>l"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["p<u>u</u>sh", "m<u>o</u>ve", "w<u>o</u>lf", "sh<u>ou</u>ld"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["hands<u>o</u>me", "w<u>i</u>n", "s<u>u</u>rprise", "<u>u</u>pon"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>pre</u>dict", "gener<u>ou</u>s", "m<u>i</u>ss", "short<u>age</u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["enj<u>oy</u>", "p<u>oo</u>r", "m<u>oo</u>r", "t<u>ou</u>r"], "a": 0, "u": 3}]}, {"id": "d11-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My brother adores ___ with his dog in the park.", "o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"s": "Linh is not keen ___ messaging friends late at night.", "o": ["on", "at", "of", "with"], "a": 0, "u": 1}, {"s": "Mr Nam doesn't mind ___ the cows early in the morning.", "o": ["milks", "to milk", "milking", "milked"], "a": 2, "u": 1}, {"s": "She is really ___ knitting; she makes a scarf every week.", "o": ["into", "interesting", "in", "fond"], "a": 0, "u": 1}, {"s": "A combine harvester works ___ than villagers do by hand.", "o": ["fast", "more fastly", "faster", "fastest"], "a": 2, "u": 2}, {"s": "Buffaloes walk ___ than horses.", "o": ["slow", "slowly", "more slowly", "most slowly"], "a": 2, "u": 2}, {"s": "My cousin studies English ___ than I do.", "o": ["more hardly", "harder", "hardest", "hard"], "a": 1, "u": 2}, {"s": "The test was difficult; ___, Nam got a high mark.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "If it rains tomorrow, we ___ at home.", "o": ["stay", "will stay", "stayed", "would stay"], "a": 1, "u": 0}, {"s": "He felt ___ because his friends did not invite him to the party.", "o": ["delighted", "left out", "calm", "focused"], "a": 1, "u": 3}]}, {"id": "d11-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "My sister (knit) ___ a scarf every winter.", "a": ["knits"], "u": 1}, {"s": "Hoa fancies (join) ___ the chess club.", "a": ["joining"], "u": 1}, {"s": "Last Sunday, the villagers (gather) ___ the crop together.", "a": ["gathered"], "u": 2}, {"s": "My father (not like) ___ surfing the net.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "They (go) ___ to Ha Noi next week.", "a": ["will go"], "u": 0}]}, {"id": "d11-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He plays the guitar ___ than his brother. (GOOD)", "a": ["better"], "u": 2}, {"s": "I find knitting very ___. (RELAX)", "a": ["relaxing"], "u": 1}, {"s": "She feels great ___ after finishing the project. (SATISFY)", "a": ["satisfaction"], "u": 1}, {"s": "A strong ___ with friends helps teens feel happy. (CONNECT)", "a": ["connection"], "u": 3}, {"s": "The farmers get up ___ than city workers. (EARLY)", "a": ["earlier"], "u": 2}]}, {"id": "d11-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Lan is ___ on origami and folds paper every day.", "a": ["keen"], "u": 1}, {"s": "My brother is ___ about snowboarding.", "a": ["crazy"], "u": 1}, {"s": "Are you ___ in doing DIY?", "a": ["interested"], "u": 1}, {"s": "She is ___ of home-made cakes.", "a": ["fond"], "u": 1}, {"s": "I'm ___ knitting these days; I knit every evening.", "a": ["into"], "u": 1}], "box": ["fond", "keen", "interested", "crazy", "into"]}, {"id": "d11-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 1}, {"a": ["or"], "u": 1}, {"a": ["for"], "u": 1}, {"a": ["however"], "u": 3}, {"a": ["so"], "u": 3}], "box": ["and", "so", "however", "for", "or"], "passage": "Teenagers have many ways to spend their leisure time. Some like surfing the net {1} messaging friends. Do you prefer reading comics {2} doing puzzles? Many teens love outdoor games, {3} they are fun and good for health. It rained all day; {4}, the boys still played football in the yard. They were tired, {5} they went home early."}, {"id": "d11-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["herds", "herd", "herding", "herded"], "a": 0, "u": 2}, {"o": ["dry", "dries", "drying", "dried"], "a": 1, "u": 2}, {"o": ["peaceful", "more peaceful", "more peacefully", "most peacefully"], "a": 2, "u": 2}, {"o": ["play", "playing", "to playing", "played"], "a": 1, "u": 1}, {"o": ["Therefore", "However", "So", "For"], "a": 1, "u": 3}], "passage": "Minh lives in a small village near a vast paddy field. Every morning he {1} the buffaloes to the field before school. His father usually {2} rice in the yard after the harvest. People there live {3} than people in the city. Minh enjoys {4} football with his friends in the afternoon. {5}, he sometimes feels bored because there is no cinema.", "ptitle": "A day in a village"}, {"id": "d11-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Villagers / get up / early / and / go / the field / every morning.", "a": ["Villagers get up early and go to the field every morning."], "u": 2}, {"s": "A combine harvester / work / much / fast / than / a buffalo.", "a": ["A combine harvester works much faster than a buffalo."], "u": 2}, {"s": "Many villagers / love / herd / buffaloes / afternoon.", "a": ["Many villagers love herding buffaloes in the afternoon.", "Many villagers love to herd buffaloes in the afternoon."], "u": 1}, {"s": "Although / villagers / not have / modern machines / they / work / hard.", "a": ["Although villagers do not have modern machines, they work hard."], "u": 0}, {"s": "Life / village / be / peaceful / than / life / city.", "a": ["Life in the village is more peaceful than life in the city."], "u": 2}]}, {"id": "d11-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Lan twenty minutes to walk to the paddy field every day.", "stub": "Lan spends", "a": ["Lan spends twenty minutes walking to the paddy field every day.", "twenty minutes walking to the paddy field every day."], "u": 1}, {"s": "She loves knitting in her leisure time.", "stub": "She is fond", "a": ["She is fond of knitting in her leisure time.", "of knitting in her leisure time."], "u": 1}, {"s": "My brother hates doing puzzles.", "stub": "My brother isn't keen", "a": ["My brother isn't keen on doing puzzles.", "on doing puzzles."], "u": 1}, {"s": "Mai is tired now, for she worked in the orchard all day.", "stub": "Mai worked", "a": ["Mai worked in the orchard all day, so she is tired now.", "in the orchard all day, so she is tired now.", "Mai worked in the orchard all day; therefore, she is tired now.", "in the orchard all day; therefore, she is tired now."], "u": 3}, {"s": "Lan doesn't run as fast as her brother.", "stub": "Her brother", "a": ["Her brother runs faster than Lan.", "runs faster than Lan."], "u": 2}]}]}, {"id": "d12", "no": 12, "title": "Đề số 12", "acts": [{"id": "d12-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o</u>lf", "z<u>oo</u>", "sp<u>oo</u>n"  2}, {"s": "The boy sings ___ than any other child in the village.", "o": ["good", "well", "better", "best"], "a": 2, "u": 2}, {"s": "You must hurry, ___ you will miss the bus.", "o": ["so", "or else", "however", "and"], "a": 1, "u": 3}, {"s": "If you study hard, you ___ the midterm test.", "o": ["pass", "passed", "will pass", "would pass"], "a": 2, "u": 0}, {"s": "Students can browse the school ___ to find information about clubs.", "o": ["herd", "website", "orchard", "canal"], "a": 1, "u": 3}]}, {"id": "d12-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "My cousin (spend) ___ every weekend in the village.", "a": ["spends"], "u": 2}, {"s": "Linh adores (watch) ___ cartoons with her little brother.", "a": ["watching"], "u": 1}, {"s": "The farmers (plough) ___ the fields last week.", "a": ["ploughed"], "u": 2}, {"s": "He (not mind) ___ doing housework.", "a": ["does not mind", "doesn't mind"], "u": 1}, {"s": "Hoa (visit) ___ her grandparents tomorrow.", "a": ["will visit"], "u": 0}]}, {"id": "d12-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My brother speaks English ___ than I do. (FLUENT)", "a": ["more fluently"], "u": 2}, {"s": "Social media is a good way of ___ with friends. (COMMUNICATE)", "a": ["communicating"], "u": 3}, {"s": "She sat down and spoke ___ to her peers. (CALM)", "a": ["calmly"], "u": 3}, {"s": "Reading comics gives us a lot of ___. (ENJOY)", "a": ["enjoyment"], "u": 1}, {"s": "Villagers often walk ___ than city people. (FAR)", "a": ["farther", "further"], "u": 2}]}, {"id": "d12-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Is Hoa keen ___ knitting scarves?", "a": ["on"], "u": 1}, {"s": "He is not interested ___ playing chess.", "a": ["in"], "u": 1}, {"s": "My mother is fond ___ growing flowers.", "a": ["of"], "u": 1}, {"s": "I'm crazy ___ snowboarding.", "a": ["about"], "u": 1}, {"s": "Are you ___ doing puzzles?", "a": ["into"], "u": 1}], "box": ["on", "in", "of", "about", "into"]}, {"id": "d12-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 2}, {"a": ["or"], "u": 2}, {"a": ["so"], "u": 2}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["or", "and", "so", "however", "for"], "passage": "In my village, people have a simple life. In the morning, they feed pigs {1} herd cattle. Do they gather the crop by hand {2}
