 the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My parents love ___ their garden at weekends.", "o": ["water", "watering", "watered", "waters"], "a": 1, "u": 1}, {"s": "She is interested ___ keeping a diary.", "o": ["in", "on", "of", "at"], "a": 0, "u": 1}, {"s": "Teenagers are fond ___ hanging out with friends.", "o": ["on", "at", "of", "with"], "a": 2, "u": 1}, {"s": "Mr Long ___ going out in the rain.", "o": ["dislikes", "keen", "fond", "interested"], "a": 0, "u": 1}, {"s": "City people walk ___ than country people.", "o": ["fast", "faster", "more fast", "fastest"], "a": 1, "u": 2}, {"s": "My cousin plays chess ___ than I do.", "o": ["good", "well", "better", "more good"], "a": 2, "u": 2}, {"s": "She worked hard, ___ she failed the test.", "o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"s": "The club was full; ___, I couldn't join it.", "o": ["therefore", "however", "but", "or"], "a": 0, "u": 3}, {"s": "You can use my phone ___ borrow my laptop.", "o": ["so", "but", "or", "for"], "a": 2, "u": 3}, {"s": "Our school has a ___ where students can post questions and share ideas.", "o": ["forum", "lighthouse", "herd", "orchard"], "a": 0, "u": 3}]}, {"id": "d7-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Nam often (read) ___ comics after school.", "a": ["reads"], "u": 1}, {"s": "We detest (stay) ___ indoors all day.", "a": ["staying"], "u": 1}, {"s": "My sister (not enjoy) ___ the party last Saturday.", "a": ["did not enjoy", "didn't enjoy"], "u": 1}, {"s": "Hoa is crazy about (collect) ___ stamps.", "a": ["collecting"], "u": 1}, {"s": "They (plough) ___ the fields every spring.", "a": ["plough"], "u": 2}]}, {"id": "d7-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Ann does her homework ___ than her brother. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "The ___ of life in the city is attractive. (CONVENIENT)", "a": ["convenience"], "u": 2}, {"s": "He is ___ to online games. (ADDICT)", "a": ["addicted"], "u": 1}, {"s": "The teacher's ___ helped me stay calm. (ADVISE)", "a": ["advice"], "u": 3}, {"s": "His ___ with the exam result made him smile. (SATISFY)", "a": ["satisfaction"], "u": 1}]}, {"id": "d7-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "I'm not crazy ___ going to the beach.", "a": ["about"], "u": 1}, {"s": "My brother is keen ___ fishing.", "a": ["on"], "u": 1}, {"s": "Would you like a drink ___ something to eat?", "a": ["or"], "u": 3}, {"s": "I was thirsty, ___ I drank some water.", "a": ["so"], "u": 3}, {"s": "She was nervous, ___ she had a test.", "a": ["for"], "u": 3}], "box": ["for", "or", "about", "on", "so"]}, {"id": "d7-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["hang"], "u": 1}, {"a": ["group"], "u": 1}, {"a": ["stressed"], "u": 3}, {"a": ["concentrate"], "u": 3}, {"a": ["balance"], "u": 1}], "box": ["hang", "group", "stressed", "balance", "concentrate"], "passage": "After school, I often {1} out with a small {2} of friends. When I feel {3}, I listen to music. It helps me {4} on my homework. I try to keep a {5} between study and fun."}, {"id": "d7-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"o": ["in", "on", "at", "of"], "a": 1, "u": 1}, {"o": ["drink", "drinking", "drank", "drinks"], "a": 1, "u": 1}, {"o": ["In", "At", "On", "By"], "a": 2, "u": 1}, {"o": ["so", "but", "or", "for"], "a": 0, "u": 3}], "passage": "People in Viet Nam have many leisure activities. Many people like {1} badminton in the park. Teenagers are keen {2} playing computer games and messaging friends. Older people prefer {3} tea and chatting with neighbours. {4} Saturdays, some families go to the countryside, {5} they can enjoy fresh air.", "ptitle": "Leisure activities in Viet Nam"}, {"id": "d7-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I adore playing the guitar. (crazy)", "a": ["I am crazy about playing the guitar."], "u": 1}, {"s": "He is a more patient teacher than my last one. (patiently)", "a": ["He teaches more patiently than my last teacher."], "u": 2}, {"s": "Lan likes cooking. (fond)", "a": ["Lan is fond of cooking."], "u": 1}, {"s": "Our school is older than yours. (newer)", "a": ["Your school is newer than ours."], "u": 2}, {"s": "It was late. We left the party. (so)", "a": ["It was late, so we left the party."], "u": 3}]}, {"id": "d7-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My mother spends thirty minutes cooking dinner every day.", "stub": "It takes", "a": ["It takes my mother thirty minutes to cook dinner every day.", "my mother thirty minutes to cook dinner every day."], "u": 1}, {"s": "Nam enjoys riding his bike at weekends.", "stub": "Nam is fond", "a": ["Nam is fond of riding his bike at weekends.", "of riding his bike at weekends."], "u": 1}, {"s": "She dislikes cleaning the house.", "stub": "She isn't keen", "a": ["She isn't keen on cleaning the house.", "on cleaning the house."], "u": 1}, {"s": "He feels dizzy, for he skipped breakfast.", "stub": "He skipped", "a": ["He skipped breakfast, so he feels dizzy.", "breakfast, so he feels dizzy."], "u": 3}, {"s": "Tom doesn't read as carefully as Mai.", "stub": "Mai reads", "a": ["Mai reads more carefully than Tom.", "more carefully than Tom."], "u": 2}]}]}, {"id": "d8", "no": 8, "title": "Đề số 8", "acts": [{"id": "d8-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>o<\/u>ve", "z<u>oo<\/u>", "l<u>oo<\/u>k", "fr<u>ui<\/u>t"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo<\/u>d", "c<u>oo<\/u>k", "w<u>ou<\/u>ld", "w<u>oo<\/u>d"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["cott<u>age<\/u>", "pict<u>u<\/u>re", "gener<u>ou<\/u>s", "sil<u>e<\/u>nt"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>i<\/u>n", "<u>pre<\/u>dict", "answ<u>e<\/u>r", "<u>de<\/u>cide"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["p<u>oi<\/u>nt", "<u>oi<\/u>l", "t<u>oy<\/u>", "p<u>oo<\/u>r"], "a": 3, "u": 3}]}, {"id": "d8-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Linh prefers ___ to music to watching TV.", "o": ["listen", "listening", "listened", "listens"], "a": 1, "u": 1}, {"s": "Is your brother keen ___ skateboarding?", "o": ["on", "in", "of", "with"], "a": 0, "u": 1}, {"s": "I'm really ___ playing board games. I play them every day.", "o": ["into", "in", "at", "of"], "a": 0, "u": 1}, {"s": "My mother ___ shopping online.", "o": ["enjoy", "enjoys", "enjoying", "to enjoy"], "a": 1, "u": 1}, {"s": "Nga walks ___ than her brother.", "o": ["slow", "more slowly", "slowlier", "slowest"], "a": 1, "u": 2}, {"s": "He did the test ___ than I did.", "o": ["bad", "badly", "worse", "more bad"], "a": 2, "u": 2}, {"s": "It was cold; ___, we went swimming.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "He lost his keys, ___ he couldn't open the door.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Study hard, ___ you will fail the exam.", "o": ["and", "so", "or else", "however"], "a": 2, "u": 3}, {"s": "Our grandparents live in a small ___ near a canal.", "o": ["village", "midterm", "account", "forum"], "a": 0, "u": 2}]}, {"id": "d8-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mai (not go) ___ to school yesterday.", "a": ["did not go", "didn't go"], "u": 1}, {"s": "My brother fancies (take) ___ up a new sport.", "a": ["taking"], "u": 1}, {"s": "Farmers (feed) ___ the pigs every morning.", "a": ["feed"], "u": 2}, {"s": "I don't mind (carry) ___ your bag.", "a": ["carrying"], "u": 1}, {"s": "She loves (paint) ___ pictures of flowers.", "a": ["painting", "to paint"], "u": 1}]}, {"id": "d8-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He runs ___ than his classmates. (FAST)", "a": ["faster"], "u": 2}, {"s": "Lan explains the lesson ___ than her friend. (CLEAR)", "a": ["more clearly"], "u": 2}, {"s": "Reading gives me great ___. (ENJOY)", "a": ["enjoyment"], "u": 1}, {"s": "It is a very ___ view of the lake. (PICTURE)", "a": ["picturesque"], "u": 2}, {"s": "Her ___ is well known in the village. (GENEROUS)", "a": ["generosity"], "u": 2}]}, {"id": "d8-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "I'm not interested ___ sports.", "a": ["in"], "u": 1}, {"s": "She is fond ___ animals.", "a": ["of"], "u": 1}, {"s": "My brother is crazy ___ football.", "a": ["about"], "u": 1}, {"s": "It was raining, ___ we stayed at home.", "a": ["so"], "u": 3}, {"s": "He is angry, ___ he lost his phone.", "a": ["for"], "u": 3}], "box": ["for", "so", "in", "of", "about"]}, {"id": "d8-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["craft"], "u": 1}, {"a": ["spend"], "u": 1}, {"a": ["fold"], "u": 1}, {"a": ["origami"], "u": 1}, {"a": ["relax"], "u": 1}], "box": ["craft", "spend", "fold", "origami", "relax"], "passage": "My favourite {1} is paper folding. I {2} about an hour on it every day. I like to {3} coloured paper into cranes and flowers. This Japanese art is called {4}. It helps me {5} after a long school day."}, {"id": "d8-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["so", "or", "but", "for"], "a": 1, "u": 3}, {"o": ["from", "at", "on", "with"], "a": 0, "u": 3}, {"o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"o": ["reduce", "reducing", "reduced", "reduces"], "a": 0, "u": 3}, {"o": ["good", "better", "more good", "best"], "a": 1, "u": 2}], "passage": "Many schools have clubs for teenagers. Students can join the English Club {1} the Science Club. In the clubs, students learn teamwork and make new friends. They also get advice {2} their leaders. Some students feel shy; {3}, they become more confident after a few weeks. Club activities help students {4} stress, so they can study {5}.", "ptitle": "Teen clubs"}, {"id": "d8-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My sister loves collecting stamps. (fond)", "a": ["My sister is fond of collecting stamps."], "u": 1}, {"s": "Tuan is a faster swimmer than Minh. (fast)", "a": ["Tuan swims faster than Minh."], "u": 2}, {"s": "I hate getting up early. (stand)", "a": ["I can't stand getting up early."], "u": 1}, {"s": "Math is easier than English for me. (harder)", "a": ["English is harder than math for me."], "u": 2}, {"s": "It was raining. We didn't go out. (so)", "a": ["It was raining, so we didn't go out."], "u": 3}]}, {"id": "d8-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "He spends an hour doing exercise every morning.", "stub": "It takes", "a": ["It takes him an hour to do exercise every morning.", "him an hour to do exercise every morning."], "u": 1}, {"s": "She likes playing tennis at the weekend.", "stub": "She is keen", "a": ["She is keen on playing tennis at the weekend.", "on playing tennis at the weekend."], "u": 1}, {"s": "My brother dislikes doing puzzles.", "stub": "My brother isn't fond", "a": ["My brother isn't fond of doing puzzles.", "of doing puzzles."], "u": 1}, {"s": "She is tired now, for she worked late last night.", "stub": "She worked", "a": ["She worked late last night, so she is tired now.", "late last night, so she is tired now."], "u": 3}, {"s": "Hoa doesn't cook as well as her mother.", "stub": "Her mother", "a": ["Her mother cooks better than Hoa.", "cooks better than Hoa."], "u": 2}]}]}, {"id": "d9", "no": 9, "title": "Đề số 9", "acts": [{"id": "d9-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo<\/u>d", "bl<u>ue<\/u>", "g<u>oo<\/u>se", "l<u>oo<\/u>k"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo<\/u>l", "g<u>oo<\/u>d", "w<u>oo<\/u>l", "f<u>oo<\/u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["bagg<u>age<\/u>", "gener<u>ou<\/u>s", "op<u>e<\/u>n", "pict<u>u<\/u>re"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>i<\/u>t", "sil<u>e<\/u>nt", "<u>pre<\/u>dict", "cour<u>age<\/u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo<\/u>r", "p<u>oo<\/u>r", "t<u>ou<\/u>rist", "v<u>oi<\/u>ce"], "a": 3, "u": 3}]}, {"id": "d9-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Minh is keen on ___ his bike in the park.", "o": ["ride", "riding", "to ride", "rode"], "a": 1, "u": 1}, {"s": "My brother is fond ___ cartoons.", "o": ["of", "on", "in", "at"], "a": 0, "u": 1}, {"s": "She is not interested ___ fashion.", "o": ["of", "on", "in", "at"], "a": 2, "u": 1}, {"s": "We don't mind ___ for you.", "o": ["wait", "waiting", "to wait", "waited"], "a": 1, "u": 1}, {"s": "The tractor runs ___ than the old machine.", "o": ["quiet", "more quiet", "more quietly", "quietest"], "a": 2, "u": 2}, {"s": "He speaks ___ than his brother.", "o": ["loud", "louder", "more loud", "loudest"], "a": 1, "u": 2}, {"s": "Nam is tired, ___ he keeps working.", "o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"s": "The sky was dark; ___, it didn't rain.", "o": ["therefore", "however", "so", "and"], "a": 1, "u": 3}, {"s": "I have a midterm test tomorrow, ___ I am studying tonight.", "o": ["but", "or", "so", "however"], "a": 2, "u": 3}, {"s": "The ___ shines over the sea to guide ships at night.", "o": ["lighthouse", "orchard", "forum", "ger"], "a": 0, "u": 2}]}, {"id": "d9-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mrs Hoa (milk) ___ cows every morning.", "a": ["milks"], "u": 2}, {"s": "I detest (eat) ___ out alone.", "a": ["eating"], "u": 1}, {"s": "Lan (not like) ___ climbing mountains.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "They (invite) ___ us to the party last Sunday.", "a": ["invited"], "u": 1}, {"s": "My cousin fancies (join) ___ the chess club.", "a": ["joining"], "u": 3}]}, {"id": "d9-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Fish swim ___ than people. (FAST)", "a": ["faster"], "u": 2}, {"s": "She sang ___ than anyone else in class. (BEAUTIFUL)", "a": ["more beautifully"], "u": 2}, {"s": "Our ___ was cancelled because of the rain. (COMPETE)", "a": ["competition"], "u": 3}, {"s": "The trip was very ___. (ENJOY)", "a": ["enjoyable"], "u": 3}, {"s": "My ___ with my friends is strong. (CONNECT)", "a": ["connection"], "u": 3}]}, {"id": "d9-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is really ___ rock music.", "a": ["into"], "u": 1}, {"s": "Hoa is interested ___ learning English.", "a": ["in"], "u": 1}, {"s": "He is fond ___ playing chess.", "a": ["of"], "u": 1}, {"s": "He studied hard, ___ he got a good mark.", "a": ["so"], "u": 3}, {"s": "I wanted to go out, ___ it was raining.", "a": ["but"], "u": 3}], "box": ["of", "but", "in", "so", "into"]}, {"id": "d9-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["early"], "u": 2}, {"a": ["cattle"], "u": 2}, {"a": ["poultry"], "u": 2}, {"a": ["than"], "u": 2}, {"a": ["ploughs"], "u": 2}], "box": ["early", "cattle", "poultry", "than", "ploughs"], "passage": "My uncle is a farmer. He gets up {1} every day. He feeds the {2} in the field and the {3} such as chickens and ducks near the house. He works harder {4} other farmers in the village. In spring, he {5} his fields with a buffalo."}, {"id": "d9-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["in", "at", "on", "of"], "a": 0, "u": 2}, {"o": ["but", "and", "so", "or"], "a": 1, "u": 3}, {"o": ["milk", "milking", "to milking", "milked"], "a": 1, "u": 2}, {"o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"o": ["relax", "relaxing", "relaxed", "relaxation"], "a": 2, "u": 1}], "passage": "Last month, our class went on a trip to the countryside. We visited a farm {1} a small village. The farmers were very friendly {2} hospitable. We tried {3} cows and feeding chickens. It was not easy, {4} we enjoyed it. We felt {5} after a day in the fresh air.", "ptitle": "A school trip to the countryside"}, {"id": "d9-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My brother loves skateboarding. (crazy)", "a": ["My brother is crazy about skateboarding."], "u": 1}, {"s": "She is a more patient listener than me. (patiently)", "a": ["She listens more patiently than I do."], "u": 2}, {"s": "Nam is fond of fishing. (adores)", "a": ["Nam adores fishing."], "u": 1}, {"s": "My bag is heavier than yours. (lighter)", "a": ["Your bag is lighter than mine."], "u": 2}, {"s": "He worked very hard. He failed the exam. (however)", "a": ["He worked very hard; however, he failed the exam."], "u": 3}]}, {"id": "d9-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "She spends forty minutes travelling to work every day.", "stub": "It takes", "a": ["It takes her forty minutes to travel to work every day.", "her forty minutes to travel to work every day."], "u": 1}, {"s": "They enjoy swimming in the sea.", "stub": "They are fond", "a": ["They are fond of swimming in the sea.", "of swimming in the sea."], "u": 1}, {"s": "He hates doing homework at night.", "stub": "He isn't keen", "a": ["He isn't keen on doing homework at night.", "on doing homework at night."], "u": 1}, {"s": "I'm hungry, for I skipped lunch.", "stub": "I skipped", "a": ["I skipped lunch, so I'm hungry.", "lunch, so I'm hungry."], "u": 3}, {"s": "Hoa doesn't work as hard as Nam.", "stub": "Nam works", "a": ["Nam works harder than Hoa.", "harder than Hoa."], "u": 2}]}]}, {"id": "d10", "no": 10, "title": "Đề số 10", "acts": [{"id": "d10-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>oo<\/u>n", "j<u>ui<\/u>ce", "m<u>oo<\/u>n", "l<u>oo<\/u>k"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oo<\/u>t", "l<u>oo<\/u>k", "w<u>oo<\/u>l", "w<u>oo<\/u>d"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sil<u>e<\/u>nt", "pict<u>u<\/u>re", "b<u>i<\/u>t", "fam<u>ou<\/u>s"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>u<\/u>rprise", "k<u>i<\/u>t", "vill<u>age<\/u>", "s<u>i<\/u>t"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>oi<\/u>l", "p<u>oo<\/u>r", "destr<u>oy<\/u>", "c<u>oi<\/u>n"], "a": 1, "u": 3}]}, {"id": "d10-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "We love ___ outdoors at weekends.", "o": ["be", "being", "been", "to being"], "a": 1, "u": 1}, {"s": "Is your sister keen ___ knitting?", "o": ["in", "on", "of", "about"], "a": 1, "u": 1}, {"s": "Lan adores ___ her grandmother in the kitchen.", "o": ["help", "to help", "helping", "helped"], "a": 2, "u": 1}, {"s": "My brother is ___ playing chess; he plays every evening.", "o": ["into", "in", "on", "at"], "a": 0, "u": 1}, {"s": "A bike moves ___ than a car.", "o": ["slow", "more slow", "more slowly", "slowliest"], "a": 2, "u": 2}, {"s": "Hoa speaks English ___ than I do.", "o": ["good", "well", "better", "more well"], "a": 2, "u": 2}, {"s": "My sister is shy; ___, she is a good speaker.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "I have a lot of schoolwork, ___ I feel stressed.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Would you like to join a school club ___ a sports team?", "o": ["so", "but", "or", "for"], "a": 2, "u": 3}, {"s": "Teenagers should balance schoolwork and ___ activities.", "o": ["leisure", "vast", "local", "cruel"], "a": 0, "u": 1}]}, {"id": "d10-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Binh often (play) ___ badminton after school.", "a": ["plays"], "u": 1}, {"s": "We enjoy (fly) ___ kites in the fields.", "a": ["flying"], "u": 2}, {"s": "Lan (not like) ___ crowded places.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "He (spend) ___ an hour surfing the net last night.", "a": ["spent"], "u": 1}, {"s": "They are interested in (learn) ___ new skills.", "a": ["learning"], "u": 3}]}, {"id": "d10-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He plays chess ___ than his sister. (WELL)", "a": ["better"], "u": 2}, {"s": "Mai drives ___ than her father. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "Speaking skills are important for ___ with other people. (COMMUNICATE)", "a": ["communication"], "u": 1}, {"s": "She felt ___ when she heard the good news. (DELIGHT)", "a": ["delighted"], "u": 3}, {"s": "Students need ___ to study well. (CONCENTRATE)", "a": ["concentration"], "u": 3}]}, {"id": "d10-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is keen ___ gardening.", "a": ["on"], "u": 1}, {"s": "He is crazy ___ video games.", "a": ["about"], "u": 1}, {"s": "I'm interested ___ science.", "a": ["in"], "u": 1}, {"s": "I like tea, ___ I don't like coffee.", "a": ["but"], "u": 3}, {"s": "He is ill, ___ he stays in bed.", "a": ["so"], "u": 3}], "box": ["on", "so", "about", "in", "but"]}, {"id": "d10-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["log"], "u": 3}, {"a": ["account"], "u": 3}, {"a": ["update"], "u": 3}, {"a": ["share"], "u": 3}, {"a": ["notification"], "u": 3}], "box": ["log", "account", "update", "share", "notification"], "passage": "Teenagers often {1} on to their social media {2} every day. They {3} their profiles every week, and they {4} news with friends. When they receive a {5}, they check it at once."}, {"id": "d10-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["but", "so", "or", "for"], "a": 0, "u": 3}, {"o": ["than", "as", "then", "that"], "a": 0, "u": 2}, {"o": ["so", "and", "or", "however"], "a": 1, "u": 3}, {"o": ["help", "helping", "to help", "helped"], "a": 1, "u": 1}, {"o": ["happy", "happily", "happier", "happiness"], "a": 0, "u": 2}], "passage": "Hanh lives in the city, {1} she often visits her grandparents in the countryside. Life there is quieter {2} life in the city. Her grandfather ploughs the fields, {3} her grandmother feeds the chickens. Hanh enjoys {4} them with the farm work. She feels very {5} in the village.", "ptitle": "A weekend in the countryside"}, {"id": "d10-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My brother likes making models. (keen)", "a": ["My brother is keen on making models."], "u": 1}, {"s": "Tom is a more skilful player than Nam. (skilfully)", "a": ["Tom plays more skilfully than Nam."], "u": 2}, {"s": "She hates going out at night. (dislikes)", "a": ["She dislikes going out at night."], "u": 1}, {"s": "This story is shorter than that one. (longer)", "a": ["That story is longer than this one."], "u": 2}, {"s": "He was very tired. He finished his work. (however)", "a": ["He was very tired; however, he finished his work."], "u": 3}]}, {"id": "d10-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My father spends half an hour reading the news every morning.", "stub": "It takes", "a": ["It takes my father half an hour to read the news every morning.", "my father half an hour to read the news every morning."], "u": 1}, {"s": "She loves playing the violin.", "stub": "She is fond", "a": ["She is fond of playing the violin.", "of playing the violin."], "u": 1}, {"s": "My sister dislikes being late.", "stub": "My sister isn't keen", "a": ["My sister isn't keen on being late.", "on being late."], "u": 1}, {"s": "He feels sleepy now, for he got up early.", "stub": "He got", "a": ["He got up early, so he feels sleepy now.", "up early, so he feels sleepy now."], "u": 3}, {"s": "Nam doesn't jump as high as Tuan.", "stub": "Tuan jumps", "a": ["Tuan jumps higher than Nam.", "higher than Nam."], "u": 2}]}]}, {"id": "d11", "no": 11, "title": "Đề số 11", "acts": [{"id": "d11-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["n<u>oo<\/u>n", "f<u>u<\/u>ll", "f<u>oo<\/u>d", "sch<u>oo<\/u>l"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["p<u>u<\/u>sh", "m<u>o<\/u>ve", "w<u>o<\/u>lf", "sh<u>ou<\/u>ld"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["hands<u>o<\/u>me", "w<u>i<\/u>n", "s<u>u<\/u>rprise", "<u>u<\/u>pon"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>pre<\/u>dict", "gener<u>ou<\/u>s", "m<u>i<\/u>ss", "short<u>age<\/u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["enj<u>oy<\/u>", "p<u>oo<\/u>r", "m<u>oo<\/u>r", "t<u>ou<\/u>r"], "a": 0, "u": 3}]}, {"id": "d11-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My brother adores ___ with his dog in the park.", "o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"s": "Linh is not keen ___ messaging friends late at night.", "o": ["on", "at", "of", "with"], "a": 0, "u": 1}, {"s": "Mr Nam doesn't mind ___ the cows early in the morning.", "o": ["milks", "to milk", "milking", "milked"], "a": 2, "u": 1}, {"s": "She is really ___ knitting; she makes a scarf every week.", "o": ["into", "interesting", "in", "fond"], "a": 0, "u": 1}, {"s": "A combine harvester works ___ than villagers do by hand.", "o": ["fast", "more fastly", "faster", "fastest"], "a": 2, "u": 2}, {"s": "Buffaloes walk ___ than horses.", "o": ["slow", "slowly", "more slowly", "most slowly"], "a": 2, "u": 2}, {"s": "My cousin studies English ___ than I do.", "o": ["more hardly", "harder", "hardest", "hard"], "a": 1, "u": 2}, {"s": "The test was difficult; ___, Nam got a high mark.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "I was tired, ___ I went to bed early.", "o": ["but", "however", "so", "or"], "a": 2, "u": 3}, {"s": "He felt ___ because his friends did not invite him to the party.", "o": ["delighted", "left out", "calm", "focused"], "a": 1, "u": 3}]}, {"id": "d11-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "My sister (knit) ___ a scarf every winter.", "a": ["knits"], "u": 1}, {"s": "Hoa fancies (join) ___ the chess club.", "a": ["joining"], "u": 1}, {"s": "Last Sunday, the villagers (gather) ___ the crop together.", "a": ["gathered"], "u": 2}, {"s": "My father (not like) ___ surfing the net.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "They detest (be) ___ late for class.", "a": ["being"], "u": 1}]}, {"id": "d11-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He plays the guitar ___ than his brother. (GOOD)", "a": ["better"], "u": 2}, {"s": "I find knitting very ___. (RELAX)", "a": ["relaxing"], "u": 1}, {"s": "She feels great ___ after finishing the project. (SATISFY)", "a": ["satisfaction"], "u": 1}, {"s": "A strong ___ with friends helps teens feel happy. (CONNECT)", "a": ["connection"], "u": 3}, {"s": "The farmers get up ___ than city workers. (EARLY)", "a": ["earlier"], "u": 2}]}, {"id": "d11-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Lan is ___ on origami and folds paper every day.", "a": ["keen"], "u": 1}, {"s": "My brother is ___ about snowboarding.", "a": ["crazy"], "u": 1}, {"s": "Are you ___ in doing DIY?", "a": ["interested"], "u": 1}, {"s": "She is ___ of home-made cakes.", "a": ["fond"], "u": 1}, {"s": "I'm ___ knitting these days; I knit every evening.", "a": ["into"], "u": 1}], "box": ["fond", "keen", "interested", "crazy", "into"]}, {"id": "d11-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 1}, {"a": ["or"], "u": 1}, {"a": ["for"], "u": 1}, {"a": ["however"], "u": 3}, {"a": ["so"], "u": 3}], "box": ["and", "so", "however", "for", "or"], "passage": "Teenagers have many ways to spend their leisure time. Some like surfing the net {1} messaging friends. Do you prefer reading comics {2} doing puzzles? Many teens love outdoor games, {3} they are fun and good for health. It rained all day; {4}, the boys still played football in the yard. They were tired, {5} they went home early."}, {"id": "d11-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["herds", "herd", "herding", "herded"], "a": 0, "u": 2}, {"o": ["dry", "dries", "drying", "dried"], "a": 1, "u": 2}, {"o": ["peaceful", "more peaceful", "more peacefully", "most peacefully"], "a": 2, "u": 2}, {"o": ["play", "playing", "to playing", "played"], "a": 1, "u": 1}, {"o": ["Therefore", "However", "So", "For"], "a": 1, "u": 3}], "passage": "Minh lives in a small village near a vast paddy field. Every morning he {1} the buffaloes to the field before school. His father usually {2} rice in the yard after the harvest. People there live {3} than people in the city. Minh enjoys {4} football with his friends in the afternoon. {5}, he sometimes feels bored because there is no cinema.", "ptitle": "A day in a village"}, {"id": "d11-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Villagers / get up / early / and / go / the field / every morning.", "a": ["Villagers get up early and go to the field every morning."], "u": 2}, {"s": "A combine harvester / work / much / fast / than / a buffalo.", "a": ["A combine harvester works much faster than a buffalo."], "u": 2}, {"s": "Many villagers / love / herd / buffaloes / afternoon.", "a": ["Many villagers love herding buffaloes in the afternoon.", "Many villagers love to herd buffaloes in the afternoon."], "u": 1}, {"s": "The weather / be / hot / however / farmers / still / work / the field.", "a": ["The weather is hot; however, farmers still work in the field."], "u": 3}, {"s": "Life / village / be / peaceful / than / life / city.", "a": ["Life in the village is more peaceful than life in the city."], "u": 2}]}, {"id": "d11-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Lan twenty minutes to walk to the paddy field every day.", "stub": "Lan spends", "a": ["Lan spends twenty minutes walking to the paddy field every day.", "twenty minutes walking to the paddy field every day."], "u": 1}, {"s": "She loves knitting in her leisure time.", "stub": "She is fond", "a": ["She is fond of knitting in her leisure time.", "of knitting in her leisure time."], "u": 1}, {"s": "My brother hates doing puzzles.", "stub": "My brother isn't keen", "a": ["My brother isn't keen on doing puzzles.", "on doing puzzles."], "u": 1}, {"s": "Mai is tired now, for she worked in the orchard all day.", "stub": "Mai worked", "a": ["Mai worked in the orchard all day, so she is tired now.", "in the orchard all day, so she is tired now.", "Mai worked in the orchard all day; therefore, she is tired now.", "in the orchard all day; therefore, she is tired now."], "u": 3}, {"s": "Lan doesn't run as fast as her brother.", "stub": "Her brother", "a": ["Her brother runs faster than Lan.", "runs faster than Lan."], "u": 2}]}]}, {"id": "d12", "no": 12, "title": "Đề số 12", "acts": [{"id": "d12-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o<\/u>lf", "z<u>oo<\/u>", "sp<u>oo<\/u>n", "g<u>oo<\/u>se"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["pr<u>o<\/u>ve", "w<u>o<\/u>man", "sh<u>ou<\/u>ld", "f<u>oo<\/u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>a<\/u>nana", "hands<u>o<\/u>me", "<u>u<\/u>pon", "w<u>i<\/u>n"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>i<\/u>t", "bal<u>a<\/u>nce", "<u>de<\/u>cide", "w<u>i<\/u>n"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou<\/u>r", "j<u>oy<\/u>", "enj<u>oy<\/u>", "v<u>oi<\/u>ce"], "a": 0, "u": 3}]}, {"id": "d12-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Do you fancy ___ origami this weekend?", "o": ["make", "to make", "making", "made"], "a": 2, "u": 1}, {"s": "My grandmother is fond ___ cooking for the whole family.", "o": ["of", "on", "in", "about"], "a": 0, "u": 1}, {"s": "Tom dislikes ___ up early on Sundays.", "o": ["get", "getting", "to get", "got"], "a": 1, "u": 1}, {"s": "Mai is ___ in paper folding, so she joins the Craft Club.", "o": ["keen", "crazy", "interested", "into"], "a": 2, "u": 1}, {"s": "The pigs eat ___ than the chickens on this farm.", "o": ["more quick", "more quickly", "quicklier", "most quickly"], "a": 1, "u": 2}, {"s": "My uncle drives ___ than my father does.", "o": ["more careful", "more carefully", "carefuller", "most carefully"], "a": 1, "u": 2}, {"s": "The boy sings ___ than any other child in the village.", "o": ["good", "well", "better", "best"], "a": 2, "u": 2}, {"s": "You must hurry, ___ you will miss the bus.", "o": ["so", "or else", "however", "and"], "a": 1, "u": 3}, {"s": "She loves painting, ___ her sister prefers music.", "o": ["but", "so", "or", "for"], "a": 0, "u": 3}, {"s": "Students can browse the school ___ to find information about clubs.", "o": ["herd", "website", "orchard", "canal"], "a": 1, "u": 3}]}, {"id": "d12-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "My cousin (spend) ___ every weekend in the village.", "a": ["spends"], "u": 2}, {"s": "Linh adores (watch) ___ cartoons with her little brother.", "a": ["watching"], "u": 1}, {"s": "The farmers (plough) ___ the fields last week.", "a": ["ploughed"], "u": 2}, {"s": "He (not mind) ___ doing housework.", "a": ["does not mind", "doesn't mind"], "u": 1}, {"s": "My parents (milk) ___ the cows every morning.", "a": ["milk"], "u": 2}]}, {"id": "d12-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My brother speaks English ___ than I do. (FLUENT)", "a": ["more fluently"], "u": 2}, {"s": "Social media is a good way of ___ with friends. (COMMUNICATE)", "a": ["communicating"], "u": 3}, {"s": "She sat down and spoke ___ to her peers. (CALM)", "a": ["calmly"], "u": 3}, {"s": "Reading comics gives us a lot of ___. (ENJOY)", "a": ["enjoyment"], "u": 1}, {"s": "Villagers often walk ___ than city people. (FAR)", "a": ["farther", "further"], "u": 2}]}, {"id": "d12-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Is Hoa keen ___ knitting scarves?", "a": ["on"], "u": 1}, {"s": "He is not interested ___ playing chess.", "a": ["in"], "u": 1}, {"s": "My mother is fond ___ growing flowers.", "a": ["of"], "u": 1}, {"s": "I'm crazy ___ snowboarding.", "a": ["about"], "u": 1}, {"s": "Are you ___ doing puzzles?", "a": ["into"], "u": 1}], "box": ["on", "in", "of", "about", "into"]}, {"id": "d12-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 2}, {"a": ["or"], "u": 2}, {"a": ["so"], "u": 2}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["or", "and", "so", "however", "for"], "passage": "In my village, people have a simple life. In the morning, they feed pigs {1} herd cattle. Do they gather the crop by hand {2} by machine? Now they use a harvester, {3} the work is much easier. It is a hard job; {4}, the villagers are always happy. They like village life, {5} it is peaceful and the air is fresh."}, {"id": "d12-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["of", "in", "on", "about"], "a": 0, "u": 1}, {"o": ["for", "so", "or", "but"], "a": 0, "u": 3}, {"o": ["spend", "spent", "spending", "to spending"], "a": 0, "u": 1}, {"o": ["on", "in", "at", "by"], "a": 0, "u": 3}, {"o": ["or", "for", "however", "but"], "a": 1, "u": 3}], "passage": "There are many clubs at our school. Hoa joins the Music Club because she is fond {1} singing. Her brother prefers the Football Club, {2} he is strong and quick. Both clubs help students {3} their free time well. Members practise {4} Saturday morning. They also learn teamwork, {5} it is a very important life skill.", "ptitle": "Teen clubs"}, {"id": "d12-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Children / countryside / enjoy / play / outdoors.", "a": ["Children in the countryside enjoy playing outdoors."], "u": 1}, {"s": "People / village / live / peaceful / than / people / city.", "a": ["People in the village live more peacefully than people in the city."], "u": 2}, {"s": "Farmers / harvest / rice / July / and / dry / it / yard.", "a": ["Farmers harvest rice in July and dry it in the yard."], "u": 2}, {"s": "The weather / be / bad / so / farmers / not go / the field.", "a": ["The weather is bad, so farmers do not go to the field."], "u": 3}, {"s": "Many teens / be / fond / hang out / with / friends.", "a": ["Many teens are fond of hanging out with friends."], "u": 1}]}, {"id": "d12-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Nam spends two hours doing his homework every night.", "stub": "It takes", "a": ["It takes Nam two hours to do his homework every night.", "Nam two hours to do his homework every night."], "u": 1}, {"s": "He loves collecting stamps.", "stub": "He is fond", "a": ["He is fond of collecting stamps.", "of collecting stamps."], "u": 1}, {"s": "Hoa dislikes getting up early.", "stub": "Hoa isn't keen", "a": ["Hoa isn't keen on getting up early.", "on getting up early."], "u": 1}, {"s": "The road is bad, for it rained heavily last night.", "stub": "It rained", "a": ["It rained heavily last night, so the road is bad.", "heavily last night, so the road is bad.", "It rained heavily last night; therefore, the road is bad.", "heavily last night; therefore, the road is bad."], "u": 3}, {"s": "A tractor doesn't move as slowly as a buffalo-drawn cart.", "stub": "A buffalo-drawn cart", "a": ["A buffalo-drawn cart moves more slowly than a tractor.", "moves more slowly than a tractor."], "u": 2}]}]}, {"id": "d13", "no": 13, "title": "Đề số 13", "acts": [{"id": "d13-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác
