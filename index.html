 the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My parents love ___ their garden at weekends.", "o": ["water", "watering", "watered", "waters"], "a": 1, "u": 1}, {"s": "She is interested ___ keeping a diary.", "o": ["in", "on", "of", "at"], "a": 0, "u": 1}, {"s": "Teenagers are fond ___ hanging out with friends.", "o": ["on", "at", "of", "with"], "a": 2, "u": 1}, {"s": "Mr Long ___ going out in the rain.", "o": ["dislikes", "keen", "fond", "interested"], "a": 0, "u": 1}, {"s": "City people walk ___ than country people.", "o": ["fast", "faster", "more fast", "fastest"], "a": 1, "u": 2}, {"s": "My cousin plays chess ___ than I do.", "o": ["good", "well", "better", "more good"], "a": 2, "u": 2}, {"s": "She worked hard, ___ she failed the test.", "o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"s": "The club was full; ___, I couldn't join it.", "o": ["therefore", "however", "but", "or"], "a": 0, "u": 3}, {"s": "You can use my phone ___ borrow my laptop.", "o": ["so", "but", "or", "for"], "a": 2, "u": 3}, {"s": "Our school has a ___ where students can post questions and share ideas.", "o": ["forum", "lighthouse", "herd", "orchard"], "a": 0, "u": 3}]}, {"id": "d7-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Nam often (read) ___ comics after school.", "a": ["reads"], "u": 1}, {"s": "We detest (stay) ___ indoors all day.", "a": ["staying"], "u": 1}, {"s": "My sister (not enjoy) ___ the party last Saturday.", "a": ["did not enjoy", "didn't enjoy"], "u": 1}, {"s": "Hoa is crazy about (collect) ___ stamps.", "a": ["collecting"], "u": 1}, {"s": "They (plough) ___ the fields every spring.", "a": ["plough"], "u": 2}]}, {"id": "d7-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Ann does her homework ___ than her brother. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "The ___ of life in the city is attractive. (CONVENIENT)", "a": ["convenience"], "u": 2}, {"s": "He is ___ to online games. (ADDICT)", "a": ["addicted"], "u": 1}, {"s": "The teacher's ___ helped me stay calm. (ADVISE)", "a": ["advice"], "u": 3}, {"s": "His ___ with the exam result made him smile. (SATISFY)", "a": ["satisfaction"], "u": 1}]}, {"id": "d7-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "I'm not crazy ___ going to the beach.", "a": ["about"], "u": 1}, {"s": "My brother is keen ___ fishing.", "a": ["on"], "u": 1}, {"s": "Would you like a drink ___ something to eat?", "a": ["or"], "u": 3}, {"s": "I was thirsty, ___ I drank some water.", "a": ["so"], "u": 3}, {"s": "She was nervous, ___ she had a test.", "a": ["for"], "u": 3}], "box": ["for", "or", "about", "on", "so"]}, {"id": "d7-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["hang"], "u": 1}, {"a": ["group"], "u": 1}, {"a": ["stressed"], "u": 3}, {"a": ["concentrate"], "u": 3}, {"a": ["balance"], "u": 1}], "box": ["hang", "group", "stressed", "balance", "concentrate"], "passage": "After school, I often {1} out with a small {2} of friends. When I feel {3}, I listen to music. It helps me {4} on my homework. I try to keep a {5} between study and fun."}, {"id": "d7-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"o": ["in", "on", "at", "of"], "a": 1, "u": 1}, {"o": ["drink", "drinking", "drank", "drinks"], "a": 1, "u": 1}, {"o": ["In", "At", "On", "By"], "a": 2, "u": 1}, {"o": ["so", "but", "or", "for"], "a": 0, "u": 3}], "passage": "People in Viet Nam have many leisure activities. Many people like {1} badminton in the park. Teenagers are keen {2} playing computer games and messaging friends. Older people prefer {3} tea and chatting with neighbours. {4} Saturdays, some families go to the countryside, {5} they can enjoy fresh air.", "ptitle": "Leisure activities in Viet Nam"}, {"id": "d7-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I adore playing the guitar. (crazy)", "a": ["I am crazy about playing the guitar."], "u": 1}, {"s": "He is a more patient teacher than my last one. (patiently)", "a": ["He teaches more patiently than my last teacher."], "u": 2}, {"s": "Lan likes cooking. (fond)", "a": ["Lan is fond of cooking."], "u": 1}, {"s": "Our school is older than yours. (newer)", "a": ["Your school is newer than ours."], "u": 2}, {"s": "It was late. We left the party. (so)", "a": ["It was late, so we left the party."], "u": 3}]}, {"id": "d7-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My mother spends thirty minutes cooking dinner every day.", "stub": "It takes", "a": ["It takes my mother thirty minutes to cook dinner every day.", "my mother thirty minutes to cook dinner every day."], "u": 1}, {"s": "Nam enjoys riding his bike at weekends.", "stub": "Nam is fond", "a": ["Nam is fond of riding his bike at weekends.", "of riding his bike at weekends."], "u": 1}, {"s": "She dislikes cleaning the house.", "stub": "She isn't keen", "a": ["She isn't keen on cleaning the house.", "on cleaning the house."], "u": 1}, {"s": "He feels dizzy, for he skipped breakfast.", "stub": "He skipped", "a": ["He skipped breakfast, so he feels dizzy.", "breakfast, so he feels dizzy."], "u": 3}, {"s": "Tom doesn't read as carefully as Mai.", "stub": "Mai reads", "a": ["Mai reads more carefully than Tom.", "more carefully than Tom."], "u": 2}]}]}, {"id": "d8", "no": 8, "title": "Đề số 8", "acts": [{"id": "d8-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>o<\/u>ve", "z<u>oo<\/u>", "l<u>oo<\/u>k", "fr<u>ui<\/u>t"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo<\/u>d", "c<u>oo<\/u>k", "w<u>ou<\/u>ld", "w<u>oo<\/u>d"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["cott<u>age<\/u>", "pict<u>u<\/u>re", "gener<u>ou<\/u>s", "sil<u>e<\/u>nt"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>i<\/u>n", "<u>pre<\/u>dict", "answ<u>e<\/u>r", "<u>de<\/u>cide"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["p<u>oi<\/u>nt", "<u>oi<\/u>l", "t<u>oy<\/u>", "p<u>oo<\/u>r"], "a": 3, "u": 3}]}, {"id": "d8-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Linh prefers ___ to music to watching TV.", "o": ["listen", "listening", "listened", "listens"], "a": 1, "u": 1}, {"s": "Is your brother keen ___ skateboarding?", "o": ["on", "in", "of", "with"], "a": 0, "u": 1}, {"s": "I'm really ___ playing board games. I play them every day.", "o": ["into", "in", "at", "of"], "a": 0, "u": 1}, {"s": "My mother ___ shopping online.", "o": ["enjoy", "enjoys", "enjoying", "to enjoy"], "a": 1, "u": 1}, {"s": "Nga walks ___ than her brother.", "o": ["slow", "more slowly", "slowlier", "slowest"], "a": 1, "u": 2}, {"s": "He did the test ___ than I did.", "o": ["bad", "badly", "worse", "more bad"], "a": 2, "u": 2}, {"s": "It was cold; ___, we went swimming.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "He lost his keys, ___ he couldn't open the door.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Study hard, ___ you will fail the exam.", "o": ["and", "so", "or else", "however"], "a": 2, "u": 3}, {"s": "Our grandparents live in a small ___ near a canal.", "o": ["village", "midterm", "account", "forum"], "a": 0, "u": 2}]}, {"id": "d8-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mai (not go) ___ to school yesterday.", "a": ["did not go", "didn't go"], "u": 1}, {"s": "My brother fancies (take) ___ up a new sport.", "a": ["taking"], "u": 1}, {"s": "Farmers (feed) ___ the pigs every morning.", "a": ["feed"], "u": 2}, {"s": "I don't mind (carry) ___ your bag.", "a": ["carrying"], "u": 1}, {"s": "She loves (paint) ___ pictures of flowers.", "a": ["painting", "to paint"], "u": 1}]}, {"id": "d8-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He runs ___ than his classmates. (FAST)", "a": ["faster"], "u": 2}, {"s": "Lan explains the lesson ___ than her friend. (CLEAR)", "a": ["more clearly"], "u": 2}, {"s": "Reading gives me great ___. (ENJOY)", "a": ["enjoyment"], "u": 1}, {"s": "It is a very ___ view of the lake. (PICTURE)", "a": ["picturesque"], "u": 2}, {"s": "Her ___ is well known in the village. (GENEROUS)", "a": ["generosity"], "u": 2}]}, {"id": "d8-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "I'm not interested ___ sports.", "a": ["in"], "u": 1}, {"s": "She is fond ___ animals.", "a": ["of"], "u": 1}, {"s": "My brother is crazy ___ football.", "a": ["about"], "u": 1}, {"s": "It was raining, ___ we stayed at home.", "a": ["so"], "u": 3}, {"s": "He is angry, ___ he lost his phone.", "a": ["for"], "u": 3}], "box": ["for", "so", "in", "of", "about"]}, {"id": "d8-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["craft"], "u": 1}, {"a": ["spend"], "u": 1}, {"a": ["fold"], "u": 1}, {"a": ["origami"], "u": 1}, {"a": ["relax"], "u": 1}], "box": ["craft", "spend", "fold", "origami", "relax"], "passage": "My favourite {1} is paper folding. I {2} about an hour on it every day. I like to {3} coloured paper into cranes and flowers. This Japanese art is called {4}. It helps me {5} after a long school day."}, {"id": "d8-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["so", "or", "but", "for"], "a": 1, "u": 3}, {"o": ["from", "at", "on", "with"], "a": 0, "u": 3}, {"o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"o": ["reduce", "reducing", "reduced", "reduces"], "a": 0, "u": 3}, {"o": ["good", "better", "more good", "best"], "a": 1, "u": 2}], "passage": "Many schools have clubs for teenagers. Students can join the English Club {1} the Science Club. In the clubs, students learn teamwork and make new friends. They also get advice {2} their leaders. Some students feel shy; {3}, they become more confident after a few weeks. Club activities help students {4} stress, so they can study {5}.", "ptitle": "Teen clubs"}, {"id": "d8-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My sister loves collecting stamps. (fond)", "a": ["My sister is fond of collecting stamps."], "u": 1}, {"s": "Tuan is a faster swimmer than Minh. (fast)", "a": ["Tuan swims faster than Minh."], "u": 2}, {"s": "I hate getting up early. (stand)", "a": ["I can't stand getting up early."], "u": 1}, {"s": "Math is easier than English for me. (harder)", "a": ["English is harder than math for me."], "u": 2}, {"s": "It was raining. We didn't go out. (so)", "a": ["It was raining, so we didn't go out."], "u": 3}]}, {"id": "d8-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "He spends an hour doing exercise every morning.", "stub": "It takes", "a": ["It takes him an hour to do exercise every morning.", "him an hour to do exercise every morning."], "u": 1}, {"s": "She likes playing tennis at the weekend.", "stub": "She is keen", "a": ["She is keen on playing tennis at the weekend.", "on playing tennis at the weekend."], "u": 1}, {"s": "My brother dislikes doing puzzles.", "stub": "My brother isn't fond", "a": ["My brother isn't fond of doing puzzles.", "of doing puzzles."], "u": 1}, {"s": "She is tired now, for she worked late last night.", "stub": "She worked", "a": ["She worked late last night, so she is tired now.", "late last night, so she is tired now."], "u": 3}, {"s": "Hoa doesn't cook as well as her mother.", "stub": "Her mother", "a": ["Her mother cooks better than Hoa.", "cooks better than Hoa."], "u": 2}]}]}, {"id": "d9", "no": 9, "title": "Đề số 9", "acts": [{"id": "d9-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo<\/u>d", "bl<u>ue<\/u>", "g<u>oo<\/u>se", "l<u>oo<\/u>k"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo<\/u>l", "g<u>oo<\/u>d", "w<u>oo<\/u>l", "f<u>oo<\/u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["bagg<u>age<\/u>", "gener<u>ou<\/u>s", "op<u>e<\/u>n", "pict<u>u<\/u>re"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>i<\/u>t", "sil<u>e<\/u>nt", "<u>pre<\/u>dict", "cour<u>age<\/u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo<\/u>r", "p<u>oo<\/u>r", "t<u>ou<\/u>rist", "v<u>oi<\/u>ce"], "a": 3, "u": 3}]}, {"id": "d9-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Minh is keen on ___ his bike in the park.", "o": ["ride", "riding", "to ride", "rode"], "a": 1, "u": 1}, {"s": "My brother is fond ___ cartoons.", "o": ["of", "on", "in", "at"], "a": 0, "u": 1}, {"s": "She is not interested ___ fashion.", "o": ["of", "on", "in", "at"], "a": 2, "u": 1}, {"s": "We don't mind ___ for you.", "o": ["wait", "waiting", "to wait", "waited"], "a": 1, "u": 1}, {"s": "The tractor runs ___ than the old machine.", "o": ["quiet", "more quiet", "more quietly", "quietest"], "a": 2, "u": 2}, {"s": "He speaks ___ than his brother.", "o": ["loud", "louder", "more loud", "loudest"], "a": 1, "u": 2}, {"s": "Nam is tired, ___ he keeps working.", "o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"s": "The sky was dark; ___, it didn't rain.", "o": ["therefore", "however", "so", "and"], "a": 1, "u": 3}, {"s": "I have a midterm test tomorrow, ___ I am studying tonight.", "o": ["but", "or", "so", "however"], "a": 2, "u": 3}, {"s": "The ___ shines over the sea to guide ships at night.", "o": ["lighthouse", "orchard", "forum", "ger"], "a": 0, "u": 2}]}, {"id": "d9-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mrs Hoa (milk) ___ cows every morning.", "a": ["milks"], "u": 2}, {"s": "I detest (eat) ___ out alone.", "a": ["eating"], "u": 1}, {"s": "Lan (not like) ___ climbing mountains.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "They (invite) ___ us to the party last Sunday.", "a": ["invited"], "u": 1}, {"s": "My cousin fancies (join) ___ the chess club.", "a": ["joining"], "u": 3}]}, {"id": "d9-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Fish swim ___ than people. (FAST)", "a": ["faster"], "u": 2}, {"s": "She sang ___ than anyone else in class. (BEAUTIFUL)", "a": ["more beautifully"], "u": 2}, {"s": "Our ___ was cancelled because of the rain. (COMPETE)", "a": ["competition"], "u": 3}, {"s": "The trip was very ___. (ENJOY)", "a": ["enjoyable"], "u": 3}, {"s": "My ___ with my friends is strong. (CONNECT)", "a": ["connection"], "u": 3}]}, {"id": "d9-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is really ___ rock music.", "a": ["into"], "u": 1}, {"s": "Hoa is interested ___ learning English.", "a": ["in"], "u": 1}, {"s": "He is fond ___ playing chess.", "a": ["of"], "u": 1}, {"s": "He studied hard, ___ he got a good mark.", "a": ["so"], "u": 3}, {"s": "I wanted to go out, ___ it was raining.", "a": ["but"], "u": 3}], "box": ["of", "but", "in", "so", "into"]}, {"id": "d9-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["early"], "u": 2}, {"a": ["cattle"], "u": 2}, {"a": ["poultry"], "u": 2}, {"a": ["than"], "u": 2}, {"a": ["ploughs"], "u": 2}], "box": ["early", "cattle", "poultry", "than", "ploughs"], "passage": "My uncle is a farmer. He gets up {1} every day. He feeds the {2} in the field and the {3} such as chickens and ducks near the house. He works harder {4} other farmers in the village. In spring, he {5} his fields with a buffalo."}, {"id": "d9-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["in", "at", "on", "of"], "a": 0, "u": 2}, {"o": ["but", "and", "so", "or"], "a": 1, "u": 3}, {"o": ["milk", "milking", "to milking", "milked"], "a": 1, "u": 2}, {"o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"o": ["relax", "relaxing", "relaxed", "relaxation"], "a": 2, "u": 1}], "passage": "Last month, our class went on a trip to the countryside. We visited a farm {1} a small village. The farmers were very friendly {2} hospitable. We tried {3} cows and feeding chickens. It was not easy, {4} we enjoyed it. We felt {5} after a day in the fresh air.", "ptitle": "A school trip to the countryside"}, {"id": "d9-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My brother loves skateboarding. (crazy)", "a": ["My brother is crazy about skateboarding."], "u": 1}, {"s": "She is a more patient listener than me. (patiently)", "a": ["She listens more patiently than I do."], "u": 2}, {"s": "Nam is fond of fishing. (adores)", "a": ["Nam adores fishing."], "u": 1}, {"s": "My bag is heavier than yours. (lighter)", "a": ["Your bag is lighter than mine."], "u": 2}, {"s": "He worked very hard. He failed the exam. (however)", "a": ["He worked very hard; however, he failed the exam."], "u": 3}]}, {"id": "d9-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "She spends forty minutes travelling to work every day.", "stub": "It takes", "a": ["It takes her forty minutes to travel to work every day.", "her forty minutes to travel to work every day."], "u": 1}, {"s": "They enjoy swimming in the sea.", "stub": "They are fond", "a": ["They are fond of swimming in the sea.", "of swimming in the sea."], "u": 1}, {"s": "He hates doing homework at night.", "stub": "He isn't keen", "a": ["He isn't keen on doing homework at night.", "on doing homework at night."], "u": 1}, {"s": "I'm hungry, for I skipped lunch.", "stub": "I skipped", "a": ["I skipped lunch, so I'm hungry.", "lunch, so I'm hungry."], "u": 3}, {"s": "Hoa doesn't work as hard as Nam.", "stub": "Nam works", "a": ["Nam works harder than Hoa.", "harder than Hoa."], "u": 2}]}]}, {"id": "d10", "no": 10, "title": "Đề số 10", "acts": [{"id": "d10-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>oo<\/u>n", "j<u>ui<\/u>ce", "m<u>oo<\/u>n", "l<u>oo<\/u>k"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oo<\/u>t", "l<u>oo<\/u>k", "w<u>oo<\/u>l", "w<u>oo<\/u>d"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sil<u>e<\/u>nt", "pict<u>u<\/u>re", "b<u>i<\/u>t", "fam<u>ou<\/u>s"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>u<\/u>rprise", "k<u>i<\/u>t", "vill<u>age<\/u>", "s<u>i<\/u>t"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>oi<\/u>l", "p<u>oo<\/u>r", "destr<u>oy<\/u>", "c<u>oi<\/u>n"], "a": 1, "u": 3}]}, {"id": "d10-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "We love ___ outdoors at weekends.", "o": ["be", "being", "been", "to being"], "a": 1, "u": 1}, {"s": "Is your sister keen ___ knitting?", "o": ["in", "on", "of", "about"], "a": 1, "u": 1}, {"s": "Lan adores ___ her grandmother in the kitchen.", "o": ["help", "to help", "helping", "helped"], "a": 2, "u": 1}, {"s": "My brother is ___ playing chess; he plays every evening.", "o": ["into", "in", "on", "at"], "a": 0, "u": 1}, {"s": "A bike moves ___ than a car.", "o": ["slow", "more slow", "more slowly", "slowliest"], "a": 2, "u": 2}, {"s": "Hoa speaks English ___ than I do.", "o": ["good", "well", "better", "more well"], "a": 2, "u": 2}, {"s": "My sister is shy; ___, she is a good speaker.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "I have a lot of schoolwork, ___ I feel stressed.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Would you like to join a school club ___ a sports team?", "o": ["so", "but", "or", "for"], "a": 2, "u": 3}, {"s": "Teenagers should balance schoolwork and ___ activities.", "o": ["leisure", "vast", "local", "cruel"], "a": 0, "u": 1}]}, {"id": "d10-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Binh often (play) ___ badminton after school.", "a": ["plays"], "u": 1}, {"s": "We enjoy (fly) ___ kites in the fields.", "a": ["flying"], "u": 2}, {"s": "Lan (not like) ___ crowded places.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "He (spend) ___ an hour surfing the net last night.", "a": ["spent"], "u": 1}, {"s": "They are interested in (learn) ___ new skills.", "a": ["learning"], "u": 3}]}, {"id": "d10-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He plays chess ___ than his sister. (WELL)", "a": ["better"], "u": 2}, {"s": "Mai drives ___ than her father. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "Speaking skills are important for ___ with other people. (COMMUNICATE)", "a": ["communication"], "u": 1}, {"s": "She felt ___ when she heard the good news. (DELIGHT)", "a": ["delighted"], "u": 3}, {"s": "Students need ___ to study well. (CONCENTRATE)", "a": ["concentration"], "u": 3}]}, {"id": "d10-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is keen ___ gardening.", "a": ["on"], "u": 1}, {"s": "He is crazy ___ video games.", "a": ["about"], "u": 1}, {"s": "I'm interested ___ science.", "a": ["in"], "u": 1}, {"s": "I like tea, ___ I don't like coffee.", "a": ["but"], "u": 3}, {"s": "He is ill, ___ he stays in bed.", "a": ["so"], "u": 3}], "box": ["on", "so", "about", "in", "but"]}, {"id": "d10-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["log"], "u": 3}, {"a": ["account"], "u": 3}, {"a": ["update"], "u": 3}, {"a": ["share"], "u": 3}, {"a": ["notification"], "u": 3}], "box": ["log", "account", "update", "share", "notification"], "passage": "Teenagers often {1} on to their social media {2} every day. They {3} their profiles every week, and they {4} news with friends. When they receive a {5}, they check it at once."}, {"id": "d10-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["but", "so", "or", "for"], "a": 0, "u": 3}, {"o": ["than", "as", "then", "that"], "a": 0, "u": 2}, {"o": ["so", "and", "or", "however"], "a": 1, "u": 3}, {"o": ["help", "helping", "to help   } else if (a.type === 'type') {
    h = '<li class="q"><span class="no">' + no + '</span><div class="qb"><p class="qs">' + esc(it.s) + '</p>' +
      (it.stub ? '<p class="stub">Bắt đầu bằng: <b>' + esc(it.stub) + '</b></p>' : '') +
      '<textarea class="ty" rows="2" data-q="' + k + '" id="i-' + a.id + '-' + k + '" autocomplete="off" spellcheck="false" aria-label="Câu ' + no + '"></textarea></div>' + un + '</li>';
  }
  return h;
}
function passHTML(a) {
  var t = esc(a.passage);
  a.items.forEach(function (it, k) {
    var no = a.start + k, ctl;
    if (a.type === 'pgap') ctl = '<span class="pb"><i>' + no + '</i><input class="gp" type="text" data-q="' + k + '" id="i-' + a.id + '-' + k + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chỗ trống ' + no + '"></span>';
    else ctl = '<span class="pb"><i>' + no + '</i><select class="sl" data-q="' + k + '" id="i-' + a.id + '-' + k + '" aria-label="Chỗ trống ' + no + '"><option value="">Chọn</option>' +
      it.o.map(function (o, j) { return '<option value="' + j + '">' + 'ABCD'.charAt(j) + '. ' + esc(o) + '</option>'; }).join('') + '</select></span>';
    t = t.replace('{' + (k + 1) + '}', ctl);
  });
  return '<div class="pass">' + (a.ptitle ? '<h4>' + esc(a.ptitle) + '</h4>' : '') + '<p>' + t + '</p></div>' +
    '<p class="unrow">' + a.items.map(function (it, k) { return '<span class="un">' + (a.start + k) + ': Unit ' + it.u + '</span>'; }).join('') + '</p>';
}
function actHTML(a) {
  var h = '<section class="act" data-act="' + a.id + '"><div class="ah"><div><h3>' + esc(a.title) + '</h3><p class="instr">' + esc(a.instr) + '</p></div><div class="stars" aria-label="Sao">' + stars(a.id) + '</div></div>';
  if (a.box) h += '<ul class="box" aria-label="Khung từ">' + a.box.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>';
  if (a.passage) h += passHTML(a);
  else h += '<ol class="ql">' + a.items.map(function (it, k) { return itemHTML(a, it, k); }).join('') + '</ol>';
  h += '<p class="rule">Em làm hết các câu rồi bấm Kiểm tra. Câu sai sẽ hiện đáp án đúng. Muốn làm lại, em phải làm lại cả bài từ đầu.</p>';
  h += '<div class="fb" hidden></div><div class="bt"><button type="button" class="btn pri" data-do="check">Kiểm tra</button><button type="button" class="btn" data-do="reset">Làm lại cả bài</button></div></section>';
  return h;
}

/* ---------- man hinh ---------- */
function homeView() {
  var h = '<header class="top"><p class="brand">Dịch vụ gia sư và dạy kèm Hoa Dũng</p><h1>Ôn tập Tiếng Anh 8</h1><p class="sub">Unit 1, 2, 3 · 10 đề, mỗi đề 50 câu</p></header>';
  h += '<section class="who"><h2>Thông tin của em</h2><div class="row"><label for="ten">Họ và tên<input id="ten" type="text" value="' + esc(me.ten) + '" autocomplete="name"></label><label for="lop">Lớp<input id="lop" type="text" value="' + esc(me.lop) + '" autocomplete="off"></label></div>' +
    '<p class="note">Kết quả mỗi lần kiểm tra được gửi về cho thầy' + (WEB ? '' : ' khi thầy kết nối Google Sheets') + '. Làm đúng hết cả phần là Hoàn thành; còn câu sai là Chưa hoàn thành, em làm lại cả phần để hoàn thành.</p></section>';
  h += '<section><h2>Bảng ngữ pháp</h2><div class="grid3">' + GR.map(function (g) { return '<a class="card gcard" href="#' + g.id + '"><b>' + g.title + '</b><span>' + esc(g.topic) + '</span></a>'; }).join('') + '</div></section>';
  h += '<section><h2>Đề ôn tập</h2><div class="grid">' + DES.map(function (d) {
    var s = deStat(d);
    return '<a class="card dcard" href="#' + d.id + '"><b>' + d.title + '</b><span>' + s.done + '/9 phần đúng hết</span><span class="mini">' + s.st + '/27 sao</span></a>';
  }).join('') + '</div></section>';
  return h;
}
function grammarView(g) {
  var h = '<a class="back" href="#home">Về trang chính</a><header class="top"><p class="brand">Bảng ngữ pháp</p><h1>' + g.title + '</h1><p class="sub">' + esc(g.topic) + '</p></header><div class="gl">';
  g.cards.forEach(function (c) {
    h += '<article class="gc"><h3>' + icon(c.icon) + '<span>' + esc(c.h) + '</span></h3>' + c.body.map(function (b) { return '<p>' + b + '</p>'; }).join('') + (c.tip ? '<p class="tip"><b>Mẹo:</b> ' + esc(c.tip) + '</p>' : '') + '</article>';
  });
  h += '</div><nav class="pn">' + GR.map(function (x) { return '<a class="' + (x.id === g.id ? 'cur' : '') + '" href="#' + x.id + '">' + x.title + '</a>'; }).join('') + '<a href="#home">Đề ôn tập</a></nav>';
  return h;
}
function deView(d) {
  var t = curTab[d.id] || 0;
  var h = '<a class="back" href="#home">Về trang chính</a><header class="top"><p class="brand">Ôn tập giữa học kì I · Tiếng Anh 8</p><h1>' + d.title + '</h1></header><nav class="tabs" role="tablist">' +
    d.acts.map(function (a, i) {
      var p = prog[a.id], ok = p && p.best >= p.total;
      return '<button type="button" role="tab" class="tab' + (i === t ? ' cur' : '') + (ok ? ' done' : '') + '" data-tab="' + i + '" aria-selected="' + (i === t) + '">' + a.part + '</button>';
    }).join('') + '</nav><div id="actbox">' + actHTML(d.acts[t]) + '</div>';
  return h;
}

/* ---------- cham bai ---------- */
function findAct(id) {
  for (var i = 0; i < DES.length; i++) for (var j = 0; j < DES[i].acts.length; j++) if (DES[i].acts[j].id === id) return DES[i].acts[j];
}
function ctl(sec, k) { return sec.querySelector('[data-q="' + k + '"]'); }
function evalItem(a, sec, k) {
  var it = a.items[k], el = ctl(sec, k);
  if (a.type === 'choice') { var s = el.getAttribute('data-sel'); if (s === null || s === '') return null; return +s === it.a; }
  if (a.type === 'pchoice') { if (el.value === '') return null; return +el.value === it.a; }
  var v = el.value.trim(); if (!v) return null;
  if (a.type === 'pgap' || a.type === 'gap') return match(a, it, v);
  return match(a, it, v);
}
function lockOK(a, sec, k) {
  var el = ctl(sec, k);
  if (a.type === 'choice') { el.classList.add('ok'); el.classList.remove('bad'); el.querySelectorAll('.opt').forEach(function (b) { b.disabled = true; }); }
  else { el.classList.add('ok'); el.classList.remove('bad'); if (el.tagName === 'SELECT') el.disabled = true; else el.readOnly = true; }
}
function markBad(a, sec, k) { ctl(sec, k).classList.add('bad'); }
function insAns(el, text) { if (el.parentNode.querySelector('.ans')) return; var s = document.createElement('span'); s.className = 'ans'; s.textContent = 'Đáp án: ' + text; el.insertAdjacentElement('afterend', s); }
function lockWrong(a, sec, k) {
  var el = ctl(sec, k), it = a.items[k];
  if (a.type === 'choice') {
    el.classList.add('bad');
    el.querySelectorAll('.opt').forEach(function (b) { if (+b.getAttribute('data-o') === it.a) b.classList.add('key'); b.disabled = true; });
  } else if (a.type === 'pchoice') {
    el.classList.add('bad'); el.disabled = true; insAns(el, 'ABCD'.charAt(it.a) + '. ' + it.o[it.a]);
  } else {
    el.classList.add('bad'); if (el.tagName === 'SELECT') el.disabled = true; else el.readOnly = true; insAns(el, it.a[0]);
  }
}
function send(a, dung, tong) {
  if (!WEB) return;
  var p = new URLSearchParams({ ten: me.ten, lop: me.lop, unit: a.id.split('-')[0].replace('d', 'De '), bai: a.id, tieude: a.title, dung: dung, tong: tong, diem: (Math.round(dung / tong * 100) / 10).toFixed(1), sao: (dung / tong >= 1 ? 3 : dung / tong >= 0.9 ? 2 : dung / tong >= 0.8 ? 1 : 0) });
  var url = WEB + (WEB.indexOf('?') < 0 ? '?' : '&') + p.toString();
  try { fetch(url, { mode: 'no-cors' }).catch(function () { showSend(a, url); }); } catch (e) { showSend(a, url); }
}
function showSend(a, url) {
  var sec = root.querySelector('[data-act="' + a.id + '"]'); if (!sec) return;
  var fb = sec.querySelector('.fb'); fb.insertAdjacentHTML('beforeend', '<p><a class="lnk" target="_blank" rel="noopener" href="' + esc(url) + '">Gửi điểm cho thầy</a></p>');
}
/* "Cach lam": cau dau hien san, phan con lai de trong muc Xem them */
function howHTML(h) {
  var s = String(h || '').trim(); if (!s) return '';
  var i = s.search(/[.!?]\s/), first = i < 0 ? s : s.slice(0, i + 1), rest = i < 0 ? '' : s.slice(i + 1).trim();
  return '<p class="how"><b>Cách làm:</b> ' + esc(first) + '</p>' +
    (rest ? '<details class="more"><summary>Xem thêm</summary><p class="how">' + esc(rest) + '</p></details>' : '');
}
/* Kiem tra DUNG MOT LAN cho ca bai: sai thi khoa + hien dap an; muon lam lai phai bam "Lam lai ca bai" */
function check(a, sec) {
  var n = a.items.length, k, fb = sec.querySelector('.fb');
  if (!String(me.ten || '').trim()) {
    fb.hidden = false; fb.className = 'fb stop';
    fb.innerHTML = '<p><b>Em chưa nhập họ tên.</b> Em về trang chính, nhập họ tên và lớp rồi quay lại làm bài để điểm được ghi cho em.</p><p><a class="lnk" href="#home">Về trang chính</a></p>';
    return;
  }
  var blank = [];
  for (k = 0; k < n; k++) if (evalItem(a, sec, k) === null) blank.push(a.start + k);
  if (blank.length) {
    fb.hidden = false; fb.className = 'fb stop';
    fb.innerHTML = '<p><b>Em chưa làm xong.</b> Còn ' + blank.length + ' câu chưa trả lời (câu ' + blank.join(', ') + '). Em làm hết rồi mới bấm Kiểm tra.</p>';
    return;
  }
  var dung = 0, wrong = 0;
  for (k = 0; k < n; k++) {
    if (evalItem(a, sec, k) === true) { dung++; lockOK(a, sec, k); } else { wrong++; lockWrong(a, sec, k); }
  }
  var p = prog[a.id] || (prog[a.id] = { first: dung, total: n, best: dung, lan: 0 });
  p.total = n; p.lan = (p.lan || 0) + 1; p.last = dung; if (dung > p.best) p.best = dung;
  ls('hd_prog', prog);
  send(a, dung, n);
  fb.hidden = false;
  if (wrong === 0) {
    fb.className = 'fb good';
    fb.innerHTML = '<p><b>Em đã làm đúng hết ' + n + ' câu.</b> Phần này được ghi nhận là <b>Hoàn thành</b>.</p><p>Em có thể bấm Làm lại cả bài để luyện thêm.</p>';
  } else {
    fb.className = 'fb warn';
    fb.innerHTML = '<p>Em đúng <b>' + dung + '/' + n + '</b> câu. Phần này được ghi nhận là <b>Chưa hoàn thành</b>.</p>' +
      '<p>Các câu sai đã được khóa và hiện đáp án đúng. Em đọc đáp án và làm theo cách làm dưới đây để hiểu vì sao chọn như vậy.</p>' + howHTML(a.huong) +
      '<p>Muốn hoàn thành, em bấm Làm lại cả bài và làm lại từ câu đầu tiên.</p>';
  }
  sec.querySelector('[data-do="check"]').hidden = true;
  sec.querySelector('.stars').innerHTML = stars(a.id);
  var tab = root.querySelector('.tab.cur'); if (tab && prog[a.id] && prog[a.id].best >= prog[a.id].total) tab.classList.add('done');
}

/* ---------- su kien ---------- */
var view = '';
function route() {
  var h = (location.hash || '#home').slice(1) || 'home', html = '';
  var g = GR.filter(function (x) { return x.id === h; })[0], d = DES.filter(function (x) { return x.id === h; })[0];
  if (g) { html = grammarView(g); } else if (d) { html = deView(d); } else { h = 'home'; html = homeView(); }
  view = h; root.innerHTML = html; window.scrollTo(0, 0);
}
root.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  var sec = t.closest('.act');
  if (t.classList.contains('opt')) {
    var q = t.closest('.q'); if (t.disabled) return;
    q.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('sel'); }); t.classList.add('sel');
    q.setAttribute('data-sel', t.getAttribute('data-o')); q.classList.remove('bad'); return;
  }
  if (t.hasAttribute('data-tab')) {
    var dd = DES.filter(function (x) { return x.id === view; })[0]; if (!dd) return;
    curTab[dd.id] = +t.getAttribute('data-tab'); root.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('cur'); b.setAttribute('aria-selected', 'false'); });
    t.classList.add('cur'); t.setAttribute('aria-selected', 'true');
    document.getElementById('actbox').innerHTML = actHTML(dd.acts[curTab[dd.id]]); return;
  }
  if (!sec) return;
  var a = findAct(sec.getAttribute('data-act'));
  if (t.getAttribute('data-do') === 'check') check(a, sec);
  if (t.getAttribute('data-do') === 'reset') { mem[a.id] = {}; sec.outerHTML = actHTML(a); }
});
root.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'ten' || el.id === 'lop') { me.ten = (document.getElementById('ten') || {}).value || ''; me.lop = (document.getElementById('lop') || {}).value || ''; ls('hd_me', me); return; }
  if (el.classList && el.hasAttribute('data-q')) el.classList.remove('bad');
});
root.addEventListener('change', function (e) { var el = e.target; if (el.tagName === 'SELECT') el.classList.remove('bad'); });
window.addEventListener('hashchange', route);
route();
window.__hd = { DES: DES, norm: norm, match: match };
})();
</script>
