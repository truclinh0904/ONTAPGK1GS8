c3": 1}, {"s": "Nam stayed at home because he had a headache.", "a": 0, "u": 3, "hint": "because đổi qua lại với so: đổi vị trí hai vế.", "o": ["Nam had a headache, so he stayed at home.", "Nam had a headache, so he stayed in home.", "Nam had headache, so he stayed at home."], "c3": 1}]}]}, {"id": "d27", "no": 27, "title": "Đề số 27", "acts": [{"id": "d27-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["p<u>oo</u>l", "p<u>u</u>sh", "f<u>oo</u>d", "t<u>oo</u>th"], "a": 1, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["fr<u>ui</u>t", "c<u>ou</u>ld", "f<u>u</u>ll", "g<u>oo</u>d"], "a": 0, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>u</u>pon", "b<u>i</u>t", "pict<u>u</u>re", "bal<u>a</u>nce"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["pict<u>u</u>re", "short<u>age</u>", "bagg<u>age</u>", "s<u>i</u>t"], "a": 0, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou</u>rist", "t<u>ou</u>r", "m<u>oo</u>r", "<u>oi</u>l"], "a": 3, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ʊə/, một từ đọc /ɔɪ/. Chọn từ đọc /ɔɪ/."}]}, {"id": "d27-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Linh doesn't mind ___ the club's posters for the festival.", "o": ["drawing", "drew", "to draw", "draw"], "a": 0, "u": 1, "hint": "Sau doesn't mind dùng V-ing."}, {"s": "Linh sings ___ than her classmates, so she is the club's leader.", "o": ["gooder", "better", "more good", "best"], "a": 1, "u": 2, "hint": "Có than: so sánh hơn bất quy tắc better."}, {"s": "The club meets twice a week, ___ the members practise together.", "o": ["and", "or else", "however", "but"], "a": 0, "u": 3, "hint": "Hai việc cùng hướng, thêm ý: and."}, {"s": "You must be on time, ___ you cannot join the show.", "o": ["or else", "and", "so", "but"], "a": 0, "u": 3, "hint": "Phải đúng giờ, nếu không không được tham gia: or else."}, {"s": "Our music teacher is very ___ ; she never gets angry.", "o": ["partner", "parent", "pattern", "patient"], "a": 3, "u": 1, "hint": "Cô giáo không bao giờ nổi giận: patient (kiên nhẫn)."}, {"s": "Minh is the ___ of the drama club; he organises every rehearsal.", "o": ["ladder", "leader", "lesson", "lawyer"], "a": 1, "u": 1, "hint": "Người tổ chức buổi diễn tập là leader (trưởng nhóm)."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Tom is <u>interested in</u> photography.", "o": ["afraid of", "keen on", "bad at", "tired of"], "a": 1, "u": 1, "hint": "interested in gần nghĩa với keen on."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: Hoa is <u>shy</u> in front of people.", "o": ["quiet", "polite", "confident", "kind"], "a": 2, "u": 1, "hint": "shy (nhút nhát) trái nghĩa với confident (tự tin)."}, {"s": "– “What do you do in the drama club?” – “___”", "o": ["Yes, it is.", "Twice a week.", "We act in short plays.", "I'm in Class 8A."], "a": 2, "u": 1, "hint": "Hỏi hoạt động ở câu lạc bộ kịch: We act in short plays."}, {"s": "Find the mistake: Hung is <u>keen</u> <u>at</u> <u>playing</u> the guitar <u>in</u> his free time.", "o": ["keen", "at", "playing", "in"], "a": 1, "u": 1, "hint": "Cụm đúng là be keen on, không phải keen at."}]}, {"id": "d27-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "My grandfather (herd) ___ the buffaloes to the field every morning.", "a": 0, "u": 2, "hint": "Hiện tại đơn, chủ ngữ ngôi thứ ba số ít: thêm -s/-es (đổi y thành ies nếu trước y là phụ âm).", "o": ["herds", "herd", "herding"], "c3": 1}, {"s": "My parents (visit) ___ our grandparents next Sunday.", "a": 0, "u": 2, "hint": "Dự đoán, lời hứa về tương lai: will + động từ nguyên mẫu.", "o": ["will visit", "visits", "visited"], "c3": 1}, {"s": "Nga (not live) ___ in the city; she lives in a mountain village.", "a": 0, "u": 2, "hint": "Phủ định hiện tại đơn: do/does not + động từ nguyên mẫu.", "o": ["does not live", "do not live", "does not lives"], "c3": 1}, {"s": "You should (spend) ___ less time on video games.", "a": 0, "u": 1, "hint": "had better, should, Why don't we + động từ nguyên mẫu.", "o": ["spend", "to spend", "spending"], "c3": 1}, {"s": "They (have) ___ a picnic by the lake last Sunday.", "a": 0, "u": 1, "hint": "Có last, yesterday hoặc ago: quá khứ đơn, thêm -ed hoặc dùng dạng bất quy tắc.", "o": ["had", "have", "has"], "c3": 1}]}, {"id": "d27-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "The countryside is ___ and quiet. (PEACE)", "a": 0, "u": 2, "hint": "Cần tính từ: thêm -ful hoặc -y vào từ gốc (peace thành peaceful).", "o": ["peaceful", "peacefully", "peaceless"], "c3": 1}, {"s": "Mrs Lan always treats her guests ___ . (GENEROUS)", "a": 0, "u": 2, "hint": "Cần trạng từ cách thức: tính từ + -ly.", "o": ["generously", "generous", "generosity"], "c3": 1}, {"s": "Doing sports every day is good for your ___ . (HEALTHY)", "a": 0, "u": 1, "hint": "Cần danh từ trừu tượng: đuôi -ce, -ity, -th hoặc -ship.", "o": ["health", "healthily", "healthier"], "c3": 1}, {"s": "The farmers were ___ with the low price of rice. (SATISFIED)", "a": 0, "u": 2, "hint": "Thêm tiền tố phủ định dis- vào từ gốc (hoặc từ trái nghĩa).", "o": ["dissatisfied", "satisfying", "satisfaction"], "c3": 1}, {"s": "Please talk ___ because the baby is sleeping. (QUIET)", "a": 0, "u": 2, "hint": "Cần trạng từ: tính từ + -ly (y đổi thành -ily).", "o": ["quietly", "quiet", "quietness"], "c3": 1}]}, {"id": "d27-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Would you like to ___ our English club?", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là tham gia.", "o": ["join", "interest", "member"], "c3": 1}, {"s": "Every ___ of the club has a card.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là thành viên.", "o": ["member", "join", "interest"], "c3": 1}, {"s": "The drama ___ meets every Friday afternoon.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là câu lạc bộ.", "o": ["club", "join", "member"], "c3": 1}, {"s": "Painting is my favourite ___ at school.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là hoạt động.", "o": ["activity", "join", "interested"], "c3": 1}, {"s": "She has a great ___ in traditional music.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là niềm yêu thích.", "o": ["interest", "join", "club"], "c3": 1}], "box": ["interest", "join", "member", "club", "activity"]}, {"id": "d27-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "so", "or else"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "but", "or else"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "so", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: nếu không thì (hậu quả xấu): dùng or else.", "o": ["or else", "so", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: câu sau là kết quả của câu trước, đứng đầu câu có dấu phẩy: dùng Therefore.", "o": ["Therefore", "but", "or else"], "c3": 1}], "box": ["so", "but", "or else", "and", "Therefore"], "passage": "Hung wants to join the music club, {1} his mother thinks he is too busy. He promises to study hard, {2} she lets him join. He plays the guitar {3} sings in the club. He must keep good marks, {4} his mother will not let him go. His marks are better now. {5}, his mother is happy to see him in the club."}, {"id": "d27-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["so", "or else", "however", "but"], "a": 0, "u": 3, "hint": "Có nhiều câu lạc bộ nên bạn có thể chọn (kết quả): so."}, {"o": ["in", "at", "of", "on"], "a": 2, "u": 1, "hint": "Cụm member of."}, {"o": ["well", "best", "better", "more well"], "a": 2, "u": 2, "hint": "so sánh hơn bất quy tắc: better than."}, {"o": ["performed", "perform", "to perform", "performing"], "a": 3, "u": 1, "hint": "be fond of + V-ing: performing."}, {"o": ["gives", "give", "gave", "giving"], "a": 0, "u": 1, "hint": "On Fridays: hiện tại đơn ngôi thứ ba, gives."}], "passage": "Our school has many clubs, {1} you can choose the one you like. Minh is a member {2} the music club. He plays the guitar {3} than most students. He is fond of {4} in front of people. On Fridays, the club {5} a small show.", "ptitle": "Joining a Club"}, {"id": "d27-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Our school / have / many clubs / so / you / can / choose / one.", "a": 0, "u": 3, "hint": "so nối kết quả; has (số ít).", "o": ["Our school has many clubs, so you can choose one.", "Our school has many clubs, so you can to choose one.", "Our school has many clubs, so you can choosing one."], "c3": 1}, {"s": "Lan / be / member / music club.", "a": 0, "u": 1, "hint": "be a member of the.", "o": ["Lan is a member of the music club.", "Lan are a member of the music club.", "Lan is a member on the music club."], "c3": 1}, {"s": "He / be / keen / draw / pictures.", "a": 0, "u": 1, "hint": "be keen on + V-ing.", "o": ["He is keen on drawing pictures.", "He is keen on draw pictures.", "He are keen on drawing pictures."], "c3": 1}, {"s": "The club / meet / twice a week / and / the members / practise / together.", "a": 0, "u": 3, "hint": "and nối hai mệnh đề; meets (số ít).", "o": ["The club meets twice a week, and the members practise together.", "The club meets twice a week, or the members practise together.", "The club meets twice a week, and members practise together."], "c3": 1}, {"s": "Linh / sing / more sweetly / than / her classmates.", "a": 0, "u": 2, "hint": "more sweetly than.", "o": ["Linh sings more sweetly than her classmates.", "Linh sings more sweet than her classmates.", "Linh sing more sweetly than her classmates."], "c3": 1}]}, {"id": "d27-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes my mother half an hour to cook dinner.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing đổi qua lại với It takes + người + thời gian + to V.", "o": ["My mother spends half an hour cooking dinner.", "My mother spends half an hour to cook dinner.", "My mother spend half an hour cooking dinner."], "c3": 1}, {"s": "It is boring to wait for the bus for an hour.", "a": 0, "u": 1, "hint": "Đưa V-ing lên làm chủ ngữ: It is + tính từ + to V thành V-ing + is + tính từ.", "o": ["Waiting for the bus for an hour is boring.", "Waiting for the bus for an hour are boring.", "Waiting to the bus for an hour is boring."], "c3": 1}, {"s": "Although the road was muddy, the children walked to school.", "a": 0, "u": 3, "hint": "although đổi qua lại với but: Although A, B thành A, but B.", "o": ["The road was muddy, but the children walked to school.", "The road were muddy, but the children walked to school.", "The road was muddy, so the children walked to school."], "c3": 1}, {"s": "Lan studied hard. She passed the exam. (Therefore)", "a": 0, "u": 3, "hint": "Nối hai ý bằng However, Therefore hoặc or else.", "o": ["Lan studied hard. Therefore, she passed the exam.", "Lan studied hard. However, she passed the exam.", "Lan studied hard. Therefore, she passed exam."], "c3": 1}, {"s": "Tom hates doing homework at night.", "a": 0, "u": 1, "hint": "prefer + V-ing to + V-ing đổi qua lại với like + V-ing more than; hate, love đi với V-ing hoặc to V.", "o": ["Tom hates to do homework at night.", "Tom hates to doing homework at night.", "Tom hates to do homework in night."], "c3": 1}]}]}, {"id": "d28", "no": 28, "title": "Đề số 28", "acts": [{"id": "d28-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>o</u>ve", "sch<u>oo</u>l", "l<u>o</u>se", "w<u>oo</u>l"], "a": 3, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oo</u>k", "p<u>u</u>ll", "t<u>oo</u>th", "w<u>oo</u>l"], "a": 2, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>o</u>ntrol", "op<u>e</u>n", "cott<u>age</u>", "answ<u>e</u>r"], "a": 2, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>u</u>rprise", "cour<u>age</u>", "s<u>i</u>t", "<u>de</u>cide"], "a": 0, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oi</u>l", "b<u>oy</u>", "enj<u>oy</u>", "m<u>oo</u>r"], "a": 3, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ɔɪ/, một từ đọc /ʊə/. Chọn từ đọc /ʊə/."}]}, {"id": "d28-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My brother and I loved ___ kites on the hill when we were small.", "o": ["flying", "flew", "fly", "flies"], "a": 0, "u": 2, "hint": "Sau loved dùng V-ing."}, {"s": "Village life is ___ than city life.", "o": ["most peaceful", "peacefuller", "more peaceful", "peacefully"], "a": 2, "u": 2, "hint": "Is + more + tính từ dài + than: more peaceful."}, {"s": "We did not have a TV, ___ we played outside.", "o": ["however", "so", "but", "or"], "a": 1, "u": 3, "hint": "Không có TV nên chơi ngoài trời (kết quả): so."}, {"s": "I wanted a new toy, ___ my parents could not buy one.", "o": ["so", "and", "but", "or"], "a": 2, "u": 3, "hint": "Muốn đồ chơi nhưng bố mẹ không mua (đối lập): but."}, {"s": "There were no cars in my village, so the roads were very ___ .", "o": ["quite", "quiz", "quiet", "quick"], "a": 2, "u": 2, "hint": "Không có ô tô nên đường rất yên tĩnh: quiet."}, {"s": "Our village was very ___ ; everyone knew each other.", "o": ["small", "smoke", "smile", "smell"], "a": 0, "u": 2, "hint": "Cả làng quen nhau: ngôi làng nhỏ, small."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: We often <u>hung out</u> by the river after school.", "o": ["went home", "worked hard", "stayed away", "spent time together"], "a": 3, "u": 1, "hint": "hung out = spent time together (dành thời gian bên nhau)."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: The village road was <u>dirty</u> after the rain.", "o": ["long", "muddy", "wet", "clean"], "a": 3, "u": 2, "hint": "dirty (bẩn) trái nghĩa với clean (sạch)."}, {"s": "– “Do you miss your village?” – “___”", "o": ["It's on the hill.", "No, I haven't.", "Yes, I do. It was peaceful.", "Yes, I did last year."], "a": 2, "u": 2, "hint": "Hỏi có nhớ làng không: trả lời Yes, I do."}, {"s": "Find the mistake: My grandfather <u>is</u> <u>fond</u> <u>of</u> <u>tell</u> stories about his childhood.", "o": ["is", "fond", "of", "tell"], "a": 3, "u": 1, "hint": "fond of + V-ing, nên lỗi ở dạng động từ tell."}]}, {"id": "d28-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "My brother spent the whole afternoon (build) ___ a model plane.", "a": 0, "u": 1, "hint": "spend/spent + thời gian + V-ing.", "o": ["building", "build", "builds"], "c3": 1}, {"s": "If the weather is nice, we (go) ___ camping this weekend.", "a": 0, "u": 3, "hint": "Mệnh đề chính của câu điều kiện loại 1: will + động từ nguyên mẫu.", "o": ["will go", "goes", "went"], "c3": 1}, {"s": "Look! Two boys (fly) ___ a kite on the hill.", "a": 0, "u": 1, "hint": "Có Look!, Listen! hoặc now, at the moment: hiện tại tiếp diễn am/is/are + V-ing.", "o": ["are flying", "fly", "flew"], "c3": 1}, {"s": "Tom dislikes (play) ___ chess because it is too slow.", "a": 0, "u": 1, "hint": "Sau adore, fancy, detest, dislike, don't mind, keen on dùng V-ing.", "o": ["playing", "play", "plays"], "c3": 1}, {"s": "We (not see) ___ any cows on the road this morning.", "a": 0, "u": 2, "hint": "Phủ định quá khứ đơn: did not + động từ nguyên mẫu.", "o": ["did not see", "did not saw", "does not see"], "c3": 1}]}, {"id": "d28-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "A motorbike goes ___ than a bicycle. (FAST)", "a": 0, "u": 2, "hint": "So sánh hơn: tính từ/trạng từ ngắn thêm -er, riêng good/well thành better, bad/badly thành worse.", "o": ["faster", "fastest", "more fast"], "c3": 1}, {"s": "Many ___ visit our village in spring. (VISIT)", "a": 0, "u": 2, "hint": "Cần danh từ chỉ người: từ gốc + -er/-or, thêm -s nếu số nhiều.", "o": ["visitors", "visiting", "visits"], "c3": 1}, {"s": "Playing chess is a ___ way to spend free time. (RELAX)", "a": 0, "u": 1, "hint": "Tính từ đuôi -ed chỉ cảm xúc của người; đuôi -ing mô tả sự vật, sự việc. Ở đây cần dạng -ing.", "o": ["relaxing", "relax", "relaxation"], "c3": 1}, {"s": "Hoa greets visitors ___ than her sister. (CHEERFUL)", "a": 0, "u": 2, "hint": "So sánh hơn của trạng từ dài: more + trạng từ.", "o": ["more cheerfully", "more cheerful", "most cheerfully"], "c3": 1}, {"s": "Every student made a ___ to help poor children. (DONATE)", "a": 0, "u": 3, "hint": "Cần danh từ: đuôi -tion hoặc -ment.", "o": ["donation", "donating", "donated"], "c3": 1}]}, {"id": "d28-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "In my ___ , I lived in a small village.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là thời thơ ấu.", "o": ["childhood", "fly", "kite"], "c3": 1}, {"s": "I made a ___ from paper and bamboo.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là con diều.", "o": ["kite", "fly", "childhood"], "c3": 1}, {"s": "Our ___ gave us fresh vegetables from her garden.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là hàng xóm.", "o": ["neighbour", "fly", "river"], "c3": 1}, {"s": "We swam in the ___ on hot summer days.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là con sông.", "o": ["river", "fly", "childhood"], "c3": 1}, {"s": "We often ___ kites on the hill after school.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là thả (diều), bay.", "o": ["fly", "childhood", "river"], "c3": 1}], "box": ["river", "fly", "neighbour", "childhood", "kite"]}, {"id": "d28-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 2, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "or", "However"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "but", "or"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: đưa ra lựa chọn: dùng or.", "o": ["or", "so", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "so", "or"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai câu đối lập, đứng đầu câu có dấu phẩy: dùng However.", "o": ["However", "and", "or"], "c3": 1}], "box": ["and", "so", "but", "or", "However"], "passage": "When I was small, I lived in a village {1} it was very quiet. We had no TV, {2} we played outside with neighbours. After school we could fly kites {3} swim in the river. Sometimes I wanted a toy, {4} my parents could not buy one. {5}, I was happy."}, {"id": "d28-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["flew", "will fly", "fly", "flying"], "a": 0, "u": 2, "hint": "Kể chuyện thời thơ ấu: quá khứ đơn, flew."}, {"o": ["but", "or", "so", "though"], "a": 2, "u": 3, "hint": "Không có TV nên chơi ngoài trời (kết quả): so."}, {"o": ["cooks", "cooking", "cooked", "will cook"], "a": 2, "u": 2, "hint": "Quá khứ đơn: cooked."}, {"o": ["peacefully", "more peaceful", "peaceful", "more peacefully"], "a": 1, "u": 2, "hint": "was + more + tính từ dài + than: more peaceful."}, {"o": ["visited", "visit", "visiting", "will visit"], "a": 3, "u": 2, "hint": "Next summer: will + V, will visit."}], "passage": "I spent my childhood in a small village. Every afternoon, my friends and I {1} kites on the hill. We didn't have a TV, {2} we played outside. My mother {3} dinner at six, and we all ate together. I miss that life because it was {4} than the life in the city. Next summer, I {5} the village again.", "ptitle": "My Childhood"}, {"id": "d28-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "When / I / small / I / live / village.", "a": 0, "u": 2, "hint": "When + quá khứ: was small, lived in.", "o": ["When I was small, I lived in a village.", "When I were small, I lived in a village.", "When I was small, I lived on a village."], "c3": 1}, {"s": "We / not have / TV / so / we / play / outside.", "a": 0, "u": 3, "hint": "Quá khứ phủ định: did not have; so.", "o": ["We did not have a TV, so we played outside.", "We did not had a TV, so we played outside.", "We did not have TV, so we played outside."], "c3": 1}, {"s": "My friends and I / fly / kites / on the hill / last summer.", "a": 0, "u": 2, "hint": "Quá khứ: flew; on the hill.", "o": ["My friends and I flew kites on the hill last summer.", "My friends or I flew kites on the hill last summer.", "My friends and I flew kites of the hill last summer."], "c3": 1}, {"s": "Village life / be / more peaceful / than / city life.", "a": 0, "u": 2, "hint": "is more peaceful than.", "o": ["Village life is more peaceful than city life.", "Village life are more peaceful than city life.", "Village life is more peaceful as city life."], "c3": 1}, {"s": "Next summer / I / visit / grandparents.", "a": 0, "u": 2, "hint": "Next summer: will + V; my grandparents.", "o": ["Next summer I will visit my grandparents.", "Next summer I will visits my grandparents.", "Next summer I visit my grandparents."], "c3": 1}]}, {"id": "d28-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "The countryside is quieter than the city.", "a": 0, "u": 2, "hint": "Đổi cấu trúc so sánh: not as ... as đổi qua lại với so sánh hơn của đối tượng còn lại.", "o": ["The city isn't as quiet as the countryside.", "The city isn't as quieter as the countryside.", "The city isn't as quiet as countryside."], "c3": 1}, {"s": "It was raining. We did not go out.", "a": 0, "u": 3, "hint": "Gộp câu bằng both ... and, or, but hoặc so.", "o": ["It was raining, so we did not go out.", "It was raining, so we did not went out.", "It were raining, so we did not go out."], "c3": 1}, {"s": "Hoa likes cycling very much.", "a": 0, "u": 1, "hint": "Đổi qua lại giữa adore, fancy + V-ing và be keen on, fond of, into, interested in.", "o": ["Hoa is fond of cycling.", "Hoa is fond of cycle.", "Hoa are fond of cycling."], "c3": 1}, {"s": "My father works harder than my uncle.", "a": 0, "u": 2, "hint": "Danh từ chỉ người đổi qua lại với động từ + trạng từ so sánh hơn (a faster swimmer, swims faster).", "o": ["My father is a harder worker than my uncle.", "My father are a harder worker than my uncle.", "My father is a harder more worker than my uncle."], "c3": 1}, {"s": "The match was cancelled because it rained heavily.", "a": 0, "u": 3, "hint": "because đổi qua lại với so: đổi vị trí hai vế.", "o": ["It rained heavily, so the match was cancelled.", "It rained heavily, so the match were cancelled.", "It rained heavily, so match was cancelled."], "c3": 1}]}]}, {"id": "d29", "no": 29, "title": "Đề số 29", "acts": [{"id": "d29-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>oo</u>n", "fr<u>ui</u>t", "c<u>oo</u>l", "w<u>oo</u>d"], "a": 3, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o</u>man", "sch<u>oo</u>l", "f<u>u</u>ll", "g<u>oo</u>d"], "a": 1, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["pict<u>u</u>re", "sh<u>i</u>p", "c<u>o</u>mpare", "gener<u>ou</u>s"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>re</u>new", "b<u>a</u>nana", "vill<u>age</u>", "b<u>ui</u>ld"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou</u>r", "enj<u>oy</u>", "m<u>oo</u>r", "t<u>ou</u>rist"], "a": 1, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ʊə/, một từ đọc /ɔɪ/. Chọn từ đọc /ɔɪ/."}]}, {"id": "d29-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My cousin can't stand ___ for the bus in the rain.", "o": ["waited", "wait", "waiting", "to wait"], "a": 2, "u": 1, "hint": "can't stand + V-ing."}, {"s": "Our teacher explains new words ___ than before, so we understand them.", "o": ["most clearly", "clearer", "more clear", "more clearly"], "a": 3, "u": 2, "hint": "Có than: more + trạng từ dài (clearly)."}, {"s": "Linh has a new smartphone, ___ she uses it every day.", "o": ["however", "so", "or", "but"], "a": 1, "u": 3, "hint": "Có điện thoại mới nên dùng mỗi ngày (kết quả): so."}, {"s": "Turn off your phone, ___ you will not sleep well.", "o": ["so", "but", "and", "or else"], "a": 3, "u": 3, "hint": "Nếu không tắt máy thì ngủ không ngon: or else."}, {"s": "The film was so ___ that I watched it twice.", "o": ["amazement", "amazing", "amazed", "amaze"], "a": 1, "u": 1, "hint": "Bộ phim làm người xem kinh ngạc: tính từ đuôi -ing, amazing."}, {"s": "Using the Internet for a long time is bad for your ___ .", "o": ["edges", "eyes", "exams", "eggs"], "a": 1, "u": 1, "hint": "Dùng Internet lâu hại mắt: eyes."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Many teenagers are <u>keen on</u> social networks.", "o": ["afraid of", "angry with", "tired of", "interested in"], "a": 3, "u": 1, "hint": "keen on gần nghĩa với interested in."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: The Internet connection in my village is <u>slow</u>.", "o": ["old", "bad", "fast", "late"], "a": 2, "u": 2, "hint": "slow (chậm) trái nghĩa với fast (nhanh)."}, {"s": "– “Do you fancy watching a film tonight?” – “___”", "o": ["No, I don't watch.", "Yes, why not?", "Yes, I watched it.", "It's on TV yesterday."], "a": 1, "u": 1, "hint": "Do you fancy ...?: đồng ý bằng Yes, why not?"}, {"s": "Find the mistake: My sister <u>is</u> <u>into</u> <u>chat</u> with her friends <u>online</u>.", "o": ["is", "into", "chat", "online"], "a": 2, "u": 1, "hint": "be into + V-ing, nên lỗi ở dạng động từ chat."}]}, {"id": "d29-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "She (go) ___ to the youth club twice a week.", "a": 0, "u": 1, "hint": "Hiện tại đơn, chủ ngữ ngôi thứ ba số ít: thêm -s/-es (đổi y thành ies nếu trước y là phụ âm).", "o": ["goes", "go", "going"], "c3": 1}, {"s": "I'm sure you (like) ___ the countryside when you come here.", "a": 0, "u": 2, "hint": "Dự đoán, lời hứa về tương lai: will + động từ nguyên mẫu.", "o": ["will like", "likes", "liked"], "c3": 1}, {"s": "I (not have) ___ any free time on weekdays.", "a": 0, "u": 1, "hint": "Phủ định hiện tại đơn: do/does not + động từ nguyên mẫu.", "o": ["do not have", "does not have", "do not has"], "c3": 1}, {"s": "It's raining. You had better (take) ___ an umbrella.", "a": 0, "u": 2, "hint": "had better, should, Why don't we + động từ nguyên mẫu.", "o": ["take", "to take", "taking"], "c3": 1}, {"s": "When I was a child, I (live) ___ in a small village.", "a": 0, "u": 2, "hint": "Có last, yesterday hoặc ago: quá khứ đơn, thêm -ed hoặc dùng dạng bất quy tắc.", "o": ["lived", "live", "lives"], "c3": 1}]}, {"id": "d29-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Be ___ when you ride a bike on the road. (CARE)", "a": 0, "u": 2, "hint": "Cần tính từ: thêm -ful hoặc -y vào từ gốc (peace thành peaceful).", "o": ["careful", "careless", "carefully"], "c3": 1}, {"s": "The girl danced ___ on the stage. (BEAUTIFUL)", "a": 0, "u": 1, "hint": "Cần trạng từ cách thức: tính từ + -ly.", "o": ["beautifully", "beautiful", "beauty"], "c3": 1}, {"s": "Our ___ began at primary school. (FRIEND)", "a": 0, "u": 1, "hint": "Cần danh từ trừu tượng: đuôi -ce, -ity, -th hoặc -ship.", "o": ["friendship", "friendly", "friendliness"], "c3": 1}, {"s": "It is ___ to see a buffalo in the city. (USUAL)", "a": 0, "u": 2, "hint": "Thêm tiền tố phủ định un- vào từ gốc (hoặc từ trái nghĩa).", "o": ["unusual", "usually", "unusually"], "c3": 1}, {"s": "She ran ___ to catch the last bus. (QUICK)", "a": 0, "u": 2, "hint": "Cần trạng từ: tính từ + -ly (y đổi thành -ily).", "o": ["quickly", "quick", "quickness"], "c3": 1}]}, {"id": "d29-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "My sister often ___ the Net to find information for her projects.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, surf the Net là lướt mạng. Chủ ngữ My sister là số ít, thì hiện tại đơn.", "o": ["surfs", "device", "social"], "c3": 1}, {"s": "Teenagers ___ with friends through apps every evening.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là trò chuyện.", "o": ["chat", "device", "social"], "c3": 1}, {"s": "I watched an ___ lesson on my laptop.", "a": 0, "u": 1, "hint": "Từ cần điền: tính từ, nghĩa là trực tuyến.", "o": ["online", "surf", "chat"], "c3": 1}, {"s": "A smartphone is a useful ___ for learning.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là thiết bị.", "o": ["device", "surf", "chat"], "c3": 1}, {"s": "Many people share photos on ___ networks.", "a": 0, "u": 1, "hint": "Từ cần điền: tính từ, social networks là mạng xã hội.", "o": ["social", "device", "surf"], "c3": 1}], "box": ["surf", "device", "chat", "online", "social"]}, {"id": "d29-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "but", "or else"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "Therefore", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "Therefore", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: nếu không thì (hậu quả xấu): dùng or else.", "o": ["or else", "Therefore", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: câu sau là kết quả của câu trước, đứng đầu câu có dấu phẩy: dùng Therefore.", "o": ["Therefore", "but", "and"], "c3": 1}], "box": ["Therefore", "but", "and", "so", "or else"], "passage": "Linh has a new smartphone, {1} she uses it every day. She chats with friends {2} watches funny videos. She likes it, {3} her father does not like her playing on it too long. He says, “Put it away, {4} you will hurt your eyes.” Linh listens. {5}, she now uses the phone for only one hour."}, {"id": "d29-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["among", "between", "at", "to"], "a": 0, "u": 1, "hint": "Cụm popular among teenagers."}, {"o": ["of", "at", "about", "with"], "a": 2, "u": 1, "hint": "Cụm crazy about."}, {"o": ["watching", "watched", "watch", "to watch"], "a": 0, "u": 1, "hint": "spend time + V-ing: watching."}, {"o": ["to turn", "turned", "turning", "turn"], "a": 3, "u": 3, "hint": "had better + động từ nguyên mẫu: turn."}, {"o": ["Because", "Or", "So", "Although"], "a": 3, "u": 3, "hint": "Nhượng bộ: Although he likes his phone, ..."}], "passage": "Smartphones are very popular {1} teenagers. Most of them are crazy {2} playing games on their phones. My cousin spends two hours {3} videos every night. His mother says, “You had better {4} the phone off, or else you will not sleep well.” {5} he likes his phone, he now uses it less.", "ptitle": "Teenagers and Smartphones"}, {"id": "d29-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Linh / spend / one hour / chat / friends / every night.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing; chatting with her friends.", "o": ["Linh spends one hour chatting with her friends every night.", "Linh spends one hour to chat with her friends every night.", "Linh spend one hour chatting with her friends every night."], "c3": 1}, {"s": "My brother / detest / wait / for / the bus.", "a": 0, "u": 1, "hint": "detest + V-ing; waiting for the bus.", "o": ["My brother detests waiting for the bus.", "My brother detests wait for the bus.", "My brother detests waiting to the bus."], "c3": 1}, {"s": "He / play / games / well / than / his cousin.", "a": 0, "u": 2, "hint": "So sánh hơn bất quy tắc: better than.", "o": ["He plays games better than his cousin.", "He plays games more better than his cousin.", "He play games better than his cousin."], "c3": 1}, {"s": "You / had better / turn off / phone / or else / you / not sleep / well.", "a": 0, "u": 3, "hint": "had better + V; or else + will not.", "o": ["You had better turn off the phone, or else you will not sleep well.", "You had better turn off the phone, or else you will not sleeps well.", "You had better to turn off the phone, or else you will not sleep well."], "c3": 1}, {"s": "The new device / help / me / learn / English / more quickly.", "a": 0, "u": 2, "hint": "helps + tân ngữ + V; more quickly.", "o": ["The new device helps me learn English more quickly.", "The new device help me learn English more quickly.", "The new device helps me learn English more quick."], "c3": 1}]}, {"id": "d29-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "The children spend the whole morning flying kites.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing đổi qua lại với It takes + người + thời gian + to V.", "o": ["It takes the children the whole morning to fly kites.", "It takes the children the whole morning to flying kites.", "It takes children the whole morning to fly kites."], "c3": 1}, {"s": "It is relaxing to listen to music.", "a": 0, "u": 1, "hint": "Đưa V-ing lên làm chủ ngữ: It is + tính từ + to V thành V-ing + is + tính từ.", "o": ["Listening to music is relaxing.", "Listening to music are relaxing.", "Listening music is relaxing."], "c3": 1}, {"s": "The film was long, but I enjoyed it.", "a": 0, "u": 3, "hint": "although đổi qua lại với but: Although A, B thành A, but B.", "o": ["Although the film was long, I enjoyed it.", "Although the film were long, I enjoyed it.", "Despite the film was long, I enjoyed it."], "c3": 1}, {"s": "We must leave now or we will miss the bus.", "a": 0, "u": 3, "hint": "Nối hai ý bằng However, Therefore hoặc or else.", "o": ["We must leave now, or else we will miss the bus.", "We must leave now, or else we will misses the bus.", "We must to leave now, or else we will miss the bus."], "c3": 1}, {"s": "Lan prefers swimming to running.", "a": 0, "u": 1, "hint": "prefer + V-ing to + V-ing đổi qua lại với like + V-ing more than; hate, love đi với V-ing hoặc to V.", "o": ["Lan likes swimming more than running.", "Lan likes swim more than running.", "Lan like swimming more than running."], "c3": 1}]}]}, {"id": "d30", "no": 30, "title": "Đề số 30", "acts": [{"id": "d30-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo</u>l", "pr<u>o</u>ve", "g<u>oo</u>se", "w<u>oo</u>l"], "a": 3, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sp<u>oo</u>n", "sh<u>ou</u>ld", "l<u>oo</u>k", "t<u>oo</u>k"], "a": 0, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["op<u>e</u>n", "<u>re</u>turn", "b<u>a</u>nana", "freed<u>o</u>m"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["freed<u>o</u>m", "<u>pre</u>dict", "m<u>i</u>ss", "cott<u>age</u>"], "a": 0, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["v<u>oi</u>ce", "p<u>oi</u>nt", "destr<u>oy</u>", "t<u>ou</u>rist"], "a": 3, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ɔɪ/, một từ đọc /ʊə/. Chọn từ đọc /ʊə/."}]}, {"id": "d30-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Tom is interested in ___ photos of old houses in the village.", "o": ["to take", "taking", "took", "take"], "a": 1, "u": 2, "hint": "be interested in + V-ing."}, {"s": "My mother cooks ___ than my father, so the food is always tasty.", "o": ["more carefully", "more careful", "carefully", "carefuller"], "a": 0, "u": 2, "hint": "Có than: more + trạng từ dài (carefully)."}, {"s": "The road is crowded in the afternoon, ___ we will leave early.", "o": ["so", "however", "or", "but"], "a": 0, "u": 3, "hint": "Đường đông buổi chiều nên đi sớm (kết quả): so."}, {"s": "We must book the bus today, ___ we will have no seats.", "o": ["so", "or else", "and", "but"], "a": 1, "u": 3, "hint": "Phải đặt xe hôm nay, nếu không sẽ hết chỗ: or else."}, {"s": "We will stay at a small ___ near the lake.", "o": ["hobby", "hotel", "hospital", "helmet"], "a": 1, "u": 1, "hint": "Ở một khách sạn nhỏ gần hồ: hotel."}, {"s": "Tom is a good ___ ; he takes beautiful photos.", "o": ["photographs", "photography", "photograph", "photographer"], "a": 3, "u": 1, "hint": "Người chụp ảnh đẹp: danh từ chỉ người, photographer."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Mai is <u>excited about</u> the trip.", "o": ["tired of", "angry about", "afraid of", "very happy about"], "a": 3, "u": 1, "hint": "excited about = very happy about."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: The weather was <u>awful</u> yesterday.", "o": ["wonderful", "cold", "terrible", "bad"], "a": 0, "u": 1, "hint": "awful (tồi tệ) trái nghĩa với wonderful (tuyệt vời)."}, {"s": "– “What are you doing this weekend?” – “___”", "o": ["It is a good plan yesterday.", "We plan to go camping.", "I did it last week.", "Yes, I do."], "a": 1, "u": 1, "hint": "Hỏi dự định cuối tuần: trả lời We plan to go camping."}, {"s": "Find the mistake: If it <u>rains</u> tomorrow, we <u>stay</u> <u>at</u> home <u>and</u> play chess.", "o": ["rains", "stay", "at", "and"], "a": 1, "u": 3, "hint": "Câu điều kiện loại 1: mệnh đề chính dùng will + V, nên lỗi ở stay."}]}, {"id": "d30-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "It takes the villagers a month (finish) ___ the harvest.", "a": 0, "u": 2, "hint": "It takes + người + thời gian + to V.", "o": ["to finish", "finishing", "finish"], "c3": 1}, {"s": "She will be happy if her friends (visit) ___ her.", "a": 0, "u": 3, "hint": "Mệnh đề If của câu điều kiện loại 1 dùng hiện tại đơn (ngôi thứ ba thêm -s).", "o": ["visit", "will visit", "visited"], "c3": 1}, {"s": "Mai (not do) ___ her homework now; she is surfing the Net.", "a": 0, "u": 1, "hint": "Có Look!, Listen! hoặc now, at the moment: hiện tại tiếp diễn am/is/are + V-ing.", "o": ["is not doing", "is not do", "does not do"], "c3": 1}, {"s": "Mrs Hoa is keen on (grow) ___ vegetables in her garden.", "a": 0, "u": 1, "hint": "Sau adore, fancy, detest, dislike, don't mind, keen on dùng V-ing.", "o": ["growing", "grow", "grows"], "c3": 1}, {"s": "Lan (not finish) ___ her project on time last week.", "a": 0, "u": 3, "hint": "Phủ định quá khứ đơn: did not + động từ nguyên mẫu.", "o": ["did not finish", "did not finished", "does not finish"], "c3": 1}]}, {"id": "d30-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My brother studies ___ than me. (HARD)", "a": 0, "u": 2, "hint": "So sánh hơn: tính từ/trạng từ ngắn thêm -er, riêng good/well thành better, bad/badly thành worse.", "o": ["harder", "hardly", "hardest"], "c3": 1}, {"s": "Our English ___ is very kind. (TEACH)", "a": 0, "u": 1, "hint": "Cần danh từ chỉ người: từ gốc + -er/-or.", "o": ["teacher", "teaching", "taught"], "c3": 1}, {"s": "Farmers are ___ with this year's harvest. (SATISFY)", "a": 0, "u": 2, "hint": "Tính từ đuôi -ed chỉ cảm xúc của người; đuôi -ing mô tả sự vật, sự việc. Ở đây cần dạng -ed.", "o": ["satisfied", "satisfying", "satisfaction"], "c3": 1}, {"s": "My brother does his chores ___ than I do. (LAZY)", "a": 0, "u": 2, "hint": "So sánh hơn của trạng từ dài: more + trạng từ.", "o": ["more lazily", "most lazily", "more lazy"], "c3": 1}, {"s": "Big trees give us ___ from the hot sun. (PROTECT)", "a": 0, "u": 2, "hint": "Cần danh từ: đuôi -tion hoặc -ment.", "o": ["protection", "protective", "protecting"], "c3": 1}]}, {"id": "d30-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "We ___ to go camping this weekend.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là dự định.", "o": ["plan", "picnic", "lake"], "c3": 1}, {"s": "We will have a ___ in the park on Sunday.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là buổi dã ngoại.", "o": ["picnic", "plan", "invite"], "c3": 1}, {"s": "Don't forget to ___ some water and fruit.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là mang theo.", "o": ["bring", "lake", "picnic"], "c3": 1}, {"s": "Mai will ___ all her friends to her birthday party.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là mời.", "o": ["invite", "lake", "picnic"], "c3": 1}, {"s": "We sailed a small boat on the ___ .", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là cái hồ.", "o": ["lake", "bring", "plan"], "c3": 1}], "box": ["plan", "picnic", "bring", "lake", "invite"]}, {"id": "d30-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 3, "hint": "Quan hệ     } else el.classList.add('bad');
    showQ(a, sec, k, 'no', fixText(a, it, k, el.value || '', chosen));
  }
}
function liveFinish(a, sec) {
  var n = a.items.length, dung = 0, i;
  for (i = 0; i < n; i++) if (!a._try[i]) dung++;
  var p = prog[a.id] || (prog[a.id] = { first: dung, total: n, best: dung, lan: 0 });
  p.total = n; p.lan = (p.lan || 0) + 1; p.last = dung; if (dung > p.best) p.best = dung; p.done = true;
  ls('hd_prog', prog);
  send(a, dung, n);
  var fb = sec.querySelector('.fb'); fb.hidden = false; fb.className = 'fb good';
  fb.innerHTML = '<p><b>Em đã làm đúng hết ' + n + ' câu.</b> Phần này được ghi nhận là <b>Hoàn thành</b>.</p><p>Số câu đúng ngay lần đầu: <b>' + dung + '/' + n + '</b>' + (dung < n ? '. Muốn được thêm sao, em bấm Làm lại cả bài và cố gắng đúng ngay từ lần đầu.' : '. Em được 3 sao.') + '</p>';
  sec.querySelector('.stars').innerHTML = stars(a.id);
  var tab = root.querySelector('.tab.cur'); if (tab) tab.classList.add('done');
  setTimeout(function () { fb.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 450);
}

var view = '';
function route() {
  var h = (location.hash || '#home').slice(1) || 'home', html = '';
  var g = GR.filter(function (x) { return x.id === h; })[0], d = DES.filter(function (x) { return x.id === h; })[0];
  if (g) { html = grammarView(g); } else if (d) { html = deView(d); } else { h = 'home'; html = homeView(); }

}
root.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  var sec = t.closest('.act');
  if (t.classList.contains('opt')) {
    var q = t.closest('.q'); if (t.disabled) return;
    q.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('sel'); }); t.classList.add('sel');
    q.setAttribute('data-sel', t.getAttribute('data-o')); q.classList.remove('bad');
    if (sec) { var la = findAct(sec.getAttribute('data-act')); if (la && la._live) liveTry(la, sec, +q.getAttribute('data-q')); }
    return;
  }
  if (t.hasAttribute('data-tab')) {
    var dd = DES.filter(function (x) { return x.id === view; })[0]; if (!dd) return;
    curTab[dd.id] = +t.getAttribute('data-tab'); root.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('cur'); b.setAttribute('aria-selected', 'false'); });
    t.classList.add('cur'); t.setAttribute('aria-selected', 'true');
    document.getElementById('actbox').innerHTML = actHTML(dd.acts[curTab[dd.id]]); return;
  }
  if (!sec) return;
  var a = findAct(sec.getAttribute('data-act'));
  if (t.getAttribute('data-do') === 'check') check(a, sec);
  if (t.getAttribute('data-do') === 'one' && a._live) liveTry(a, sec, +t.getAttribute('data-k'));
  if (t.getAttribute('data-do') === 'reset') { mem[a.id] = {}; sec.outerHTML = actHTML(a); }
});
root.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'ten' || el.id === 'lop') { me.ten = (document.getElementById('ten') || {}).value || ''; me.lop = (document.getElementById('lop') || {}).value || ''; ls('hd_me', me); return; }
  if (el.classList && el.hasAttribute('data-q')) el.classList.remove('bad');
});
root.addEventListener('change', function (e) {
  var el = e.target; if (el.tagName === 'SELECT') el.classList.remove('bad');
  var sec = el.closest && el.closest('.act'); if (!sec || !el.hasAttribute('data-q')) return;
  var a = findAct(sec.getAttribute('data-act')); if (!a || !a._live) return;
  if (el.tagName === 'SELECT' || a.type === 'pgap') liveTry(a, sec, +el.getAttribute('data-q'));
});
root.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || e.isComposing) return;
  var el = e.target; if (!el.hasAttribute || !el.hasAttribute('data-q') || el.tagName === 'SELECT') return;
  var sec = el.closest('.act'); if (!sec) return;
  var a = findAct(sec.getAttribute('data-act')); if (!a || !a._live) return;
  e.preventDefault(); liveTry(a, sec, +el.getAttribute('data-q'));
});
window.addEventListener('hashchange', route);
route();
window.__hd = { DES: DES, norm: norm, match: match };
})();
