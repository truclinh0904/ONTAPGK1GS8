<title>Ôn tập Tiếng Anh 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: mot cot hep (toi da 760px), trang chu la luoi the, de thi la thanh tab I-IX va mot phan lam bai moi lan. */
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ink:#16263F; --mute:#55657D; --line:#D9E1EC;
  --accent:#16406F; --accent-ink:#FFFFFF; --kite:#E9A524; --ok:#1B7F55; --ok-bg:#E2F4EB; --bad:#C23B2A; --bad-bg:#FBE8E5; --warn-bg:#FFF4DB; --sel:#DCE9F8;
  --head:'Be Vietnam Pro','Segoe UI',Arial,sans-serif; --body:'Nunito','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#172236; --ink:#E7EEF8; --mute:#9FB0C7; --line:#2B3A52; --accent:#7DB2F0; --accent-ink:#0E1626; --kite:#F2BA4B;
  --ok:#5CD39B; --ok-bg:#133726; --bad:#FF8A78; --bad-bg:#3B1B18; --warn-bg:#3A2E10; --sel:#223A5C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
#app{max-width:760px;margin-inline:auto}
h1,h2,h3,h4{font-family:var(--head);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.15rem;font-weight:600;margin-block:28px 12px} h3{font-size:1.02rem;font-weight:600}
p{margin:0 0 .6em}
a{color:var(--accent)}
.top{margin-bottom:8px}
.brand{font-family:var(--head);font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sub{color:var(--mute);margin-top:6px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;text-decoration:none}
.back::before{content:"\2190  "}
.who{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 16px 14px;margin-top:20px}
.who h2{margin-top:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row label{flex:1 1 200px;min-width:0;font-size:.85rem;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.grid,.grid3{display:grid;gap:12px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--head);font-size:1.05rem}
.card span{font-size:.85rem;color:var(--mute)}
.card .mini{color:var(--accent);font-weight:700}
.gcard{border-top:4px solid var(--kite)}
.gl{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gc h3{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ic{flex:none;color:var(--accent)}
.gc p{font-size:.96rem}
.tip{background:var(--warn-bg);border-radius:8px;padding:8px 10px;margin-top:10px}
.tb{border-collapse:collapse;width:100%;font-size:.92rem;display:block;overflow-x:auto}
.tb td{border:1px solid var(--line);padding:5px 9px}
.pn{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pn a{padding:6px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;font-weight:600;font-size:.9rem}
.pn a.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:none;min-width:44px;height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 .95rem var(--head);cursor:pointer}
.tab.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.done::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:5px;vertical-align:middle}
.tab.cur.done::after{background:var(--kite)}
.act{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ah{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.instr{font-size:.88rem;color:var(--mute);font-style:italic;margin-top:4px}
.stars{display:flex;gap:2px}
.st{color:var(--line)} .st.on{color:var(--kite)} .st .ic{color:inherit;fill:currentColor}
.box{list-style:none;padding:10px 12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg);border:1px dashed var(--mute);border-radius:8px}
.box li{font-weight:700;padding:2px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.ql{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:14px}
.q{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:start}
.no{font-family:var(--head);font-weight:700;color:var(--accent)}
.qs{margin:0 0 6px;overflow-wrap:anywhere}
.stub{font-size:.88rem;color:var(--mute);margin:0 0 6px}
.un{font-size:.72rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.unrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bk{display:inline-block;width:3.2em;border-bottom:2px solid var(--mute);margin-inline:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt b{color:var(--accent)}
.opt.sel{background:var(--sel);border-color:var(--accent)}
.q.ok .opt.sel{background:var(--ok-bg);border-color:var(--ok)}
.q.bad .opt.sel{background:var(--bad-bg);border-color:var(--bad)}
.opt.key{background:var(--ok-bg);border-color:var(--ok)}
.opt.key b{color:var(--ok)}
.ans{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:.92rem}
.ty + .ans{display:block;margin:6px 0 0;width:fit-content}
.more{margin-top:4px}
.more summary{cursor:pointer;color:var(--accent);font-weight:600}
.more p{margin:6px 0 0}
.fb.stop{background:var(--warn-bg)}
.rule{font-size:.85rem;color:var(--mute);margin:12px 0 0}
.gp{width:9.5em;max-width:100%;display:inline-block;padding:4px 8px}
.ty{width:100%;resize:vertical}
input.ok,textarea.ok,select.ok{border-color:var(--ok);background:var(--ok-bg)}
input.bad,textarea.bad,select.bad{border-color:var(--bad);background:var(--bad-bg)}
.pass{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:8px;line-height:2.2}
.pass h4{font-size:1rem;margin-bottom:6px}
.pass p{margin:0}
.pb{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pb i{font-style:normal;font-size:.75rem;font-weight:700;color:var(--accent)}
.sl{padding:4px 6px;max-width:100%}
.fb{margin-top:16px;border-radius:8px;padding:10px 14px}
.fb p{margin:0 0 6px}
.fb.warn{background:var(--warn-bg)} .fb.good{background:var(--ok-bg)}
.how{font-size:.94rem}
.bt{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:600 .95rem var(--head);padding:10px 18px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk{font-weight:700}
@media (max-width:520px){h1{font-size:1.55rem}.q{grid-template-columns:26px minmax(0,1fr)}.q .un{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.tab{transition:border-color .15s,background .15s}}
</style>

<script>window.DES = [{"id": "d1", "no": 1, "title": "Đề số 1", "acts": [{"id": "d1-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo<\/u>l", "p<u>oo<\/u>l", "w<u>o<\/u>lf", "b<u>oo<\/u>t"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>ou<\/u>ld", "p<u>u<\/u>sh", "b<u>oo<\/u>t", "w<u>o<\/u>lf"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>ui<\/u>ld", "sil<u>e<\/u>nt", "b<u>a<\/u>nana", "fam<u>ou<\/u>s"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["hands<u>o<\/u>me", "bagg<u>age<\/u>", "<u>re<\/u>new", "cour<u>age<\/u>"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo<\/u>r", "t<u>ou<\/u>r", "p<u>oo<\/u>r", "v<u>oi<\/u>ce"], "a": 3, "u": 3}]}, {"id": "d1-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "We enjoy ___ board games with our cousins at weekends.", "o": ["play", "playing", "to play", "played"], "a": 1, "u": 1}, {"s": "My sister is keen ___ knitting and making crafts.", "o": ["in", "at", "on", "with"], "a": 2, "u": 1}, {"s": "Many teenagers are fond ___ chatting with friends online.", "o": ["of", "on", "in", "about"], "a": 0, "u": 1}, {"s": "Hoa ___ doing puzzles in her free time.", "o": ["adore", "adores", "to adore", "adoring"], "a": 1, "u": 1}, {"s": "A horse can run ___ than a buffalo.", "o": ["fast", "more fast", "faster", "fastest"], "a": 2, "u": 2}, {"s": "Nam writes ___ than his brother.", "o": ["more neat", "more neatly", "neatly", "neatest"], "a": 1, "u": 2}, {"s": "It rained heavily; ___, the farmers still went to the field.", "o": ["so", "and", "however", "or"], "a": 2, "u": 3}, {"s": "The bus was late, ___ we walked to school.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "You must study hard, ___ you will fail the midterm test.", "o": ["and", "so", "or else", "however"], "a": 2, "u": 3}, {"s": "People in the countryside are kind and ___.", "o": ["hospitable", "noisy", "crowded", "tiring"], "a": 0, "u": 2}]}, {"id": "d1-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Ninh often (play) ___ chess after school.", "a": ["plays"], "u": 1}, {"s": "My father detests (wait) ___ in long queues.", "a": ["waiting"], "u": 1}, {"s": "Mai (not do) ___ her homework last night.", "a": ["did not do", "didn't do"], "u": 1}, {"s": "Minh is keen on (join) ___ the school club.", "a": ["joining"], "u": 1}, {"s": "They fancy (listen) ___ to folk music.", "a": ["listening"], "u": 1}]}, {"id": "d1-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Cars run ___ than buffalo carts. (FAST)", "a": ["faster"], "u": 2}, {"s": "My cousin speaks English ___ than I do. (FLUENT)", "a": ["more fluently"], "u": 2}, {"s": "My brother adores ___ comic books. (READ)", "a": ["reading"], "u": 1}, {"s": "Hoa and Lan ___ go to the library on Sundays. (USUAL)", "a": ["usually"], "u": 1}, {"s": "I have a good ___ of stamps. (COLLECT)", "a": ["collection"], "u": 2}]}, {"id": "d1-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She was ill, ___ she stayed at home.", "a": ["so"], "u": 3}, {"s": "My brother is not keen ___ cooking.", "a": ["on"], "u": 1}, {"s": "We like football, ___ we don't like volleyball.", "a": ["but"], "u": 3}, {"s": "Linh is crazy ___ doing DIY.", "a": ["about"], "u": 1}, {"s": "Is your sister interested ___ crafts?", "a": ["in"], "u": 1}], "box": ["on", "so", "about", "but", "in"]}, {"id": "d1-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["life"], "u": 2}, {"a": ["than"], "u": 2}, {"a": ["harvest"], "u": 2}, {"a": ["with"], "u": 2}, {"a": ["riding"], "u": 2}], "box": ["life", "than", "harvest", "with", "riding"], "passage": "I live in a village in the countryside. Life here is simple, and I love country {1}. In the past, farmers worked harder {2} they do now, because they had no machines. Today, they use combine harvesters, so they finish the {3} time earlier. Our houses are better equipped {4} electric fans and TVs. Many boys enjoy {5} buffaloes in the afternoon."}, {"id": "d1-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["playing", "play", "played", "plays"], "a": 0, "u": 1}, {"o": ["on", "of", "in", "at"], "a": 1, "u": 1}, {"o": ["so", "but", "for", "or"], "a": 1, "u": 3}, {"o": ["spend", "to spending", "spending", "spent"], "a": 2, "u": 1}, {"o": ["relax", "relaxing", "relaxed", "relaxation"], "a": 2, "u": 3}], "passage": "Teenagers today have many ways to relax. Some teenagers love {1} games online. Others are fond {2} listening to music. Boys often play football {3} girls prefer swimming. They also like {4} time with friends at the weekend. They feel {5} after these activities, so they can study better.", "ptitle": "How do teenagers relax?"}, {"id": "d1-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I enjoy making origami in my free time. (keen)", "a": ["I am keen on making origami in my free time."], "u": 1}, {"s": "Lan is a more careful driver than Nam. (carefully)", "a": ["Lan drives more carefully than Nam."], "u": 2}, {"s": "My sister dislikes cooking. (hates)", "a": ["My sister hates cooking."], "u": 1}, {"s": "This road is wider than that one. (narrower)", "a": ["That road is narrower than this one."], "u": 2}, {"s": "The film was boring. We left early. (therefore)", "a": ["The film was boring; therefore, we left early."], "u": 3}]}, {"id": "d1-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mr Hung spends an hour travelling to work every day.", "stub": "It takes", "a": ["It takes Mr Hung an hour to travel to work every day.", "Mr Hung an hour to travel to work every day."], "u": 1}, {"s": "She loves collecting stamps in her leisure time.", "stub": "She is fond", "a": ["She is fond of collecting stamps in her leisure time.", "of collecting stamps in her leisure time."], "u": 1}, {"s": "Tom dislikes playing computer games.", "stub": "Tom isn't keen", "a": ["Tom isn't keen on playing computer games.", "on playing computer games."], "u": 1}, {"s": "She feels stressed now, for she has a midterm test tomorrow.", "stub": "She has", "a": ["She has a midterm test tomorrow, so she feels stressed now.", "a midterm test tomorrow, so she feels stressed now."], "u": 3}, {"s": "Nam doesn't run as quickly as Tuan.", "stub": "Tuan runs", "a": ["Tuan runs more quickly than Nam.", "more quickly than Nam."], "u": 2}]}]}, {"id": "d2", "no": 2, "title": "Đề số 2", "acts": [{"id": "d2-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["fr<u>ui<\/u>t", "m<u>oo<\/u>n", "f<u>oo<\/u>t", "pr<u>o<\/u>ve"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>oo<\/u>n", "sh<u>ou<\/u>ld", "w<u>ou<\/u>ld", "f<u>oo<\/u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["answ<u>e<\/u>r", "<u>de<\/u>cide", "<u>a<\/u>partment", "anxi<u>ou<\/u>s"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>ui<\/u>ld", "op<u>e<\/u>n", "k<u>i<\/u>t", "cour<u>age<\/u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["j<u>oy<\/u>", "enj<u>oy<\/u>", "t<u>ou<\/u>r", "f<u>oi<\/u>l"], "a": 2, "u": 3}]}, {"id": "d2-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My brother prefers ___ football to watching it on TV.", "o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"s": "Lan is interested ___ learning how to knit.", "o": ["on", "of", "in", "at"], "a": 2, "u": 1}, {"s": "They don't mind ___ the dishes after dinner.", "o": ["wash", "to wash", "washing", "washed"], "a": 2, "u": 1}, {"s": "My grandmother is crazy ___ gardening.", "o": ["about", "on", "of", "in"], "a": 0, "u": 1}, {"s": "Tractors plough ___ than buffaloes.", "o": ["more quick", "more quickly", "quickly", "quickest"], "a": 1, "u": 2}, {"s": "My sister sings ___ than I do.", "o": ["good", "well", "better", "more good"], "a": 2, "u": 2}, {"s": "He studied hard, ___ he passed the midterm test.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Would you like tea ___ coffee?", "o": ["so", "but", "or", "therefore"], "a": 2, "u": 3}, {"s": "Mai felt worried; ___, she stayed calm during the exam.", "o": ["therefore", "however", "so", "or"], "a": 1, "u": 3}, {"s": "Farmers always need help with the ___.", "o": ["harvest", "lighthouse", "forum", "midterm"], "a": 0, "u": 2}]}, {"id": "d2-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mr Tam often (milk) ___ the cows at five.", "a": ["milks"], "u": 2}, {"s": "I detest (do) ___ housework at weekends.", "a": ["doing"], "u": 1}, {"s": "My sister (not enjoy) ___ the film last night.", "a": ["did not enjoy", "didn't enjoy"], "u": 1}, {"s": "Are you keen on (make) ___ things by hand?", "a": ["making"], "u": 1}, {"s": "He adores (surf) ___ the net after school.", "a": ["surfing"], "u": 1}]}, {"id": "d2-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "The hall was lit ___ than the corridor. (BRIGHT)", "a": ["more brightly"], "u": 2}, {"s": "Ann arrives ___ than her friends. (EARLY)", "a": ["earlier"], "u": 2}, {"s": "Linh loves ___ photos of flowers. (TAKE)", "a": ["taking", "to take"], "u": 1}, {"s": "The villagers are very ___ to visitors. (FRIEND)", "a": ["friendly"], "u": 2}, {"s": "Teenagers need a good ___ with their friends. (CONNECT)", "a": ["connection"], "u": 3}]}, {"id": "d2-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "My brother is fond ___ playing chess.", "a": ["of"], "u": 1}, {"s": "She is really ___ photography and takes photos every day.", "a": ["into"], "u": 1}, {"s": "We can take a bus ___ walk to school.", "a": ["or"], "u": 3}, {"s": "It was raining; ___, we went out.", "a": ["however"], "u": 3}, {"s": "She felt tired, ___ she stayed up late.", "a": ["for"], "u": 3}], "box": ["of", "however", "into", "or", "for"]}, {"id": "d2-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["vast"], "u": 2}, {"a": ["so"], "u": 3}, {"a": ["harder"], "u": 2}, {"a": ["in"], "u": 1}, {"a": ["spend"], "u": 1}], "box": ["spend", "so", "in", "harder", "vast"], "passage": "My uncle lives on a farm in the countryside. His farm is on a very {1} grassland. He has a herd of cattle, {2} he gets up very early to feed them. In the past, he worked {3} than he does now, because he had no machines. He is interested {4} new farming methods. In his free time, he likes to {5} time with his family."}, {"id": "d2-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["on", "in", "at", "to"], "a": 1, "u": 2}, {"o": ["so", "but", "or", "for"], "a": 3, "u": 3}, {"o": ["than", "as", "like", "to"], "a": 1, "u": 2}, {"o": ["but", "and", "or", "so"], "a": 1, "u": 2}, {"o": ["look after", "to look after", "looking after", "looked after"], "a": 2, "u": 2}], "passage": "Many nomadic people in Mongolia live {1} gers. They move several times a year, {2} they need new grassland for their herds. Life there is not as convenient {3} life in the city, but nomads are generous {4} hospitable. They spend a lot of time {5} their animals.", "ptitle": "Life in a nomadic family"}, {"id": "d2-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I love playing badminton at the weekend. (fond)", "a": ["I am fond of playing badminton at the weekend."], "u": 1}, {"s": "Tuan is a faster runner than Nam. (fast)", "a": ["Tuan runs faster than Nam."], "u": 2}, {"s": "My mother doesn't like going out at night. (dislikes)", "a": ["My mother dislikes going out at night."], "u": 1}, {"s": "This bag is cheaper than that one. (expensive)", "a": ["That bag is more expensive than this one."], "u": 2}, {"s": "It was very cold. We stayed at home. (so)", "a": ["It was very cold, so we stayed at home."], "u": 3}]}, {"id": "d2-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mrs Lan spends two hours cooking dinner every day.", "stub": "It takes", "a": ["It takes Mrs Lan two hours to cook dinner every day.", "Mrs Lan two hours to cook dinner every day."], "u": 1}, {"s": "He likes taking photos in his free time.", "stub": "He is keen", "a": ["He is keen on taking photos in his free time.", "on taking photos in his free time."], "u": 1}, {"s": "My sister adores reading novels.", "stub": "My sister is crazy", "a": ["My sister is crazy about reading novels.", "about reading novels."], "u": 1}, {"s": "He feels nervous now, for he has an important test tomorrow.", "stub": "He has", "a": ["He has an important test tomorrow, so he feels nervous now.", "an important test tomorrow, so he feels nervous now."], "u": 3}, {"s": "Hoa doesn't write as neatly as Mai.", "stub": "Mai writes", "a": ["Mai writes more neatly than Hoa.", "more neatly than Hoa."], "u": 2}]}]}, {"id": "d3", "no": 3, "title": "Đề số 3", "acts": [{"id": "d3-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong __ than a person.", "o": ["more efficient", "more efficiently", "efficiently", "most efficiently"], "a": 1, "u": 2}, {"s": "My brother drives ___ than my father.", "o": ["careful", "more careful", "more carefully", "carefully"], "a": 2, "u": 2}, {"s": "Nam was tired; ___, he finished all his homework.", "o": ["so", "however", "or", "and"], "a": 1, "u": 3}, {"s": "We want to join the club, ___ we don't know how to sign up.", "o": ["so", "for", "but", "or"], "a": 2, "u": 3}, {"s": "She forgot her password, ___ she could not log on to her account.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Teenagers often feel ___ when they have too much schoolwork.", "o": ["stressed", "calm", "delighted", "focused"], "a": 0, "u": 3}]}, {"id": "d3-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Hoa (not like) ___ eating out.", "a": ["does not like", "doesn't like"], "u": 1}, {"s": "We prefer (stay) ___ at home on rainy days.", "a": ["staying", "to stay"], "u": 1}, {"s": "Mr Nam (herd) ___ the buffaloes every morning.", "a": ["herds"], "u": 2}, {"s": "Tom (not do) ___ his homework yesterday.", "a": ["did not do", "didn't do"], "u": 1}, {"s": "I don't mind (wait) ___ for you.", "a": ["waiting"], "u": 1}]}, {"id": "d3-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ : "Farmers work ___ than city workers in summer. (HARD)", "a": ["harder"], "u": 2}, {"s": "Many teens enjoy ___ to music. (LISTEN)", "a": ["listening"], "u": 1}, {"s": "The ___ in our village are very friendly. (VILLAGE)", "a": ["villagers"], "u": 2}, {"s": "The ___ of living in the city is great. (CONVENIENT)", "a": ["convenience"], "u": 2}]}, {"id": "d4-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "My brother is ___ skateboarding and rides every day.", "a": ["into"], "u": 1}, {"s": "She is interested ___ painting.", "a": ["in"], "u": 1}, {"s": "I'm crazy ___ comic books.", "a": ["about"], "u": 1}, {"s": "He opened the door ___ walked in.", "a": ["and"], "u": 3}, {"s": "It was late, ___ we went home.", "a": ["so"], "u": 3}], "box": ["and", "in", "so", "into", "about"]}, {"id": "d4-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["stressed"], "u": 3}, {"a": ["more"], "u": 3}, {"a": ["relax"], "u": 1}, {"a": ["with"], "u": 3}, {"a": ["however"], "u": 3}], "box": ["relax", "more", "however", "with", "stressed"], "passage": "Many teenagers feel {1} before the midterm test. They study {2} hours than usual, so they have less time to {3}. School clubs can help. Students can chat {4} friends and join fun activities. Some students are worried about the clubs; {5}, most of them feel happier after joining."}, {"id": "d4-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["surf", "to surf", "surfing", "surfed"], "a": 2, "u": 1}, {"o": ["message", "messaging", "to message", "messaged"], "a": 1, "u": 1}, {"o": ["in", "on", "at", "of"], "a": 1, "u": 1}, {"o": ["At", "In", "On", "By"], "a": 2, "u": 1}, {"o": ["quiet", "quieter", "more quiet", "quietest"], "a": 1, "u": 2}], "passage": "Vietnamese teenagers have many leisure activities. Many of them enjoy {1} the net and {2} with friends online. Girls are often keen {3} making crafts, but boys prefer playing sports. {4} Sundays, families often go to the countryside. The countryside is much {5} than the city.", "ptitle": "Free time in Viet Nam"}, {"id": "d4-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "He likes reading comics in his free time. (fond)", "a": ["He is fond of reading comics in his free time."], "u": 1}, {"s": "Nam is a more careful worker than Minh. (carefully)", "a": ["Nam works more carefully than Minh."], "u": 2}, {"s": "My cousin is crazy about fishing. (adores)", "a": ["My cousin adores fishing."], "u": 1}, {"s": "Our garden is larger than theirs. (smaller)", "a": ["Their garden is smaller than ours."], "u": 2}, {"s": "Hoa was ill. She missed the class. (therefore)", "a": ["Hoa was ill; therefore, she missed the class."], "u": 3}]}, {"id": "d4-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My brother spends two hours playing games every evening.", "stub": "It takes", "a": ["It takes my brother two hours to play games every evening.", "my brother two hours to play games every evening."], "u": 1}, {"s": "Mai loves drawing in her free time.", "stub": "Mai is fond", "a": ["Mai is fond of drawing in her free time.", "of drawing in her free time."], "u": 1}, {"s": "My father hates watching football.", "stub": "My father isn't keen", "a": ["My father isn't keen on watching football.", "on watching football."], "u": 1}, {"s": "He feels hungry, for he didn't have breakfast.", "stub": "He didn't", "a": ["He didn't have breakfast, so he feels hungry.", "have breakfast, so he feels hungry."], "u": 3}, {"s": "Mai doesn't speak as fluently as her friend.", "stub": "Her friend", "a": ["Her friend speaks more fluently than Mai.", "speaks more fluently than Mai."], "u": 2}]}]}, {"id": "d5", "no": 5, "title": "Đề số 5", "acts": [{"id": "d5-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>u<\/u>ll", "bl<u>ue<\/u>", "l<u>o<\/u>se", "j<u>ui<\/u>ce"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["g<u>oo<\/u>d", "z<u>oo<\/u>", "p<u>u<\/u>sh", "w<u>ou<\/u>ld"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["cott<u>age<\/u>", "<u>a<\/u>partment", "s<u>u<\/u>rprise", "freed<u>o<\/u>m"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["short<u>age<\/u>", "s<u>u<\/u>rprise", "<u>de<\/u>cide", "<u>re<\/u>new"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou<\/u>rist", "b<u>oi<\/u>l", "m<u>oo<\/u>r", "p<u>oo<\/u>r"], "a": 1, "u": 3}]}, {"id": "d5-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My little brother loves ___ with toy cars.", "o": ["play", "playing", "played", "plays"], "a": 1, "u": 1}, {"s": "She is not keen ___ camping in winter.", "o": ["on", "in", "of", "about"], "a": 0, "u": 1}, {"s": "He ___ doing puzzles. He thinks they are boring.", "o": ["detests", "adore", "fancy", "keen"], "a": 0, "u": 1}, {"s": "What do you do in your ___ time?", "o": ["leisure", "vast", "local", "cruel"], "a": 0, "u": 1}, {"s": "A tractor ploughs the field ___ than a buffalo.", "o": ["fast", "more fast", "faster", "fastest"], "a": 2, "u": 2}, {"s": "Hoa sings ___ than any other girl in my class.", "o": ["beautiful", "more beautiful", "beautifully", "more beautifully"], "a": 3, "u": 2}, {"s": "We hurried to the station; ___, we missed the train.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "My uncle is a farmer, ___ he gets up very early.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Would you like to go to the cinema ___ stay at home?", "o": ["and", "so", "or", "but"], "a": 2, "u": 3}, {"s": "I like the countryside because it is ___ and peaceful.", "o": ["quiet", "noisy", "crowded", "polluted"], "a": 0, "u": 2}]}, {"id": "d5-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Mr Hai often (go) ___ fishing on Sundays.", "a": ["goes"], "u": 1}, {"s": "My sister adores (cook) ___ new dishes.", "a": ["cooking"], "u": 1}, {"s": "We (not watch) ___ TV last night.", "a": ["did not watch", "didn't watch"], "u": 1}, {"s": "Tom is fond of (ride) ___ his bike in the park.", "a": ["riding"], "u": 1}, {"s": "She fancies (join) ___ the Art Club.", "a": ["joining"], "u": 3}]}, {"id": "d5-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My brother plays football ___ than I do. (WELL)", "a": ["better"], "u": 2}, {"s": "This is a very ___ place for a picnic. (ENJOY)", "a": ["enjoyable"], "u": 3}, {"s": "I have a strong ___ for classical music. (PREFER)", "a": ["preference"], "u": 1}, {"s": "Farmers live ___ in the village than in the city. (HAPPY)", "a": ["more happily"], "u": 2}, {"s": "Teachers give ___ to students before exams. (ADVISE)", "a": ["advice"], "u": 3}]}, {"id": "d5-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is not keen ___ playing chess.", "a": ["on"], "u": 1}, {"s": "My grandfather is fond ___ gardening.", "a": ["of"], "u": 1}, {"s": "I called him, ___ he didn't answer.", "a": ["but"], "u": 3}, {"s": "Mai felt stressed, ___ she talked to her teacher.", "a": ["so"], "u": 3}, {"s": "He is tired now, ___ he stayed up late last night.", "a": ["for"], "u": 3}], "box": ["for", "but", "of", "on", "so"]}, {"id": "d5-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["join"], "u": 3}, {"a": ["forum"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["calm"], "u": 3}, {"a": ["more"], "u": 2}], "box": ["forum", "join", "more", "however", "calm"], "passage": "Linh is a teenager. She likes school clubs, so she wants to {1} the English Club. She often posts questions on the school {2} and chats with her friends. Sometimes she feels stressed; {3}, she always stays {4} during tests. Linh studies {5} carefully than before."}, {"id": "d5-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["because", "because of", "so", "but"], "a": 1, "u": 3}, {"o": ["on", "in", "about", "of"], "a": 2, "u": 3}, {"o": ["or", "so", "but", "however"], "a": 0, "u": 3}, {"o": ["do", "doing", "to doing", "done"], "a": 1, "u": 1}, {"o": ["calm", "calmly", "calming", "calmness"], "a": 0, "u": 3}], "passage": "Many teenagers feel stressed {1} their schoolwork. Some of them also worry {2} exams. To reduce stress, it is a good idea to talk to your family {3} friends. You should also spend time {4} sports or hobbies you enjoy. Teenagers who feel {5} can study more effectively.", "ptitle": "Teen stress"}, {"id": "d5-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "I fancy learning to knit. (interested)", "a": ["I am interested in learning to knit."], "u": 1}, {"s": "Tom is a more fluent speaker than Hoa. (fluently)", "a": ["Tom speaks more fluently than Hoa."], "u": 2}, {"s": "He enjoys playing board games. (adores)", "a": ["He adores playing board games."], "u": 1}, {"s": "My house is bigger than yours. (smaller)", "a": ["Your house is smaller than mine."], "u": 2}, {"s": "The weather was bad. We still went camping. (however)", "a": ["The weather was bad; however, we still went camping."], "u": 3}]}, {"id": "d5-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Linh spends an hour doing her homework every night.", "stub": "It takes", "a": ["It takes Linh an hour to do her homework every night.", "Linh an hour to do her homework every night."], "u": 1}, {"s": "Mr Kim loves growing flowers.", "stub": "Mr Kim is fond", "a": ["Mr Kim is fond of growing flowers.", "of growing flowers."], "u": 1}, {"s": "My brother doesn't like cooking.", "stub": "My brother isn't keen", "a": ["My brother isn't keen on cooking.", "on cooking."], "u": 1}, {"s": "She felt sleepy, for she got up very early.", "stub": "She got", "a": ["She got up very early, so she felt sleepy.", "up very early, so she felt sleepy."], "u": 3}, {"s": "Lan doesn't walk as slowly as her sister.", "stub": "Her sister", "a": ["Her sister walks more slowly than Lan.", "walks more slowly than Lan."], "u": 2}]}]}, {"id": "d6", "no": 6, "title": "Đề số 6", "acts": [{"id": "d6-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo<\/u>n", "t<u>oo<\/u>l", "p<u>u<\/u>ll", "n<u>oo<\/u>n"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o<\/u>lf", "b<u>oo<\/u>k", "fr<u>ui<\/u>t", "c<u>oo<\/u>k"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["vill<u>age<\/u>", "freed<u>o<\/u>m", "c<u>o<\/u>ntrol", "hands<u>o<\/u>me"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>a<\/u>partment", "cott<u>age<\/u>", "<u>re<\/u>turn", "vill<u>age<\/u>"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oi<\/u>l", "destr<u>oy<\/u>", "t<u>oy<\/u>", "p<u>oo<\/u>r"], "a": 3, "u": 3}]}, {"id": "d6-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Nam doesn't mind ___ the chickens in the morning.", "o": ["feed", "feeding", "to feed", "fed"], "a": 1, "u": 1}, {"s": "My cousin is crazy ___ video games.", "o": ["about", "in", "on", "at"], "a": 0, "u": 1}, {"s": "She is really ___ origami and folds paper cranes every day.", "o": ["into", "in", "at", "of"], "a": 0, "u": 1}, {"s": "They ___ visiting museums at weekends.", "o": ["fancy", "fond", "keen", "crazy"], "a": 0, "u": 1}, {"s": "Buffaloes move ___ than tractors.", "o": ["slow", "more slow", "more slowly", "slowliest"], "a": 2, "u": 2}, {"s": "Tuan studies ___ than he used to.", "o": ["harder", "hard", "hardest", "more hardly"], "a": 0, "u": 2}, {"s": "The test was easy; ___, many students made mistakes.", "o": ["so", "however", "and", "or"], "a": 1, "u": 3}, {"s": "I'm busy, ___ I can't go with you.", "o": ["but", "so", "or", "however"], "a": 1, "u": 3}, {"s": "Do you want to join the Chess Club ___ the Music Club?", "o": ["so", "but", "or", "therefore"], "a": 2, "u": 3}, {"s": "In my village, people ___ rice in the sun after the harvest.", "o": ["dry", "catch", "load", "herd"], "a": 0, "u": 2}]}, {"id": "d6-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "The farmers (harvest) ___ the rice last week.", "a": ["harvested"], "u": 2}, {"s": "Mai (like) ___ going to the beach.", "a": ["likes"], "u": 1}, {"s": "My brother (not mind) ___ doing housework.", "a": ["does not mind", "doesn't mind"], "u": 1}, {"s": "He detests (be) ___ late for school.", "a": ["being"], "u": 1}, {"s": "We love (hang) ___ out with friends.", "a": ["hanging", "to hang"], "u": 1}]}, {"id": "d6-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "The sun shines ___ in summer than in winter. (BRIGHT)", "a": ["more brightly"], "u": 2}, {"s": "My grandfather has a valuable ___ of old coins. (COLLECT)", "a": ["collection"], "u": 2}, {"s": "She is very ___ with her classmates. (COMMUNICATE)", "a": ["communicative"], "u": 1}, {"s": "Her results were very ___. (SATISFY)", "a": ["satisfactory"], "u": 1}, {"s": "Playing sports helps us improve muscle ___. (STRONG)", "a": ["strength"], "u": 1}]}, {"id": "d6-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ (keen on, interested in, fond of, crazy about, into) hay liên từ (so, but, or, however, for), rồi thử nghĩa của cả câu.", "items": [{"s": "She is ___ painting and draws every day.", "a": ["into"], "u": 1}, {"s": "Are you crazy ___ football?", "a": ["about"], "u": 1}, {"s": "He is interested ___ history.", "a": ["in"], "u": 1}, {"s": "I felt hungry, ___ I made a sandwich.", "a": ["so"], "u": 3}, {"s": "The film was long; ___, we enjoyed it.", "a": ["however"], "u": 3}], "box": ["into", "about", "in", "so", "however"]}, {"id": "d6-VI", "part": "VI", "title": "Phần VI. Điền từ vào đoạn văn", "instr": "Read the text and choose the suitable words from the box for the blank spaces.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn một lượt, sau đó xác định mỗi chỗ trống cần loại từ nào và chọn từ trong khung có nghĩa phù hợp. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["vast"], "u": 2}, {"a": ["herd"], "u": 2}, {"a": ["harvest"], "u": 2}, {"a": ["local"], "u": 2}, {"a": ["load"], "u": 2}], "box": ["vast", "local", "herd", "harvest", "load"], "passage": "My aunt lives in a village next to a very {1} grassland. She has a {2} of cattle. Every morning, she goes out to feed them. At {3} time, many {4} people help her {5} the rice onto a cart."}, {"id": "d6-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu) hoặc liên từ.", "items": [{"o": ["from", "with", "about", "for"], "a": 0, "u": 2}, {"o": ["peaceful", "peacefully", "peace", "peacefulness"], "a": 1, "u": 2}, {"o": ["than", "as", "then", "that"], "a": 0, "u": 2}, {"o": ["but", "so", "or", "for"], "a": 1, "u": 3}, {"o": ["fly", "to flying", "flying", "flew"], "a": 2, "u": 2}], "passage": "Life in the countryside is different {1} life in the city. People there live {2} and spend a lot of time outdoors. In the past, farmers worked harder {3} they do today. Now many farmers use machines, {4} their work is easier. Children enjoy {5} kites in the paddy fields.", "ptitle": "Life in the countryside"}, {"id": "d6-VIII", "part": "VIII", "title": "Phần VIII. Viết lại câu theo từ gợi ý", "instr": "Rewrite the following sentences based on the words in brackets.", "type": "type", "start": 41, "huong": "Dùng đúng từ trong ngoặc và giữ nguyên nghĩa câu gốc. Em gõ cả câu hoàn chỉnh: so sánh hơn thì đổi chủ ngữ cho phù hợp, liên từ so/therefore/however nối hai ý, keen/fond/crazy đi với giới từ rồi V-ing.", "items": [{"s": "My father likes growing vegetables. (keen)", "a": ["My father is keen on growing vegetables."], "u": 1}, {"s": "Lan is a slower walker than Hoa. (slowly)", "a": ["Lan walks more slowly than Hoa."], "u": 2}, {"s": "He is crazy about skateboarding. (adores)", "a": ["He adores skateboarding."], "u": 1}, {"s": "Tea is cheaper than coffee. (expensive)", "a": ["Coffee is more expensive than tea."], "u": 2}, {"s": "I was ill. I didn't go to school. (therefore)", "a": ["I was ill; therefore, I didn't go to school."], "u": 3}]}, {"id": "d6-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Tom spends twenty minutes cycling to school every day.", "stub": "It takes", "a": ["It takes Tom twenty minutes to cycle to school every day.", "Tom twenty minutes to cycle to school every day."], "u": 1}, {"s": "She enjoys singing in her free time.", "stub": "She is fond", "a": ["She is fond of singing in h
