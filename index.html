an / people / city.", "a": ["People in the village live more peacefully than people in the city."], "u": 2}, {"s": "Farmers / harvest / rice / July / and / dry / it / yard.", "a": ["Farmers harvest rice in July and dry it in the yard."], "u": 2}, {"s": "Although / life / village / be / simple / people / be / happy.", "a": ["Although life in the village is simple, people are happy."], "u": 0}, {"s": "Many teens / be / fond / hang out / with / friends.", "a": ["Many teens are fond of hanging out with friends."], "u": 1}]}, {"id": "d12-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Nam spends two hours doing his homework every night.", "stub": "It takes", "a": ["It takes Nam two hours to do his homework every night.", "Nam two hours to do his homework every night."], "u": 1}, {"s": "He loves collecting stamps.", "stub": "He is fond", "a": ["He is fond of collecting stamps.", "of collecting stamps."], "u": 1}, {"s": "Hoa dislikes getting up early.", "stub": "Hoa isn't keen", "a": ["Hoa isn't keen on getting up early.", "on getting up early."], "u": 1}, {"s": "The road is bad, for it rained heavily last night.", "stub": "It rained", "a": ["It rained heavily last night, so the road is bad.", "heavily last night, so the road is bad.", "It rained heavily last night; therefore, the road is bad.", "heavily last night; therefore, the road is bad."], "u": 3}, {"s": "A tractor doesn't move as slowly as a buffalo-drawn cart.", "stub": "A buffalo-drawn cart", "a": ["A buffalo-drawn cart moves more slowly than a tractor.", "moves more slowly than a tractor."], "u": 2}]}]}, {"id": "d13", "no": 13, "title": "Đề số 13", "acts": [{"id": "d13-I", "part": 1}, {"s": "Ba is crazy ___ beach games.", "o": ["about", "in", "at", "of"], "a": 0, "u": 1}, {"s": "Does your brother fancy ___ to a resort this summer?", "o": ["go", "to go", "going", "went"], "a": 2, "u": 1}, {"s": "Lan is ___ of doing DIY; she makes many home-made gifts.", "o": ["keen", "fond", "interested", "crazy"], "a": 1, "u": 1}, {"s": "The farmers load rice ___ than they did in the past.", "o": ["more quickly", "quicklier", "quick", "more quick"], "a": 0, "u": 2}, {"s": "A ferry moves ___ than a boat with a motor.", "o": ["slow", "more slowly", "slowlier", "most slowly"], "a": 1, "u": 2}, {"s": "This villager works ___ than the others in the orchard.", "o": ["hard", "harder", "hardest", "more hard"], "a": 1, "u": 2}, {"s": "It was snowing heavily; ___, they went snowboarding.", "o": ["so", "therefore", "however", "for"], "a": 2, "u": 3}, {"s": "If I have free time, I ___ to the resort.", "o": ["will go", "went", "would go", "go"], "a": 0, "u": 0}, {"s": "Teenagers feel ___ when they have too much pressure from schoolwork.", "o": ["delighted", "stressed", "relaxed", "confident"], "a": 1, "u": 3}]}, {"id": "d13-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Tom often (hang) ___ out with his friends.", "a": ["hangs"], "u": 1}, {"s": "We (not go) ___ to the resort last summer.", "a": ["did not go", "didn't go"], "u": 1}, {"s": "Mai is fond of (listen) ___ to music in her leisure time.", "a": ["listening"], "u": 1}, {"s": "The villagers (unload) ___ the cart yesterday afternoon.", "a": ["unloaded"], "u": 2}, {"s": "My family (travel) ___ to the beach next summer.", "a": ["will travel"], "u": 0}]}, {"id": "d13-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Teenagers should join school clubs to improve their ___ skills. (COMMUNICATE)", "a": ["communication"], "u": 3}, {"s": "Swimming makes our muscles ___. (STRONG)", "a": ["stronger"], "u": 1}, {"s": "This movie is ___ than the last one. (INTEREST)", "a": ["more interesting"], "u": 1}, {"s": "The students ran ___ than their teacher. (QUICK)", "a": ["more quickly"], "u": 2}, {"s": "She finished the project ___. (SUCCESS)", "a": ["successfully"], "u": 3}]}, {"id": "d13-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Minh isn't ___ in surfing the net.", "a": ["interested"], "u": 1}, {"s": "My aunt is ___ of knitting scarves.", "a": ["fond"], "u": 1}, {"s": "Hoa is very ___ on origami.", "a": ["keen"], "u": 1}, {"s": "Are you ___ about dragon-snake games?", "a": ["crazy"], "u": 2}, {"s": "My brother is ___ playing board games.", "a": ["into"], "u": 1}], "box": ["interested", "fond", "keen", "crazy", "into"]}, {"id": "d13-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 2}, {"a": ["or"], "u": 2}, {"a": ["so"], "u": 2}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["for", "and", "or", "so", "however"], "passage": "Life in the countryside has both good points and bad points. People enjoy fresh air {1} picturesque views. They can walk in the paddy fields {2} ride bikes along the canal. Villagers are friendly, {3} they often help each other at harvest time. Life there is peaceful; {4}, it is not very convenient. Many teens like the village, {5} they can play outdoors all day."}, {"id": "d13-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["so", "or", "for", "but"], "a": 0, "u": 3}, {"o": ["so", "and", "or", "for"], "a": 1, "u": 3}, {"o": ["fast", "faster", "more fast", "fastly"], "a": 1, "u": 2}, {"o": ["dry", "drying", "dried", "to dry"], "a": 2, "u": 2}, {"o": ["therefore", "however", "so", "or"], "a": 1, "u": 3}], "passage": "Harvest time is the busiest season in the village, {1} all villagers get up very early. Some cut the rice, {2} others load it onto carts. A combine harvester can work {3} than ten people. After the harvest, the rice must be {4} in the sun. It is hard work; {5}, everyone feels happy.", "ptitle": "Harvest time"}, {"id": "d13-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "My grandparents / live / village / near / vast / paddy field.", "a": ["My grandparents live in a village near a vast paddy field."], "u": 2}, {"s": "They / get up / early / than / people / city.", "a": ["They get up earlier than people in the city."], "u": 2}, {"s": "Villagers / love / catch / fish / canal / evening.", "a": ["Villagers love catching fish in the canal in the evening.", "Villagers love to catch fish in the canal in the evening."], "u": 1}, {"s": "Although / the village / be / small / it / have / vast / paddy fields.", "a": ["Although the village is small, it has vast paddy fields."], "u": 0}, {"s": "Life / countryside / be / peaceful / however / not convenient.", "a": ["Life in the countryside is peaceful; however, it is not convenient."], "u": 3}]}, {"id": "d13-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "She spends an hour knitting every evening.", "stub": "It takes", "a": ["It takes her an hour to knit every evening.", "her an hour to knit every evening."], "u": 1}, {"s": "My father loves doing DIY.", "stub": "My father is fond", "a": ["My father is fond of doing DIY.", "of doing DIY."], "u": 1}, {"s": "Linh hates playing board games.", "stub": "Linh isn't keen", "a": ["Linh isn't keen on playing board games.", "on playing board games."], "u": 1}, {"s": "Nam is stressed now, for he has a midterm test tomorrow.", "stub": "Nam has", "a": ["Nam has a midterm test tomorrow, so he is stressed now.", "a midterm test tomorrow, so he is stressed now.", "Nam has a midterm test tomorrow; therefore, he is stressed now.", "a midterm test tomorrow; therefore, he is stressed now."], "u": 3}, {"s": "My brother doesn't swim as well as his friend.", "stub": "His friend", "a": ["His friend swims better than my brother.", "swims better than my brother."], "u": 2}]}]}, {"id": "d14", "no": 14, "title": "Đề số 14", "acts": [{"id": "d14-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>ou</u>ld", "m<u>oo</u>n", "f<u>oo</u>d", "fr<u>ui</u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>oo</u>d", "t<u>oo</u>k", "bl<u>ue</u>", "c<u>ou</u>ld"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>be</u>have", "b<u>a</u>nana", "gener<u>ou</u>s", "answ<u>e</u>r"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["anxi<u>ou</u>s", "<u>ex</u>change", "<u>pre</u>dict", "k<u>i</u>t"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>oi</u>n", "b<u>oi</u>l", "t<u>ou</u>rist", "j<u>oy</u>"], "a": 2, "u": 3}]}, {"id": "d14-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Mai doesn't mind ___ her little sister at weekends.", "o": ["look after", "looking after", "to look after", "looked after"], "a": 1, "u": 1}, {"s": "My brother is ___ on cooking and makes dinner every day.", "o": ["fond", "keen", "interested", "crazy"], "a": 1, "u": 1}, {"s": "Our teacher detests ___ late for class.", "o": ["is", "be", "being", "to be"], "a": 2, "u": 1}, {"s": "Are you interested ___ joining the Chess Club?", "o": ["in", "on", "at", "of"], "a": 0, "u": 1}, {"s": "Hung can ride a bike ___ than his cousin.", "o": ["fast", "faster", "more fast", "fastest"], "a": 1, "u": 2}, {"s": "Grandma gets up ___ than anyone else in the family.", "o": ["early", "earlier", "earliest", "more early"], "a": 1, "u": 2}, {"s": "The cattle in this farm are fed ___ than before.", "o": ["good", "best", "more well", "better"], "a": 3, "u": 2}, {"s": "He didn't study for the test, ___ he got a bad mark.", "o": ["so", "but", "or", "for"], "a": 0, "u": 3}, {"s": "If she feels tired, she ___ a rest.", "o": ["will take", "took", "would take", "take"], "a": 0, "u": 0}, {"s": "Peers can ___ their problems with the school helpline.", "o": ["discuss", "observe", "plough", "cultivate"], "a": 0, "u": 3}]}, {"id": "d14-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Nga (do) ___ puzzles with her grandfather every Sunday.", "a": ["does"], "u": 1}, {"s": "They (visit) ___ the orchard last month.", "a": ["visited"], "u": 2}, {"s": "My mother adores (grow) ___ flowers.", "a": ["growing"], "u": 1}, {"s": "He (not enjoy) ___ the football match yesterday.", "a": ["did not enjoy", "didn't enjoy"], "u": 1}, {"s": "The farmers (harvest) ___ the rice next month.", "a": ["will harvest"], "u": 0}]}, {"id": "d14-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Exams are ___ for many teens. (STRESS)", "a": ["stressful"], "u": 3}, {"s": "The ___ of living near the market is great. (CONVENIENT)", "a": ["convenience"], "u": 2}, {"s": "This website is ___ than the old one. (USEFUL)", "a": ["more useful"], "u": 3}, {"s": "The farmers worked ___ than the machines. (SLOW)", "a": ["more slowly"], "u": 2}, {"s": "He has a strong ___ for outdoor activities. (PREFER)", "a": ["preference"], "u": 1}]}, {"id": "d14-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Tom is fond ___ playing the guitar.", "a": ["of"], "u": 1}, {"s": "She is keen ___ painting.", "a": ["on"], "u": 1}, {"s": "Are you interested ___ the school forum?", "a": ["in"], "u": 3}, {"s": "My cousin is crazy ___ football.", "a": ["about"], "u": 1}, {"s": "Lan is ___ origami these days.", "a": ["into"], "u": 1}], "box": ["of", "on", "in", "about", "into"]}, {"id": "d14-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["so"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["and"], "u": 3}, {"a": ["for"], "u": 3}, {"a": ["however"], "u": 3}], "box": ["so", "however", "and", "or", "for"], "passage": "Many teenagers feel stressed before a midterm test. They worry a lot, {1} they cannot concentrate on their schoolwork. Some students talk to their friends {2} their teachers. Others listen to music {3} do some exercise. Exercise is good for them, {4} it helps them stay calm. It is not easy to stay calm; {5}, a little help can make a big difference."}, {"id": "d14-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["for", "so", "or", "however"], "a": 1, "u": 3}, {"o": ["and", "but", "or", "so"], "a": 0, "u": 3}, {"o": ["herding", "herd", "herds", "to herding"], "a": 0, "u": 2}, {"o": ["better", "good", "well", "best"], "a": 0, "u": 2}, {"o": ["convenient", "convenience", "conveniently", "convene"], "a": 0, "u": 2}], "passage": "Many families in Mongolia live in gers. A ger is a home that is easy to move. The families keep cattle, {1} they must move to new fields every season. The grassland is vast, {2} it is very beautiful. Children enjoy {3} the herds with their parents. They are brave and can ride horses {4} than adults. Life there is not very {5}, but people are happy.", "ptitle": "Life in a Mongolian grassland"}, {"id": "d14-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Local people / not use / combine harvesters / so / they / work / slow.", "a": ["Local people do not use combine harvesters, so they work slowly.", "Local people don't use combine harvesters, so they work slowly."], "u": 3}, {"s": "Cars / move / much / fast / than / buffalo-drawn carts.", "a": ["Cars move much faster than buffalo-drawn carts."], "u": 2}, {"s": "Children / village / dislike / stay / indoors.", "a": ["Children in the village dislike staying indoors."], "u": 1}, {"s": "Although / they / be / tired / they / still / help / each other.", "a": ["Although they are tired, they still help each other."], "u": 0}, {"s": "The air / countryside / be / fresh / and / the views / be / picturesque.", "a": ["The air in the countryside is fresh and the views are picturesque."], "u": 2}]}, {"id": "d14-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Hung thirty minutes to cycle to school.", "stub": "Hung spends", "a": ["Hung spends thirty minutes cycling to school.", "thirty minutes cycling to school."], "u": 1}, {"s": "Nga loves growing flowers.", "stub": "Nga is fond", "a": ["Nga is fond of growing flowers.", "of growing flowers."], "u": 1}, {"s": "My cousin hates playing chess.", "stub": "My cousin isn't keen", "a": ["My cousin isn't keen on playing chess.", "on playing chess."], "u": 1}, {"s": "He is sad now, for he lost his notebook.", "stub": "He lost", "a": ["He lost his notebook, so he is sad now.", "his notebook, so he is sad now.", "He lost his notebook; therefore, he is sad now.", "his notebook; therefore, he is sad now."], "u": 3}, {"s": "Lan doesn't write as carefully as Mai.", "stub": "Mai", "a": ["Mai writes more carefully than Lan.", "writes more carefully than Lan."], "u": 2}]}]}, {"id": "d15", "no": 15, "title": "Đề số 15", "acts": [{"id": "d15-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo</u>th", "w<u>o</u>lf", "c<u>oo</u>l", "bl<u>ue</u>"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo</u>d", "w<u>ou</u>ld", "w<u>o</u>man", "p<u>u</u>sh"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["gener<u>ou</u>s", "hands<u>o</u>me", "<u>de</u>cide", "c<u>o</u>mpare"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>de</u>cide", "c<u>o</u>ntrol", "w<u>i</u>n", "bagg<u>age</u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo</u>r", "t<u>ou</u>rist", "p<u>oi</u>nt", "t<u>ou</u>r"], "a": 2, "u": 3}]}, {"id": "d15-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My sister adores ___ stories to little children.", "o": ["read", "reading", "to read", "reads"], "a": 1, "u": 1}, {"s": "He is ___ about snowboarding and goes to the mountains every winter.", "o": ["fond", "interested", "crazy", "keen"], "a": 2, "u": 1}, {"s": "They don't mind ___ their classroom after school.", "o": ["clean", "to clean", "cleans", "cleaning"], "a": 3, "u": 1}, {"s": "Ba is not ___ on doing puzzles; he finds them boring.", "o": ["interested", "keen", "fond", "into"], "a": 1, "u": 1}, {"s": "The students answered the questions ___ than the teacher expected.", "o": ["more confident", "more confidently", "confidently", "most confidently"], "a": 1, "u": 3}, {"s": "Tractors work ___ than buffaloes.", "o": ["hard", "more hard", "harder", "hardest"], "a": 2, "u": 2}, {"s": "Farmers in this village harvest rice ___ than before.", "o": ["early", "earlier", "more early", "earliest"], "a": 1, "u": 2}, {"s": "The villagers were poor; ___, they were always generous.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "If the weather is fine, the villagers ___ the crop.", "o": ["gathered", "will gather", "would gather", "gather"], "a": 1, "u": 0}, {"s": "A ___ is someone who is the same age as you.", "o": ["peer", "leader", "bully", "coach"], "a": 0, "u": 3}]}, {"id": "d15-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Lan (message) ___ her friends every evening.", "a": ["messages"], "u": 1}, {"s": "The villagers (catch) ___ fish in the canal yesterday.", "a": ["caught"], "u": 2}, {"s": "Peter hates (get) ___ up early.", "a": ["getting", "to get"], "u": 1}, {"s": "We (not have) ___ a midterm test last week.", "a": ["did not have", "didn't have"], "u": 3}, {"s": "We (have) ___ a midterm test next Monday.", "a": ["will have"], "u": 0}]}, {"id": "d15-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Lan feels ___ after winning the competition. (SATISFY)", "a": ["satisfied"], "u": 3}, {"s": "The teacher spoke ___ than the students. (LOUD)", "a": ["louder"], "u": 2}, {"s": "Teens need good ___ to talk about their stress. (ADVISE)", "a": ["advice"], "u": 3}, {"s": "We can improve our ___ by doing yoga. (BALANCE)", "a": ["balance"], "u": 1}, {"s": "Dancing is an ___ activity for teens. (ENJOY)", "a": ["enjoyable"], "u": 1}]}, {"id": "d15-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "I'm crazy ___ board games.", "a": ["about"], "u": 1}, {"s": "I'm not ___ of messaging friends.", "a": ["fond"], "u": 1}, {"s": "Hoa is ___ on joining the Craft Club.", "a": ["keen"], "u": 1}, {"s": "Are you ___ in the school forum?", "a": ["interested"], "u": 3}, {"s": "She is ___ making home-made gifts.", "a": ["into"], "u": 1}], "box": ["into", "fond", "keen", "interested", "about"]}, {"id": "d15-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 3}, {"a": ["so"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["and", "for", "however", "or", "so"], "passage": "Our school has a popular website. Students can post questions {1} share ideas on the forum. Students often forget their passwords, {2} they ask the teacher for help. Do you want to log on with your account {3} ask a friend to help? Some students think the website is boring; {4}, most of them like it. They use it every day, {5} they can find news about school clubs there."}, {"id": "d15-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["and", "or", "but", "so"], "a": 0, "u": 3}, {"o": ["more", "most", "very", "much"], "a": 0, "u": 3}, {"o": ["for", "so", "but", "or"], "a": 0, "u": 3}, {"o": ["keen", "crazy", "interesting", "interested"], "a": 0, "u": 1}, {"o": ["advise", "advice", "advising", "advised"], "a": 1, "u": 3}], "passage": "Our school has some clubs for teenagers. In the Sport Club, students play basketball {1} improve their health. The Language Club helps members speak English {2} confidently. The Craft Club is popular, {3} many students are fond of making home-made gifts. Members of this club are {4} on origami. The club leader always gives them {5}.", "ptitle": "Meet the school clubs"}, {"id": "d15-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "My family / live / small village / far / city.", "a": ["My family lives in a small village far from the city."], "u": 2}, {"s": "We / go / school / by bike / so / we / not need / a bus.", "a": ["We go to school by bike, so we do not need a bus."], "u": 3}, {"s": "Farmers / work / hard / than / usual / at harvest time.", "a": ["Farmers work harder than usual at harvest time."], "u": 2}, {"s": "Although / the website / be / new / many students / use / it.", "a": ["Although the website is new, many students use it."], "u": 0}, {"s": "Life / village / not be / as / busy / as / life / city.", "a": ["Life in the village is not as busy as life in the city."], "u": 2}]}, {"id": "d15-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mai spends one hour surfing the net every day.", "stub": "It takes", "a": ["It takes Mai one hour to surf the net every day.", "Mai one hour to surf the net every day."], "u": 1}, {"s": "My mother loves cooking.", "stub": "My mother is fond", "a": ["My mother is fond of cooking.", "of cooking."], "u": 1}, {"s": "Tom dislikes doing puzzles.", "stub": "Tom isn't keen", "a": ["Tom isn't keen on doing puzzles.", "on doing puzzles."], "u": 1}, {"s": "She is worried now, for she has a test tomorrow.", "stub": "She has", "a": ["She has a test tomorrow, so she is worried now.", "a test tomorrow, so she is worried now.", "She has a test tomorrow; therefore, she is worried now.", "a test tomorrow; therefore, she is worried now."], "u": 3}, {"s": "Hoa doesn't draw as well as Lan.", "stub": "Lan", "a": ["Lan draws better than Hoa.", "draws better than Hoa."], "u": 2}]}]}, {"id": "d16 u>rist"], "a": 0, "u": 3}]}, {"id": "d17-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My father dislikes ___ in the sun for a long time.", "o": ["stand", "standing", "to stand", "stood"], "a": 1, "u": 1}, {"s": "Hoa is ___ on yoga, so she practises every morning.", "o": ["keen", "interested", "fond", "crazy"], "a": 0, "u": 1}, {"s": "She doesn't mind ___ her account every week.", "o": ["update", "updated", "updating", "to update"], "a": 2, "u": 1}, {"s": "Doing yoga helps improve our ___.", "o": ["balance", "poultry", "crop", "canal"], "a": 0, "u": 1}, {"s": "Chickens and ducks are called ___.", "o": ["cattle", "poultry", "orchards", "canals"], "a": 1, "u": 2}, {"s": "The farmer works ___ than his son in the orchard.", "o": ["more hard", "hardest", "harder", "hard"], "a": 2, "u": 2}, {"s": "He drove ___ than usual because of the rain.", "o": ["slow", "slowly", "more slowly", "slowest"], "a": 2, "u": 2}, {"s": "You must log on to your account, ___ you cannot post a comment.", "o": ["so", "or else", "however", "and"], "a": 1, "u": 3}, {"s": "If you don't hurry, you ___ the bus.", "o": ["will miss", "missed", "would miss", "miss"], "a": 0, "u": 0}, {"s": "The teacher will ___ you on how to study better.", "o": ["advise", "unload", "plough", "stretch"], "a": 0, "u": 3}]}, {"id": "d17-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Bao (stay) ___ in shape by swimming twice a week.", "a": ["stays"], "u": 1}, {"s": "We (post) ___ photos on the school website yesterday.", "a": ["posted"], "u": 3}, {"s": "My aunt adores (feed) ___ the chickens.", "a": ["feeding"], "u": 2}, {"s": "The cows (not eat) ___ much grass last winter.", "a": ["did not eat", "didn't eat"], "u": 2}, {"s": "My father (plough) ___ the field tomorrow morning.", "a": ["will plough"], "u": 0}]}, {"id": "d17-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "She runs ___ than her friends. (QUICK)", "a": ["more quickly"], "u": 2}, {"s": "Our coach gives us good ___. (ADVISE)", "a": ["advice"], "u": 3}, {"s": "The team did better than the coach's ___. (EXPECT)", "a": ["expectations", "expectation"], "u": 3}, {"s": "Our class had a ___ about school clubs. (DISCUSS)", "a": ["discussion"], "u": 3}, {"s": "The cows moved ___ along the canal. (SLOW)", "a": ["slowly"], "u": 2}]}, {"id": "d17-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "My brother is ___ about basketball.", "a": ["crazy"], "u": 1}, {"s": "Are you ___ on gardening?", "a": ["keen"], "u": 1}, {"s": "Lan isn't ___ in snowboarding.", "a": ["interested"], "u": 1}, {"s": "He is ___ of fresh fruit.", "a": ["fond"], "u": 1}, {"s": "She's ___ doing yoga.", "a": ["into"], "u": 1}], "box": ["interested", "fond", "keen", "crazy", "into"]}, {"id": "d17-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["so"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["and", "or", "so", "however", "for"], "passage": "Our class made a website for the school club. Members can post photos {1} share their ideas on it. They can log on with an account {2} a nickname. The website is new, {3} many students visit it every day. Some teens spend too much time online; {4}, they know how to balance it with sports. The teacher is happy, {5} the students work as a team."}, {"id": "d17-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["milks", "milk", "milking", "milked"], "a": 1, "u": 2}, {"o": ["and", "so", "or", "for"], "a": 0, "u": 2}, {"o": ["good", "well", "better", "best"], "a": 2, "u": 2}, {"o": ["and", "so", "or", "for"], "a": 0, "u": 3}, {"o": ["so", "but", "or", "for"], "a": 1, "u": 3}], "passage": "Many farmers in my village keep cattle and poultry. They {1} the cows early in the morning. Cows give milk, {2} chickens give eggs. Farmers feed their animals {3} than before because they have new food. They sell some eggs at the market, {4} they keep the rest for the family. Farm work is hard, {5} the farmers love it.", "ptitle": "Farm animals"}, {"id": "d17-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Farmers / feed / chickens / and / ducks / every morning.", "a": ["Farmers feed chickens and ducks every morning."], "u": 2}, {"s": "Tractors / plough / fields / fast / than / buffaloes.", "a": ["Tractors plough fields faster than buffaloes.", "Tractors plough the fields faster than buffaloes."], "u": 2}, {"s": "My uncle / not mind / get up / early / milk / cows.", "a": ["My uncle does not mind getting up early to milk the cows."], "u": 1}, {"s": "Although / farm work / be / hard / farmers / love / it.", "a": ["Although farm work is hard, farmers love it."], "u": 0}, {"s": "Many families / keep / cattle / and / poultry / village.", "a": ["Many families keep cattle and poultry in the village."], "u": 2}]}, {"id": "d17-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Hoa spends one hour doing yoga every morning.", "stub": "It takes", "a": ["It takes Hoa one hour to do yoga every morning.", "Hoa one hour to do yoga every morning."], "u": 1}, {"s": "My brother adores playing basketball.", "stub": "My brother is fond", "a": ["My brother is fond of playing basketball.", "of playing basketball."], "u": 1}, {"s": "Mr Binh detests using the website.", "stub": "Mr Binh isn't keen", "a": ["Mr Binh isn't keen on using the website.", "on using the website."], "u": 1}, {"s": "Hung is happy now, for his team won the competition.", "stub": "His team won", "a": ["His team won the competition, so Hung is happy now.", "the competition, so Hung is happy now.", "His team won the competition; therefore, Hung is happy now.", "the competition; therefore, Hung is happy now."], "u": 3}, {"s": "Ba doesn't read as carefully as Hoa.", "stub": "Hoa", "a": ["Hoa reads more carefully than Ba.", "reads more carefully than Ba."], "u": 2}]}]}, {"id": "d18", "no": 18, "title": "Đề số 18", "acts": [{"id": "d18-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["s<u>oo</u>n", "t<u>oo</u>k", "l<u>o</u>se", "t<u>oo</u>th"], "a": 1, " eacher.", "o": ["more clearly", "clearlier", "more clear", "most clearly"], "a": 0, "u": 2}, {"s": "He wanted to join the club; ___, he had no time.", "o": ["so", "however", "for", "or"], "a": 1, "u": 3}, {"s": "If they have a ger, they ___ on the grassland.", "o": ["lived", "live", "will live", "would live"], "a": 2, "u": 0}, {"s": "Our teacher will ___ us to join school clubs.", "o": ["advise", "observe", "unload", "cultivate"], "a": 0, "u": 3}]}, {"id": "d18-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "My sister (socialise) ___ with her friends at weekends.", "a": ["socialises"], "u": 1}, {"s": "The villagers (pick) ___ fruit in the orchard last week.", "a": ["picked"], "u": 2}, {"s": "Linh enjoys (communicate) ___ with people from other countries.", "a": ["communicating"], "u": 1}, {"s": "He (not fancy) ___ joining the club.", "a": ["does not fancy", "doesn't fancy"], "u": 1}, {"s": "The class (discuss) ___ the project tomorrow.", "a": ["will discuss"], "u": 0}]}, {"id": "d18-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "She is a very ___ girl. (COMMUNICATE)", "a": ["communicative"], "u": 1}, {"s": "Teens need more ___ with their peers. (SOCIALISE)", "a": ["socialisation", "socialization"], "u": 1}, {"s": "They walked ___ than the tourists. (SLOW)", "a": ["more slowly"], "u": 2}, {"s": "My uncle is a stamp ___. (COLLECT)", "a": ["collector"], "u": 1}, {"s": "It rained ___ than yesterday. (HEAVY)", "a": ["more heavily"], "u": 2}]}, {"id": "d18-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Is she keen ___ socialising?", "a": ["on"], "u": 1}, {"s": "He is not interested ___ origami.", "a": ["in"], "u": 1}, {"s": "My aunt is fond ___ gardening.", "a": ["of"], "u": 1}, {"s": "They are crazy ___ the new game.", "a": ["about"], "u": 1}, {"s": "My cousin is ___ photography.", "a": ["into"], "u": 1}], "box": ["of", "in", "about", "on", "into"]}, {"id": "d18-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["so"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["and", "or", "so", "however", "for"], "passage": "Teenagers need to communicate well. They talk to their friends {1} share their problems with them. They can also discuss their worries with a coach {2} a teacher. A good coach listens carefully, {3} the students trust him. Some teens feel shy; {4}, they can learn to socialise. Teens should practise, {5} practice makes them confident."}, {"id": "d18-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["ancient", "anciently", "ancientness", "ancients"], "a": 0, "u": 2}, {"o": ["and", "so", "or", "for"], "a": 0, "u": 2}, {"o": ["and", "or", "so", "for"], "a": 0, "u": 2}, {"o": ["so", "or", "but", "however"], "a": 0, "u": 3}, {"o": ["than", "as", "that", "then"], "a": 0, "u": 2}], "passage": "Our country has many ancient villages. In one of them, the houses are very {1} and beautiful. The village lies on a vast plain, {2} the paddy fields stretch to the horizon. Visitors can walk along the lanes {3} look at the old gates. The villagers are friendly, {4} they welcome tourists warmly. Life there is more peaceful {5} life in the city.", "ptitle": "An ancient village"}, {"id": "d18-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "The grassland / be / vast / and / the sky / be / blue.", "a": ["The grassland is vast and the sky is blue."], "u": 2}, {"s": "Herders / ride / horses / good / than / city people.", "a": ["Herders ride horses better than city people."], "u": 2}, {"s": "Children / local village / love / play / dragon-snake.", "a": ["Children in the local village love playing dragon-snake.", "Children in the local village love to play dragon-snake."], "u": 1}, {"s": "Although / the village / be / ancient / life / there / be / convenient.", "a": ["Although the village is ancient, life there is convenient."], "u": 0}, {"s": "People / countryside / be / kind / and / generous.", "a": ["People in the countryside are kind and generous."], "u": 2}]}, {"id": "d18-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Nga spends ten minutes updating her account every day.", "stub": "It takes", "a": ["It takes Nga ten minutes to update her account every day.", "Nga ten minutes to update her account every day."], "u": 1}, {"s": "She adores socialising with her peers.", "stub": "She is fond", "a": ["She is fond of socialising with her peers.", "of socialising with her peers."], "u": 1}, {"s": "Tom detests messaging friends.", "stub": "Tom isn't keen", "a": ["Tom isn't keen on messaging friends.", "on messaging friends."], "u": 1}, {"s": "Mai is nervous now, for she has a competition tomorrow.", "stub": "Mai has", "a": ["Mai has a competition tomorrow, so she is nervous now.", "a competition tomorrow, so she is nervous now.", "Mai has a competition tomorrow; therefore, she is nervous now.", "a competition tomorrow; therefore, she is nervous now."], "u": 3}, {"s": "Lan doesn't speak as confidently as Hoa.", "stub": "Hoa", "a": ["Hoa speaks more confidently than Lan.", "speaks more confidently than Lan."], "u": 2}]}]}, {"id": "d19" t this summer.", "o": ["go", "going", "to go", "went"], "a": 1, "u": 1}, {"s": "Huy is ___ on beach games; he plays them every weekend.", "o": ["fond", "keen", "interested", "crazy"], "a": 1, "u": 1}, {"s": "He doesn't mind ___ the dishes after dinner.", "o": ["wash", "washing", "to wash", "washed"], "a": 1, "u": 1}, {"s": "Mi is crazy ___ the idea of a snowboarding trip.", "o": ["on", "of", "about", "in"], "a": 2, "u": 1}, {"s": "The herd moved ___ than we expected.", "o": ["slow", "more slowly", "slowlier", "slowest"], "a": 1, "u": 2}, {"s": "He explained the lesson ___ than his classmate.", "o": ["more clearly", "clearly", "most clearly", "clearlier"], "a": 0, "u": 2}, {"s": "She sings ___ than her sister, and the audience loves her.", "o": ["more beautifully", "beautifuller", "more beautiful", "most beautifully"], "a": 0, "u": 2}, {"s": "The climb was hard; ___, the view was worth it.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "If it is hot, we ___ swimming.", "o": ["will go", "went", "would go", "go"], "a": 0, "u": 0}, {"s": "A ___ person is not afraid of danger.", "o": ["brave", "calm", "vast", "local"], "a": 0, "u": 2}]}, {"id": "d19-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "My uncle (milk) ___ the cows every morning.", "a": ["milks"], "u": 2}, {"s": "They (not go) ___ to the beach last Sunday.", "a": ["did not go", "didn't go"], "u": 1}, {"s": "Mai adores (play) ___ beach games.", "a": ["playing" nh hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["so"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["and"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["so", "or", "and", "however", "for"], "passage": "Life skills are important for teens. They learn to manage time, {1} they feel less stressed. Do you prefer working alone {2} in a team? Good teens listen to others {3} share their ideas. Some tasks are difficult; {4}, teens can solve them together. Teamwork is useful, {5} it helps teens become mature."}, {"id": "d19-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["arrive", "arrives", "arrived", "arriving"], "a": 2, "u": 1}, {"o": ["so", "but", "or", "for"], "a": 1, "u": 3}, {"o": ["in", "at", "on", "by"], "a": 0, "u": 1}, {"o": ["relax", "relaxing", "relaxed", "relaxes"], "a": 1, "u": 1}, {"o": ["but", "so", "therefore", "however"], "a": 2, "u": 3}], "passage": "Last summer my family went to a beach resort. We {1} there by coach. The resort was big, {2} the rooms were not expensive. My brother and I played beach games {3} the afternoon. My parents liked {4} on the sand. The weather was hot; {5}, we swam every day.", "ptitle": "A holiday at a resort"}, {"id": "d19-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Some local people / live / ger / and / herd / cattle.", "a": ["Some local people live in gers and herd cattle.", "Some local people live in a ger and herd cattle."], "u": 2}, {"s": "Children / grassland / ride / horses / good / than / city children.", "a": ["Children on the grassland ride horses better than city children."], "u": 2}, {"s": "The villagers / love / dry / rice / in the sun.", "a": ["The villagers love drying rice in the sun.", "The villagers love to dry rice in the sun."], "u": 1}, {"s": "Although / the climb / be / hard / we / enjoy / the view.", "a": ["Although the climb is hard, we enjoy the view."], "u": 0}, {"s": "Herders / not have / electrical appliances / so / they / not watch / TV.", "a": ["Herders do not have electrical appliances, so they do not watch TV."], "u": 3}]}, {"id": "d19-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Tuan one hour to drive to the resort.", "stub": "Tuan spends", "a": ["Tuan spends one hour driving to the resort.", "one hour driving to the resort."], "u": 1}, {"s": "He loves playing beach games.", "stub": "He is fond", "a": ["He is fond of playing beach games.", "of playing beach games."], "u": 1}, {"s": "My mother detests cooking.", "stub": "My mother isn't keen", "a": ["My mother isn't keen on cooking.", "on cooking."], "u": 1}, {"s": "Binh is happy now, for he passed the midterm test.", "stub": "Binh passed", "a": ["Binh passed the midterm test, so he is happy now.", "the midterm test, so he is happy now.", "Binh passed the midterm test; therefore, he is happy now.", "the midterm test; therefore, he is happy now."], "u": 3}, {"s": "The cart doesn't go as quickly as the bus.", "stub": "The bus", "a": ["The bus goes more quickly than the cart.", "goes more quickly than the cart."], "u": 2}]}]}, {"id": "d20", "no": 20, "title": "Đề số 20", "acts": [{"id": "d20-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>o</u>ve", "t<u>oo</u>th", "w<u>o</u>lf", "f<u>oo</u>d"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>ou</u>ld", "fr<u>ui</u>t", "w<u>oo</u>d", "w<u>oo</u>l"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>o</u>ntrol", "<u>u</u>pon", "<u>a</u>partment", "cott<u>age</u>"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["short<u>age</u>", "b<u>ui</u>ld", "bagg<u>age</u>", "sil<u>e</u>nt"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["j<u>oy</u>", "c<u>oi</u>n", "b<u>oy</u>", "t<u>ou</u>rist"], "a": 3, "u": 3}]}, {"id": "d20-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My grandfather adores ___ the garden in his free time.", "o": ["water", "watering", "to water", "watered"], "a": 1, "u": 1}, {"s": "Lan is crazy ___ DIY projects.", "o": ["on", "of", "in", "about"], "a": 3, "u": 1}, {"s": "Does he fancy ___ a craft kit?", "o": ["buy", "buying", "to buy", "bought"], "a": 1, "u": 1}, {"s": "My brother is ___ on snowboarding.", "o": ["fond", "keen", "interested", "crazy"], "a": 1, "u": 1}, {"s": "Hoa speaks English ___ than Nam.", "o": ["more fluent", "more fluently", "fluently", "fluenter"], "a": 1, "u": 2}, {"s": "This tractor works ___ than that old one.", "o": ["well", "better", "good", "best"], "a": 1, "u": 2}, {"s": "Our team practised ___ than the others.", "o": ["more regularly", "regularlier", "more regular", "most regularly"], "a": 0, "u": 2}, {"s": "He is tired; ___, he still goes jogging.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "If he practises every day, he ___ better.", "o": ["will play", "played", "would play", "plays"], "a": 0, "u": 0}, {"s": "The leader will ___ the team before the competition.", "o": ["coach", "herd", "plough", "unload"], "a": 0, "u": 3}]}, {"id": "d20-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Her father (surf) ___ the net every night.", "a": ["surfs"], "u": 1}, {"s": "The students (share) ___ photos on the forum yesterday.", "a": ["shared"], "u": 3}, {"s": "The farmers detest (load) ___ carts in the rain.", "a": ["loading"], "u": 2}, {"s": "My aunt (not plant) ___ vegetables last year.", "a": ["did not plant", "didn't plant"], "u": 2}, {"s": "My cousin (call) ___ me this evening.", "a": ["will call"], "u": 0}]}, {"id": "d20-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He rode ___ than before. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "Outdoor ___ are good for teens. (ACTIVE)", "a": ["activities", "activity"], "u": 1}, {"s": "Walking is ___ to driving. (PREFER)", "a": ["preferable"], "u": 1}, {"s": "Teens need ___ to study well. (CONCENTRATE)", "a": ["concentration"], "u": 3}, {"s": "Her little brother is ___. (ADORE)", "a": ["adorable"], "u": 1}]}, {"id": "d20-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Tom is ___ in cultural events.", "a": ["interested"], "u": 1}, {"s": "My sister is ___ on knitting.", "a": ["keen"], "u": 1}, {"s": "He is ___ of fresh milk.", "a": ["fond"], "u": 1}, {"s": "Hoa is ___ about folk music.", "a": ["crazy"], "u": 1}, {"s": "I'm ___ DIY these days.", "a": ["into"], "u": 1}], "box": ["fond", "keen", "interested", "crazy", "into"]}, {"id": "d20-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 2}, {"a": ["so"], "u": 2}, {"a": ["or"], "u": 2}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["and", "so", "or", "however", "for"], "passage": "Hoa lives in a village with her grandparents. She helps them feed pigs {1} collect eggs. The village is far from the city, {2} she goes to school by bike. Does she go alone {3} with her friends? The road is long; {4}, she never feels bored. She loves country life, {5} it is peaceful and the air is fresh."}, {"id": "d20-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["feel", "feels", "felt", "feeling"], "a": 0, "u": 3}, {"o": ["so", "because", "or", "but"], "a": 1, "u": 3}, {"o": ["advise", "advice", "advising", "advised"], "a": 0, "u": 3}, {"o": ["and", "or", "so", "for"], "a": 0, "u": 3}, {"o": ["than", "as", "then", "that"], "a": 0, "u": 3}], "passage": "Many teenagers feel stressed because of schoolwork. They often {1} too much pressure from their parents. Some teens cannot concentrate {2} they are tired. A good coach can {3} them how to stay calm. They should talk to their peers {4} share their feelings. This is easier {5} they think.", "ptitle": "Teens and stress"}, {"id": "d20-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Life / village / be / simple / and / peaceful.", "a": ["Life in the village is simple and peaceful."], "u": 2}, {"s": "Combine harvesters / work / far / fast / than / villagers.", "a": ["Combine harvesters work far faster than villagers."], "u": 2}, {"s": "Many villagers / not mind / get up / early.", "a": ["Many villagers do not mind getting up early."], "u": 1}, {"s": "Although / they / be / busy / they / always / smile.", "a": ["Although they are busy, they always smile."], "u": 0}, {"s": "Children / village / catch / fish / canal / and / play / outdoors.", "a": ["Children in the village catch fish in the canal and play outdoors."], "u": 2}]}, {"id": "d20-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mai spends two hours doing DIY every Sunday.", "stub": "It takes", "a": ["It takes Mai two hours to do DIY every Sunday.", "Mai two hours to do DIY every Sunday."], "u": 1}, {"s": "Linh adores folk music.", "stub": "Linh is fond", "a": ["Linh is fond of folk music.", "of folk music."], "u": 1}, {"s": "Nam dislikes washing dishes.", "stub": "Nam isn't keen", "a": ["Nam isn't keen on washing dishes.", "on washing dishes."], "u": 1}, {"s": "The ground is wet, for it rained all night.", "stub": "It rained", "a": ["It rained all night, so the ground is wet.", "all night, so the ground is wet.", "It rained all night; therefore, the ground is wet.", "all night; therefore, the ground is wet."], "u": 3}, {"s": "Hung doesn't run as fast as Tuan.", "stub": "Tuan", "a": ["Tuan runs faster than Hung.", "runs faster than Hung."], "u": 2}]}]}, {"id": "d21", "no": 21, "title": "Đề số 21", "acts": [{"id": "d21-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["fr<u>ui</u>t", "s<u>oo</u>n", "t<u>oo</u>k", "g<u>oo</u>se"], "a": 2, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>oo</u>l", "sh<u>ou</u>ld", "z<u>oo</u>", "f<u>u</u>ll"], "a": 2, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["fam<u>ou</u>s", "b<u>ui</u>ld", "op<u>e</u>n", "pict<u>u</u>re"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>pre</u>dict", "b<u>i</u>t", "gener<u>ou</u>s", "<u>de</u>cide"], "a": 2, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo</u>r", "t<u>ou</u>rist", "t<u>ou</u>r", "j<u>oy</u>"], "a": 3, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ʊə/, một từ đọc /ɔɪ/. Chọn từ đọc /ɔɪ/."}]}, {"id": "d21-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My sister adores ___ cartoons on Sunday mornings.", "o": ["watched", "watching", "watch", "to watch"], "a": 1, "u": 1, "hint": "Sau adore dùng V-ing."}, {"s": "Nam runs ___ than his cousin, so he usually wins the race.", "o": ["fast", "faster", "fastest", "more fast"], "a": 1, "u": 2, "hint": "Có than: so sánh hơn của trạng từ ngắn, thêm -er."}, {"s": "I wanted to go cycling, ___ it was raining heavily.", "o": ["and", "but", "so", "or"], "a": 1, "u": 3, "hint": "Hai vế đối lập (muốn đi xe đạp / trời mưa): dùng liên từ chỉ sự đối lập."}, {"s": "Tom is crazy ___ rock climbing; he goes every weekend.", "o": ["for", "at", "with", "about"], "a": 3, "u": 1, "hint": "Cụm cố định be crazy + giới từ about."}, {"s": "My father likes ___ in the garden; he grows flowers and vegetables.", "o": ["surfing", "gardening", "skateboarding", "knitting"], "a": 1, "u": 1, "hint": "Trồng hoa, rau: sở thích làm vườn, dạng V-ing."}, {"s": "Farmers ___ rice in October, when it is ripe.", "o": ["harvest", "collect", "surf", "knit"], "a": 0, "u": 2, "hint": "Thu hoạch lúa khi chín: động từ harvest."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Lan is <u>fond of</u> reading detective stories.", "o": ["afraid of", "keen on", "tired of", "bad at"], "a": 1, "u": 1, "hint": "fond of = rất thích, gần nghĩa với be keen on."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: The countryside is usually <u>quiet</u>.", "o": ["peaceful", "silent", "calm", "noisy"], "a": 3, "u": 2, "hint": "quiet (yên tĩnh) trái nghĩa với noisy (ồn ào)."}, {"s": "– “Would you like to join our badminton club?” – “___”", "o": ["It's my pleasure.", "Yes, I like.", "Yes, I'd love to.", "No, I don't mind."], "a": 2, "u": 1, "hint": "Lời mời vào câu lạc bộ: nhận lời bằng Yes, I'd love to."}, {"s": "Find the mistake: My brother <u>detests</u> <u>to wash</u> the <u>dishes</u> <u>after</u> dinner.", "o": ["detests", "to wash", "dishes", "after"], "a": 1, "u": 1, "hint": "Sau detest dùng V-ing, nên lỗi nằm ở dạng động từ."}]}, {"id": "d21-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Mr Nam (spend) ___ every Sunday morning fishing by the river.", "a": 0, "u": 1, "hint": "Hiện tại đơn, chủ ngữ ngôi thứ ba số ít: thêm -s/-es (đổi y thành ies nếu trước y là phụ âm).", "o": ["spends", "spend", "spending"], "c3": 1}, {"s": "I think our team (win) ___ the badminton match next week.", "a": 0, "u": 1, "hint": "Dự đoán, lời hứa về tương lai: will + động từ nguyên mẫu.", "o": ["will win", "wins", "won"], "c3": 1}, {"s": "My grandmother (not like) ___ using a smartphone.", "a": 0, "u": 1, "hint": "Phủ định hiện tại đơn: do/does not + động từ nguyên mẫu.", "o": ["does not like", "do not like", "does not likes"], "c3": 1}, {"s": "You had better (stay) ___ in bed because you are ill.", "a": 0, "u": 2, "hint": "had better, should, Why don't we + động từ nguyên mẫu.", "o": ["stay", "to stay", "staying"], "c3": 1}, {"s": "Last summer, we (stay) ___ on my uncle's farm for two weeks.", "a": 0, "u": 2, "hint": "Có last, yesterday hoặc ago: quá khứ đơn, thêm -ed hoặc dùng dạng bất quy tắc.", "o": ["stayed", "stay", "stays"], "c3": 1}]}, {"id": "d21-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Lan is a ___ girl who often helps her neighbours. (HELP)", "a": 0, "u": 2, "hint": "Cần tính từ: thêm -ful hoặc -y vào từ gốc (peace thành peaceful).", "o": ["helpful", "helpless", "helpfully"], "c3": 1}, {"s": "Our teacher speaks English very ___ . (FLUENT)", "a": 0, "u": 2, "hint": "Cần trạng từ cách thức: tính từ + -ly.", "o": ["fluently", "fluent", "fluency"], "c3": 1}, {"s": "Her ___ helped her win the speaking contest. (CONFIDENT)", "a": 0, "u": 1, "hint": "Cần danh từ trừu tượng: đuôi -ce, -ity, -th hoặc -ship.", "o": ["confidence", "confident", "confidently"], "c3": 1}, {"s": "Minh was ___ because he lost the match. (HAPPY)", "a": 0, "u": 1, "hint": "Thêm tiền tố phủ định un- vào từ gốc (hoặc từ trái nghĩa).", "o": ["unhappy", "happy", "unhappily"], "c3": 1}, {"s": "The children played ___ in the yard all afternoon. (HAPPY)", "a": 0, "u": 2, "hint": "Cần trạng từ: tính từ + -ly (y đổi thành -ily).", "o": ["happily", "happy", "happiness"], "c3": 1}]}, {"id": "d21-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Reading comics is my favourite ___ .", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là sở thích.", "o": ["hobby", "collect", "hang"], "c3": 1}, {"s": "I often ___ out with my classmates at the weekend.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, hang out nghĩa là đi chơi.", "o": ["hang", "member", "free"], "c3": 1}, {"s": "Hoa is a ___ of the school music club.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là thành viên.", "o": ["member", "free", "hang"], "c3": 1}, {"s": "I read comic books in my ___ time.", "a": 0, "u": 1, "hint": "Từ cần điền: tính từ, nghĩa là rảnh rỗi.", "o": ["free", "hang", "hobby"], "c3": 1}, {"s": "My uncle likes to ___ old coins from different countries.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là sưu tầm.", "o": ["collect", "free", "member"], "c3": 1}], "box": ["hobby", "collect", "member", "free", "hang"]}, {"id": "d21-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 1, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "or else", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: câu sau là kết quả của câu trước, đứng đầu câu có dấu phẩy: dùng Therefore.", "o": ["Therefore", "or else", "or"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: đưa ra lựa chọn: dùng or.", "o": ["or", "so", "Therefore"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: nếu không thì (hậu quả xấu): dùng or else.", "o": ["or else", "so", "Therefore"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "or else", "or"], "c3": 1}], "box": ["or else", "so", "or", "Therefore", "but"], "passage": "Tuan loves computer games, {1} his mother thinks they are bad for his eyes. {2}, he now plays for only one hour a day. At weekends he can go out with friends {3} stay at home with his brother. He must finish his chores first, {4} he cannot go out. Now he plays football in the afternoon {5} he feels much healthier."}, {"id": "d21-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["collecting", "are collecting", "collects", "is collecting"], "a": 3, "u": 1, "hint": "my hobby is + V-ing: chọn is collecting."}, {"o": ["so", "where", "when", "but"], "a": 2, "u": 1, "hint": "Liên từ chỉ thời gian: khi tôi mười tuổi, when."}, {"o": ["looks", "looked", "look", "looking"], "a": 2, "u": 1, "hint": "now, every evening: hiện tại đơn, chủ ngữ I, dạng look."}, {"o": ["collect", "collecting", "collects", "collected"], "a": 1, "u": 1, "hint": "like + V-ing."}, {"o": ["interested", "interest", "interestingly", "interesting"], "a": 3, "u": 1, "hint": "more + tính từ dài + than: interesting."}], "passage": "My name is Nam and my hobby {1} stamps. I started this hobby {2} I was ten years old. My uncle gave me an album of old stamps, and now I {3} at it every evening. I like {4} stamps from many countries. I think collecting is more {5} than watching TV.", "ptitle": "My Hobby: Collecting Stamps"}, {"id": "d21-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "My brother / adore / play / video games / free time.", "a": 0, "u": 1, "hint": "adore + V-ing; thêm in his free time.", "o": ["My brother adores playing video games in his free time.", "My brother adores play video games in his free time.", "My brother adore playing video games in his free time."], "c3": 1}, {"s": "Nam / not mind / do / washing-up / after dinner.", "a": 0, "u": 1, "hint": "doesn't mind + V-ing; thêm the washing-up.", "o": ["Nam doesn't mind doing the washing-up after dinner.", "Nam doesn't minds doing the washing-up after dinner.", "Nam doesn't mind do the washing-up after dinner."], "c3": 1}, {"s": "Hoa / sing / more beautifully / her sister.", "a": 0, "u": 2, "hint": "So sánh hơn của trạng từ dài: more beautifully than.", "o": ["Hoa sings more beautifully than her sister.", "Hoa sings more beautiful than her sister.", "Hoa sing more beautifully than her sister."], "c3": 1}, {"s": "I / want / go swimming / but / it / be / too cold.", "a": 0, "u": 3, "hint": "want + to V; nối hai vế bằng but; it is too cold.", "o": ["I w
