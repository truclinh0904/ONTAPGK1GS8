ant to go swimming, but it is too cold.", "I want to going swimming, but it is too cold.", "I want to go swimming, but it are too cold."], "c3": 1}, {"s": "If / you / join / club / you / make / new friends.", "a": 0, "u": 3, "hint": "Câu điều kiện loại 1: If + hiện tại đơn, will + V.", "o": ["If you join the club, you will make new friends.", "If you join the club, you will makes new friends.", "If you will join the club, you will make new friends."], "c3": 1}]}, {"id": "d21-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Nga spends two hours practising the violin every Sunday.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing đổi qua lại với It takes + người + thời gian + to V.", "o": ["It takes Nga two hours to practise the violin every Sunday.", "It takes Nga two hours to practising the violin every Sunday.", "It takes Nga two hours to practise violin every Sunday."], "c3": 1}, {"s": "It is fun to play board games with friends.", "a": 0, "u": 1, "hint": "Đưa V-ing lên làm chủ ngữ: It is + tính từ + to V thành V-ing + is + tính từ.", "o": ["Playing board games with friends is fun.", "Playing board games with friends are fun.", "Playing board games with friends fun."], "c3": 1}, {"s": "It was cold, but we went camping.", "a": 0, "u": 3, "hint": "although đổi qua lại với but: Although A, B thành A, but B.", "o": ["Although it was cold, we went camping.", "Although it were cold, we went camping.", "Despite it was cold, we went camping."], "c3": 1}, {"s": "The road was flooded. We could not go to school. (Therefore)", "a": 0, "u": 3, "hint": "Nối hai ý bằng However, Therefore hoặc or else.", "o": ["The road was flooded. Therefore, we could not go to school.", "The road were flooded. Therefore, we could not go to school.", "The road was flooded. However, we could not go to school."], "c3": 1}, {"s": "Minh likes cycling more than jogging.", "a": 0, "u": 1, "hint": "prefer + V-ing to + V-ing đổi qua lại với like + V-ing more than; hate, love đi với V-ing hoặc to V.", "o": ["Minh prefers cycling to jogging.", "Minh prefers cycle to jogging.", "Minh prefer cycling to jogging."], "c3": 1}]}]}, {"id": "d22", "no": 22, "title": "Đề số 22", "acts": [{"id": "d22-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["pr<u>o</u>ve", "sp<u>oo</u>n", "n<u>oo</u>n", "l<u>oo</u>k"], "a": 3, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o</u>man", "t<u>oo</u>l", "c<u>oo</u>k", "w<u>oo</u>l"], "a": 1, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["freed<u>o</u>m", "c<u>o</u>mpare", "<u>a</u>partment", "cour<u>age</u>"], "a": 3, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>a</u>partment", "cott<u>age</u>", "cour<u>age</u>", "<u>be</u>come"], "a": 0, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oy</u>", "j<u>oy</u>", "p<u>oi</u>nt", "t<u>ou</u>rist"], "a": 3, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ɔɪ/, một từ đọc /ʊə/. Chọn từ đọc /ʊə/."}]}, {"id": "d22-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Mr Binh doesn't mind ___ up early to feed the cows.", "o": ["got", "get", "getting", "to get"], "a": 2, "u": 1, "hint": "Sau doesn't mind dùng V-ing."}, {"s": "The children in the village sleep ___ than those in the city.", "o": ["more peaceful", "more peacefully", "most peacefully", "peacefully"], "a": 1, "u": 2, "hint": "Có than: more + trạng từ dài (peacefully)."}, {"s": "The harvest was good, ___ the farmers were very happy.", "o": ["but", "or", "however", "so"], "a": 3, "u": 3, "hint": "Mùa gặt tốt nên nông dân vui: liên từ chỉ kết quả."}, {"s": "We must finish the work before dark, ___ we will have to work at night.", "o": ["or else", "so", "and", "but"], "a": 0, "u": 3, "hint": "Nếu không làm kịp thì phải làm ban đêm: or else."}, {"s": "A boy is ___ the buffaloes along the river bank.", "o": ["skating", "knitting", "surfing", "herding"], "a": 3, "u": 2, "hint": "Đang chăn trâu: herd, dạng V-ing sau is."}, {"s": "Life in the countryside is ___ ; there is little traffic and few people.", "o": ["busy", "crowded", "noisy", "peaceful"], "a": 3, "u": 2, "hint": "Ít xe, ít người: yên bình, từ peaceful."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Villagers are very <u>friendly</u> to visitors.", "o": ["kind", "rude", "lazy", "shy"], "a": 0, "u": 2, "hint": "friendly (thân thiện) gần nghĩa với kind (tốt bụng)."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: The village is <u>far</u> from the town.", "o": ["high", "near", "long", "wide"], "a": 1, "u": 2, "hint": "far (xa) trái nghĩa với near (gần)."}, {"s": "– “What do you usually do in the village after school?” – “___”", "o": ["I went to the cinema yesterday.", "Yes, I do.", "It takes me ten minutes.", "I help my parents feed the chickens."], "a": 3, "u": 2, "hint": "Hỏi việc thường làm sau giờ học: trả lời bằng hiện tại đơn, I help ..."}, {"s": "Find the mistake: My uncle <u>works</u> <u>more hard</u> than <u>other</u> farmers in <u>our</u> village.", "o": ["works", "more hard", "other", "our"], "a": 1, "u": 2, "hint": "hard là trạng từ ngắn, so sánh hơn thêm -er, nên lỗi ở more hard."}]}, {"id": "d22-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "It takes Hung ten minutes (cycle) ___ to the village market.", "a": 0, "u": 1, "hint": "It takes + người + thời gian + to V.", "o": ["to cycle", "cycling", "cycle"], "c3": 1}, {"s": "If it (rain) ___ tomorrow, we will stay at home.", "a": 0, "u": 3, "hint": "Mệnh đề If của câu điều kiện loại 1 dùng hiện tại đơn (ngôi thứ ba thêm -s).", "o": ["rains", "rain", "raining"], "c3": 1}, {"s": "Listen! Someone (play) ___ the guitar in the next room.", "a": 0, "u": 1, "hint": "Có Look!, Listen! hoặc now, at the moment: hiện tại tiếp diễn am/is/are + V-ing.", "o": ["is playing", "plays", "played"], "c3": 1}, {"s": "My brother detests (wait) ___ for the bus in the rain.", "a": 0, "u": 1, "hint": "Sau adore, fancy, detest, dislike, don't mind, keen on dùng V-ing.", "o": ["waiting", "wait", "waits"], "c3": 1}, {"s": "Minh (not go) ___ out yesterday because he had a cold.", "a": 0, "u": 2, "hint": "Phủ định quá khứ đơn: did not + động từ nguyên mẫu.", "o": ["did not go", "did not went", "does not go"], "c3": 1}]}, {"id": "d22-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "My handwriting is ___ than it was last year. (WELL)", "a": 0, "u": 2, "hint": "So sánh hơn: tính từ/trạng từ ngắn thêm -er, riêng good/well thành better, bad/badly thành worse.", "o": ["better", "best", "more well"], "c3": 1}, {"s": "My uncle is a stamp ___ ; he has over 2,000 stamps. (COLLECT)", "a": 0, "u": 1, "hint": "Cần danh từ chỉ người: từ gốc + -er/-or.", "o": ["collector", "collection", "collecting"], "c3": 1}, {"s": "I am very ___ in learning traditional crafts. (INTEREST)", "a": 0, "u": 1, "hint": "Tính từ đuôi -ed chỉ cảm xúc của người; đuôi -ing mô tả sự vật, sự việc. Ở đây cần dạng -ed.", "o": ["interested", "interesting", "interestingly"], "c3": 1}, {"s": "Mai writes ___ than her brother. (CAREFUL)", "a": 0, "u": 2, "hint": "So sánh hơn của trạng từ dài: more + trạng từ.", "o": ["more carefully", "more careful", "most carefully"], "c3": 1}, {"s": "Our ___ of a good harvest is very high this year. (EXPECT)", "a": 0, "u": 2, "hint": "Cần danh từ: đuôi -tion hoặc -ment.", "o": ["expectation", "expected", "expecting"], "c3": 1}]}, {"id": "d22-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Rice grows in the ___ field during the rainy season.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, paddy field là cánh đồng lúa.", "o": ["paddy", "herd", "countryside"], "c3": 1}, {"s": "The ___ helps the farmer plough the field.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là con trâu.", "o": ["buffalo", "harvest", "countryside"], "c3": 1}, {"s": "In autumn, the farmers ___ the rice and dry it in the sun.", "a": 0, "u": 2, "hint": "Từ cần điền: động từ, nghĩa là thu hoạch.", "o": ["harvest", "herd", "countryside"], "c3": 1}, {"s": "A young boy is helping his grandfather ___ the cows.", "a": 0, "u": 2, "hint": "Từ cần điền: động từ, nghĩa là chăn (gia súc).", "o": ["herd", "harvest", "buffalo"], "c3": 1}, {"s": "I love the fresh air in the ___ .", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là miền quê.", "o": ["countryside", "herd", "buffalo"], "c3": 1}], "box": ["herd", "buffalo", "harvest", "countryside", "paddy"]}, {"id": "d22-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 2, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "or else", "However"], "c3": 1}, {"a": 0, "u": 2, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "or else", "However"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai câu đối lập, đứng đầu câu có dấu phẩy: dùng However.", "o": ["However", "or else", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: nếu không thì (hậu quả xấu): dùng or else.", "o": ["or else", "However", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "or else", "so"], "c3": 1}], "box": ["or else", "However", "so", "and", "but"], "passage": "Mr Hung lives in a village {1} works on a small farm. He is a hard-working farmer, {2} everyone respects him. The work is hard. {3}, he loves it. He must sow the seeds in time, {4} there will be no rice in autumn. His farm is small, {5} it gives his family enough food."}, {"id": "d22-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["get", "gets", "will get", "getting"], "a": 1, "u": 2, "hint": "She + hiện tại đơn, ngôi thứ ba: thêm -s."}, {"o": ["to herd", "herding", "herd", "herds"], "a": 3, "u": 2, "hint": "often + hiện tại đơn ngôi thứ ba: herds."}, {"o": ["most peaceful", "peacefuller", "peaceful", "more peaceful"], "a": 3, "u": 2, "hint": "more + tính từ dài + than: more peaceful."}, {"o": ["swam", "swimming", "to swim", "swim"], "a": 1, "u": 1, "hint": "enjoy + V-ing."}, {"o": ["If", "So", "But", "And"], "a": 0, "u": 3, "hint": "Câu điều kiện loại 1: If + hiện tại đơn."}], "passage": "Mai lives in a small village. Every morning she {1} up at six and helps her mother cook breakfast. After school, she often {2} buffaloes with her brother. Life in the village is {3} than life in the city, so she feels relaxed. She also enjoys {4} in the river on hot days. {5} the weather is bad, she stays at home and reads books.", "ptitle": "Life in a Village"}, {"id": "d22-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Farmers / get up / early / and / feed / animals / before breakfast.", "a": 0, "u": 2, "hint": "Hiện tại đơn, nối bằng and, thêm the animals.", "o": ["Farmers get up early and feed the animals before breakfast.", "Farmers get up early or feed the animals before breakfast.", "Farmers get up early and feed animals before breakfast."], "c3": 1}, {"s": "Life / village / be / more peaceful / than / life / city.", "a": 0, "u": 2, "hint": "more peaceful than; thêm in the.", "o": ["Life in the village is more peaceful than life in the city.", "Life in the village are more peaceful than life in the city.", "Life on the village is more peaceful than life in the city."], "c3": 1}, {"s": "Lan / spend / one hour / herd / buffaloes / every afternoon.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing.", "o": ["Lan spends one hour herding buffaloes every afternoon.", "Lan spends one hour to herd buffaloes every afternoon.", "Lan spend one hour herding buffaloes every afternoon."], "c3": 1}, {"s": "The harvest / be / good / so / villagers / be / happy.", "a": 0, "u": 3, "hint": "so nối kết quả; be chia is/are.", "o": ["The harvest is good, so the villagers are happy.", "The harvest are good, so the villagers are happy.", "The harvest is good, so the villagers is happy."], "c3": 1}, {"s": "We / had better / finish / work / now / or else / we / be / late.", "a": 0, "u": 3, "hint": "had better + V; or else + will + V.", "o": ["We had better finish the work now, or else we will be late.", "We had better finish the work now, or else we will is late.", "We had better finish work now, or else we will be late."], "c3": 1}]}, {"id": "d22-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Hoa doesn't run as fast as Mai.", "a": 0, "u": 2, "hint": "Đổi cấu trúc so sánh: not as ... as đổi qua lại với so sánh hơn của đối tượng còn lại.", "o": ["Mai runs faster than Hoa.", "Mai runs more faster than Hoa.", "Mai run faster than Hoa."], "c3": 1}, {"s": "Hung plays chess. His brother plays chess too.", "a": 0, "u": 3, "hint": "Gộp câu bằng both ... and, or, but hoặc so.", "o": ["Both Hung and his brother play chess.", "Both Hung or his brother play chess.", "Both Hung and his brother plays chess."], "c3": 1}, {"s": "My brother is crazy about playing chess.", "a": 0, "u": 1, "hint": "Đổi qua lại giữa adore, fancy + V-ing và be keen on, fond of, into, interested in.", "o": ["My brother adores playing chess.", "My brother adores play chess.", "My brother adore playing chess."], "c3": 1}, {"s": "Hoa is a faster swimmer than Linh.", "a": 0, "u": 2, "hint": "Danh từ chỉ người đổi qua lại với động từ + trạng từ so sánh hơn (a faster swimmer, swims faster).", "o": ["Hoa swims faster than Linh.", "Hoa swims more faster than Linh.", "Hoa swim faster than Linh."], "c3": 1}, {"s": "Lan was late because the bus broke down.", "a": 0, "u": 3, "hint": "because đổi qua lại với so: đổi vị trí hai vế.", "o": ["The bus broke down, so Lan was late.", "The bus broke down, so Lan were late.", "The bus broke down, because Lan was late."], "c3": 1}]}]}, {"id": "d23", "no": 23, "title": "Đề số 23", "acts": [{"id": "d23-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>o</u>ve", "l<u>o</u>se", "sh<u>ou</u>ld", "s<u>oo</u>n"], "a": 2, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sh<u>ou</u>ld", "j<u>ui</u>ce", "c<u>oo</u>k", "f<u>oo</u>t"], "a": 1, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>a</u>nana", "<u>pre</u>dict", "answ<u>e</u>r", "op<u>e</u>n"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["cott<u>age</u>", "<u>be</u>have", "cour<u>age</u>", "gener<u>ou</u>s"], "a": 3, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou</u>rist", "m<u>oo</u>r", "j<u>oy</u>", "p<u>oo</u>r"], "a": 2, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ʊə/, một từ đọc /ɔɪ/. Chọn từ đọc /ɔɪ/."}]}, {"id": "d23-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Many teenagers fancy ___ social networks in their free time.", "o": ["using", "to use", "use", "used"], "a": 0, "u": 1, "hint": "Sau fancy dùng V-ing."}, {"s": "My sister dances ___ than me, so she is in the school team.", "o": ["best", "gooder", "better", "more good"], "a": 2, "u": 2, "hint": "Dance well: so sánh hơn bất quy tắc better."}, {"s": "Minh likes online games. ___ , he never forgets his homework.", "o": ["So", "And", "Or", "However"], "a": 3, "u": 3, "hint": "Hai câu đối lập, đứng đầu câu có dấu phẩy: However."}, {"s": "You had better ___ your video game now, or else you will be late.", "o": ["to stop", "stopping", "stopped", "stop"], "a": 3, "u": 3, "hint": "had better + động từ nguyên mẫu."}, {"s": "Instead of staying at home, teenagers like to ___ out with friends at weekends.", "o": ["hang", "give", "carry", "bring"], "a": 0, "u": 1, "hint": "hang out = đi chơi với bạn."}, {"s": "Stamp collecting is a quiet ___ that many people enjoy.", "o": ["hobby", "holiday", "homework", "habit"], "a": 0, "u": 1, "hint": "Sở thích là hobby."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: My brother is <u>crazy about</u> online games.", "o": ["bad at", "tired of", "very keen on", "afraid of"], "a": 2, "u": 1, "hint": "crazy about = very keen on."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: Lan's room is always <u>tidy</u>.", "o": ["messy", "clean", "large", "neat"], "a": 0, "u": 1, "hint": "tidy (gọn gàng) trái nghĩa với messy (bừa bộn)."}, {"s": "– “How about going to the cinema this evening?” – “___”", "o": ["Yes, I'm going.", "No, I didn't.", "Great idea! Let's go.", "I like it very much."], "a": 2, "u": 1, "hint": "Lời rủ How about ...?: đồng ý bằng Great idea!"}, {"s": "Find the mistake: She <u>prefers</u> <u>listen</u> to music <u>to</u> <u>watching</u> TV.", "o": ["prefers", "listen", "to", "watching"], "a": 1, "u": 1, "hint": "prefer + V-ing (to + V-ing), nên lỗi ở dạng động từ sau prefers."}]}, {"id": "d23-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "The farmer's wife (feed) ___ the chickens before breakfast.", "a": 0, "u": 2, "hint": "Hiện tại đơn, chủ ngữ ngôi thứ ba số ít: thêm -s/-es (đổi y thành ies nếu trước y là phụ âm).", "o": ["feeds", "feed", "feeding"], "c3": 1}, {"s": "Don't worry. I (help) ___ you with the project tomorrow.", "a": 0, "u": 3, "hint": "Dự đoán, lời hứa về tương lai: will + động từ nguyên mẫu.", "o": ["will help", "helps", "helped"], "c3": 1}, {"s": "We (not go) ___ to school on Sundays.", "a": 0, "u": 1, "hint": "Phủ định hiện tại đơn: do/does not + động từ nguyên mẫu.", "o": ["do not go", "does not go", "do not goes"], "c3": 1}, {"s": "How about (go) ___ fishing this Saturday?", "a": 0, "u": 2, "hint": "How about + V-ing.", "o": ["going", "go", "goes"], "c3": 1}, {"s": "Yesterday afternoon, Hung (take) ___ the cows to the meadow.", "a": 0, "u": 2, "hint": "Có last, yesterday hoặc ago: quá khứ đơn, thêm -ed hoặc dùng dạng bất quy tắc.", "o": ["took", "take", "takes"], "c3": 1}]}, {"id": "d23-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Swimming is good for you; it keeps you ___ . (HEALTH)", "a": 0, "u": 1, "hint": "Cần tính từ: thêm -ful hoặc -y vào từ gốc (peace thành peaceful).", "o": ["healthy", "healthily", "unhealthiness"], "c3": 1}, {"s": "The old man walked ___ along the village path. (CAREFUL)", "a": 0, "u": 2, "hint": "Cần trạng từ cách thức: tính từ + -ly.", "o": ["carefully", "careful", "carefulness"], "c3": 1}, {"s": "Thanks to the villagers' ___ , the festival was a success. (GENEROUS)", "a": 0, "u": 2, "hint": "Cần danh từ trừu tượng: đuôi -ce, -ity, -th hoặc -ship.", "o": ["generosity", "generously", "generousness"], "c3": 1}, {"s": "Many teenagers ___ doing the washing-up. (LIKE)", "a": 0, "u": 1, "hint": "Thêm tiền tố phủ định dis- vào từ gốc (hoặc từ trái nghĩa).", "o": ["dislike", "unlike", "likely"], "c3": 1}, {"s": "The buffalo walked ___ across the field. (LAZY)", "a": 0, "u": 2, "hint": "Cần trạng từ: tính từ + -ly (y đổi thành -ily).", "o": ["lazily", "lazy", "laziness"], "c3": 1}]}, {"id": "d23-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Linh is ___ of cooking and makes dinner every Sunday.", "a": 0, "u": 1, "hint": "Từ cần điền: cụm be fond of (rất thích), giới từ of đứng sau.", "o": ["fond", "into", "interested"], "c3": 1}, {"s": "My brother is ___ about football and watches every match.", "a": 0, "u": 1, "hint": "Từ cần điền: cụm be crazy about (mê), giới từ about đứng sau.", "o": ["crazy", "into", "fond"], "c3": 1}, {"s": "Are you ___ in joining the photography club?", "a": 0, "u": 1, "hint": "Từ cần điền: cụm be interested in (quan tâm), giới từ in đứng sau.", "o": ["interested", "into", "keen"], "c3": 1}, {"s": "Nam isn't ___ on camping; he prefers staying at home.", "a": 0, "u": 1, "hint": "Từ cần điền: cụm be keen on (thích), giới từ on đứng sau.", "o": ["keen", "into", "crazy"], "c3": 1}, {"s": "Many teenagers are ___ social networks these days.", "a": 0, "u": 1, "hint": "Từ cần điền: cụm be into + danh từ (mê).", "o": ["into", "keen", "interested"], "c3": 1}], "box": ["crazy", "fond", "interested", "into", "keen"]}, {"id": "d23-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "or", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "or", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: câu sau là kết quả của câu trước, đứng đầu câu có dấu phẩy: dùng Therefore.", "o": ["Therefore", "but", "and"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: đưa ra lựa chọn: dùng or.", "o": ["or", "but", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "but", "or"], "c3": 1}], "box": ["but", "and", "or", "Therefore", "so"], "passage": "Nga is a student {1} she is also a good singer. She likes pop music, {2} her parents prefer folk songs. Nga practises every evening. {3}, she sings better than before. She can join a club {4} practise at home. She often feels tired after practice, {5} she goes to bed early."}, {"id": "d23-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["to", "at", "on", "in"], "a": 2, "u": 1, "hint": "spend time on the Internet: giới từ on."}, {"o": ["to play", "play", "playing", "plays"], "a": 1, "u": 1, "hint": "Some of them + động từ nguyên mẫu (số nhiều): play."}, {"o": ["of", "on", "about", "at"], "a": 1, "u": 1, "hint": "Cụm keen on."}, {"o": ["because", "or", "however", "so"], "a": 2, "u": 3, "hint": "fun; however, ...: liên từ chỉ sự đối lập."}, {"o": ["to hang", "hang", "hanging", "hung"], "a": 1, "u": 1, "hint": "had better + động từ nguyên mẫu: hang."}], "passage": "Today, many teenagers spend a lot of time {1} the Internet. Some of them {2} games online every evening. Others are keen {3} making videos. Of course, using the Internet is fun; {4}, teenagers should not forget real life. They had better {5} out with friends or play sports.", "ptitle": "Teenagers and Free Time"}, {"id": "d23-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Many teenagers / be / crazy / social networks.", "a": 0, "u": 1, "hint": "be crazy about + danh từ.", "o": ["Many teenagers are crazy about social networks.", "Many teenagers is crazy about social networks.", "Many teenagers are crazy of social networks."], "c3": 1}, {"s": "My sister / dance / well / than / me.", "a": 0, "u": 2, "hint": "So sánh hơn bất quy tắc: better than.", "o": ["My sister dances better than me.", "My sister dances more better than me.", "My sister dance better than me."], "c3": 1}, {"s": "Tuan / fancy / surf / Net / free time.", "a": 0, "u": 1, "hint": "fancy + V-ing; surf the Net; thêm in his free time.", "o": ["Tuan fancies surfing the Net in his free time.", "Tuan fancy surfing the Net in his free time.", "Tuan fancies surfing the Net on his free time."], "c3": 1}, {"s": "She / be / tired / however / she / finish / her homework / first.", "a": 0, "u": 3, "hint": "However đứng đầu câu có dấu phẩy; finishes (ngôi thứ ba).", "o": ["She is tired. However, she finishes her homework first.", "She are tired. However, she finishes her homework first.", "She tired. However, she finishes her homework first."], "c3": 1}, {"s": "How about / go / cinema / this evening?", "a": 0, "u": 2, "hint": "How about + V-ing; thêm to the.", "o": ["How about going to the cinema this evening?", "How of going to the cinema this evening?", "How about going to cinema this evening?"], "c3": 1}]}, {"id": "d23-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes the farmers a week to harvest the rice.", "a": 0, "u": 2, "hint": "spend + thời gian + V-ing đổi qua lại với It takes + người + thời gian + to V.", "o": ["The farmers spend a week harvesting the rice.", "The farmers spend a week to harvest the rice.", "The farmers spend a week harvesting rice."], "c3": 1}, {"s": "It is healthy to do morning exercise.", "a": 0, "u": 1, "hint": "Đưa V-ing lên làm chủ ngữ: It is + tính từ + to V thành V-ing + is + tính từ.", "o": ["Doing morning exercise is healthy.", "Doing morning exercise are healthy.", "Doing morning exercise healthy."], "c3": 1}, {"s": "Although Hoa was tired, she finished her project.", "a": 0, "u": 3, "hint": "although đổi qua lại với but: Although A, B thành A, but B.", "o": ["Hoa was tired, but she finished her project.", "Hoa were tired, but she finished her project.", "Hoa was tired, so she finished her project."], "c3": 1}, {"s": "You must do your homework, or you cannot play games.", "a": 0, "u": 3, "hint": "Nối hai ý bằng However, Therefore hoặc or else.", "o": ["You must do your homework, or else you cannot play games.", "You must to do your homework, or else you cannot play games.", "You must doing your homework, or else you cannot play games."], "c3": 1}, {"s": "I like reading comics more than watching TV.", "a": 0, "u": 1, "hint": "prefer + V-ing to + V-ing đổi qua lại với like + V-ing more than; hate, love đi với V-ing hoặc to V.", "o": ["I prefer reading comics to watching TV.", "I prefer reading comics than watching TV.", "I prefer reading comics watching TV."], "c3": 1}]}]}, {"id": "d24", "no": 24, "title": "Đề số 24", "acts": [{"id": "d24-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sh<u>ou</u>ld", "l<u>o</u>se", "bl<u>ue</u>", "f<u>oo</u>d"], "a": 0, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o</u>lf", "w<u>o</u>man", "t<u>oo</u>th", "w<u>oo</u>l"], "a": 2, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["hands<u>o</u>me", "sil<u>e</u>nt", "fam<u>ou</u>s", "b<u>i</u>t"], "a": 3, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>o</u>ntrol", "b<u>ui</u>ld", "cott<u>age</u>", "short<u>age</u>"], "a": 0, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oi</u>l", "m<u>oo</u>r", "c<u>oi</u>n", "p<u>oi</u>nt"], "a": 1, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ɔɪ/, một từ đọc /ʊə/. Chọn từ đọc /ʊə/."}]}, {"id": "d24-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "My brother detests ___ the housework on Sundays.", "o": ["to do", "do", "does", "doing"], "a": 3, "u": 1, "hint": "Sau detest dùng V-ing."}, {"s": "Mai checked her test ___ than before.", "o": ["more careful", "carefully", "carefuller", "more carefully"], "a": 3, "u": 2, "hint": "Có than: more + trạng từ dài (carefully)."}, {"s": "I like pottery, ___ my sister prefers painting.", "o": ["therefore", "or", "so", "but"], "a": 3, "u": 3, "hint": "Hai ý đối lập (em thích gốm / chị thích vẽ): but."}, {"s": "The festival is very popular, ___ many tourists visit the village every year.", "o": ["else", "but", "or", "so"], "a": 3, "u": 3, "hint": "Kết quả: lễ hội nổi tiếng nên nhiều du khách đến: so."}, {"s": "Weaving is a traditional ___ in my village.", "o": ["crab", "craft", "crop", "crowd"], "a": 1, "u": 2, "hint": "Nghề thủ công truyền thống: craft."}, {"s": "Our village has a ___ every year, and people sing and dance in the yard.", "o": ["festival", "factory", "forest", "fashion"], "a": 0, "u": 2, "hint": "Hát múa trong sân hằng năm: festival (lễ hội)."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Farmers feel <u>pleased</u> with the harvest.", "o": ["happy", "angry", "tired", "worried"], "a": 0, "u": 2, "hint": "pleased (vui lòng) gần nghĩa với happy."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: Life in my village is <u>slow</u>.", "o": ["fast", "easy", "quiet", "old"], "a": 0, "u": 2, "hint": "slow (chậm) trái nghĩa với fast (nhanh)."}, {"s": "– “Which do you prefer, painting or knitting?” – “___”", "o": ["I'm fine, thanks.", "Yes, I do.", "I prefer painting.", "I painted last night."], "a": 2, "u": 1, "hint": "Hỏi chọn một trong hai: trả lời I prefer ..."}, {"s": "Find the mistake: Although it <u>was</u> raining, <u>but</u> the farmers <u>still</u> worked <u>in</u> the field.", "o": ["was", "but", "still", "in"], "a": 1, "u": 3, "hint": "Although không đi cùng but trong một câu, nên lỗi ở từ but."}]}, {"id": "d24-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "It took my aunt two hours (knit) ___ this scarf.", "a": 0, "u": 1, "hint": "It takes + người + thời gian + to V.", "o": ["to knit", "knitting", "knit"], "c3": 1}, {"s": "If you (practise) ___ every day, you will play better.", "a": 0, "u": 3, "hint": "Mệnh đề If của câu điều kiện loại 1 dùng hiện tại đơn (ngôi thứ ba thêm -s).", "o": ["practise", "will practise", "practised"], "c3": 1}, {"s": "The villagers (harvest) ___ rice in the paddy field now.", "a": 0, "u": 2, "hint": "Có Look!, Listen! hoặc now, at the moment: hiện tại tiếp diễn am/is/are + V-ing.", "o": ["are harvesting", "harvest", "harvested"], "c3": 1}, {"s": "Do you fancy (go) ___ to the cinema tonight?", "a": 0, "u": 1, "hint": "Sau adore, fancy, detest, dislike, don't mind, keen on dùng V-ing.", "o": ["going", "go", "goes"], "c3": 1}, {"s": "They (not play) ___ football last Sunday because it rained.", "a": 0, "u": 1, "hint": "Phủ định quá khứ đơn: did not + động từ nguyên mẫu.", "o": ["did not play", "did not played", "does not play"], "c3": 1}]}, {"id": "d24-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Lan sings ___ than Hoa, so she did not win. (BADLY)", "a": 0, "u": 2, "hint": "So sánh hơn: tính từ/trạng từ ngắn thêm -er, riêng good/well thành better, bad/badly thành worse.", "o": ["worse", "worst", "badder"], "c3": 1}, {"s": "Two ___ in our team are absent today. (PLAY)", "a": 0, "u": 1, "hint": "Cần danh từ chỉ người: từ gốc + -er/-or, thêm -s nếu số nhiều.", "o": ["players", "playful", "playing"], "c3": 1}, {"s": "The football match was so ___ that nobody left early. (EXCITE)", "a": 0, "u": 1, "hint": "Tính từ đuôi -ed chỉ cảm xúc của người; đuôi -ing mô tả sự vật, sự việc. Ở đây cần dạng -ing.", "o": ["exciting", "excited", "excitement"], "c3": 1}, {"s": "The teacher speaks ___ than the students. (FLUENT)", "a": 0, "u": 2, "hint": "So sánh hơn của trạng từ dài: more + trạng từ.", "o": ["more fluently", "more fluent", "most fluently"], "c3": 1}, {"s": "Life in the countryside has improved because of rapid ___ . (DEVELOP)", "a": 0, "u": 2, "hint": "Cần danh từ: đuôi -tion hoặc -ment.", "o": ["development", "developing", "developed"], "c3": 1}]}, {"id": "d24-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "The villagers ___ baskets from bamboo in their free time.", "a": 0, "u": 2, "hint": "Từ cần điền: động từ, nghĩa là đan, dệt.", "o": ["weave", "traditional", "craft"], "c3": 1}, {"s": "This village is famous for its beautiful ___ .", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là đồ gốm.", "o": ["pottery", "weave", "traditional"], "c3": 1}, {"s": "People dance and sing in the yard during the ___ .", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là lễ hội.", "o": ["festival", "weave", "traditional"], "c3": 1}, {"s": "Making paper flowers is a popular ___ .", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là nghề thủ công.", "o": ["craft", "traditional", "weave"], "c3": 1}, {"s": "We enjoy ___ food at the spring festival.", "a": 0, "u": 2, "hint": "Từ cần điền: tính từ, nghĩa là truyền thống.", "o": ["traditional", "weave", "pottery"], "c3": 1}], "box": ["traditional", "weave", "craft", "festival", "pottery"]}, {"id": "d24-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "so", "or else"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "However", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai câu đối lập, đứng đầu câu có dấu phẩy: dùng However.", "o": ["However", "and", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: nếu không thì (hậu quả xấu): dùng or else.", "o": ["or else", "However", "and"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "However", "or else"], "c3": 1}], "box": ["However", "and", "so", "or else", "but"], "passage": "Trang loves painting, {1} she is not good at maths. She draws pictures {2} gives them to her friends. {3}, she spends too little time on homework. She must finish it, {4} she will get bad marks. Her teacher is kind, {5} she helps Trang in every lesson."}, {"id": "d24-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["of", "at", "on", "for"], "a": 1, "u": 2, "hint": "Cụm good at."}, {"o": ["more careful", "carefully", "care", "careful"], "a": 1, "u": 2, "hint": "work very + trạng từ: carefully."}, {"o": ["best", "more good", "gooder", "better"], "a": 3, "u": 2, "hint": "so sánh hơn bất quy tắc: better than."}, {"o": ["to visit", "visiting", "visit", "visits"], "a": 2, "u": 2, "hint": "often + động từ nguyên mẫu (visitors số nhiều): visit."}, {"o": ["visiting", "visit", "will visit", "visited"], "a": 2, "u": 2, "hint": "Có tomorrow: will + động từ nguyên mẫu."}], "passage": "My grandmother's village is a famous craft village. Many people there are good {1} making pottery. They work very {2} to make beautiful vases and bowls. Pottery from this village is {3} than pottery from many other places. Visitors often {4} the workshops to see the potters. Tomorrow my class {5} the village.", "ptitle": "A Craft Village"}, {"id": "d24-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Villagers / make / pottery / and / sell / it / market.", "a": 0, "u": 2, "hint": "Hiện tại đơn, nối bằng and; sell it at the market.", "o": ["Villagers make pottery and sell it at the market.", "Villagers make pottery or sell it at the market.", "Villagers make pottery and sell it in the market."], "c3": 1}, {"s": "Mai / always / check / her test / more carefully / than / last time.", "a": 0, "u": 2, "hint": "always checks (ngôi thứ ba); more carefully than.", "o": ["Mai always checks her test more carefully than last time.", "Mai always checks her test more careful than last time.", "Mai always checks her test more carefully as last time."], "c3": 1}, {"s": "Although / it / rain / heavily / yesterday / farmers / still / work / field.", "a": 0, "u": 3, "hint": "Although + mệnh đề quá khứ, mệnh đề chính; không dùng but.", "o": ["Although it rained heavily yesterday, the farmers still worked in the field.", "Despite it rained heavily yesterday, the farmers still worked in the field.", "Although it rained heavily yesterday, the farmers still worked on the field."], "c3": 1}, {"s": "My grandmother / detest / use / smartphone.", "a": 0, "u": 1, "hint": "detest + V-ing; thêm a smartphone.", "o": ["My grandmother detests using a smartphone.", "My grandmother detests use a smartphone.", "My grandmother detests using smartphone."], "c3": 1}, {"s": "We / prefer / paint / to / knit.", "a": 0, "u": 1, "hint": "prefer + V-ing to + V-ing.", "o": ["We prefer painting to knitting.", "We prefer painting than knitting.", "We prefer painting knitting."], "c3": 1}]}, {"id": "d24-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "My bike isn't as new as yours.", "a": 0, "u": 2, "hint": "Đổi cấu trúc so sánh: not as ... as đổi qua lại với so sánh hơn của đối tượng còn lại.", "o": ["Your bike is newer than mine.", "Your bike are newer than mine.", "Your bike is more newer than mine."], "c3": 1}, {"s": "We can go to the park. We can stay at home.", "a": 0, "u": 3, "hint": "Gộp câu bằng both ... and, or, but hoặc so.", "o": ["We can go to the park or stay at home.", "We can to go to the park or stay at home.", "We can going to the park or stay at home."], "c3": 1}, {"s": "Lan dislikes washing the dishes.", "a": 0, "u": 1, "hint": "Đổi qua lại giữa adore, fancy + V-ing và be keen on, fond of, into, interested in.", "o": ["Lan isn't keen on washing the dishes.", "Lan isn't keen on wash the dishes.", "Lan isn't keen of washing the dishes."], "c3": 1}, {"s": "Tuan sings better than his brother.", "a": 0, "u": 2, "hint": "Danh từ chỉ người đổi qua lại với động từ + trạng từ so sánh hơn (a faster swimmer, swims faster).", "o": ["Tuan is a better singer than his brother.", "Tuan are a better singer than his brother.", "Tuan is a better more singer than his brother."], "c3": 1}, {"s": "It was hot, so we went swimming.", "a": 0, "u": 3, "hint": "because đổi qua lại với so: đổi vị trí hai vế.", "o": ["We went swimming because it was hot.", "We went swimming because it were hot.", "We went swimming so it was hot."], "c3": 1}]}]}, {"id": "d25", "no": 25, "title": "Đề số 25", "acts": [{"id": "d25-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo</u>l", "w<u>oo</u>l", "b<u>oo</u>t", "gr<u>ou</u>p"], "a": 1, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["bl<u>ue</u>", "w<u>o</u>man", "w<u>o</u>lf", "w<u>oo</u>d"], "a": 0, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>o</u>ntrol", "k<u>i</u>t", "op<u>e</u>n", "answ<u>e</u>r"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>ui</u>ld", "b<u>a</u>nana", "bagg<u>age</u>", "s<u>i</u>t"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo</u>r", "t<u>ou</u>r", "p<u>oo</u>r", "b<u>oy</u>"], "a": 3, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ʊə/, một từ đọc /ɔɪ/. Chọn từ đọc /ɔɪ/."}]}, {"id": "d25-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Lan adores ___ badminton with her father every morning.", "o": ["to play", "play", "played", "playing"], "a": 3, "u": 1, "hint": "Sau adore dùng V-ing."}, {"s": "Our team played ___ than the other team, so we won the match.", "o": ["gooder", "better", "best", "more good"], "a": 1, "u": 2, "hint": "Có than: so sánh hơn bất quy tắc của well là better."}, {"s": "We lost the match. ___ , we enjoyed it very much.", "o": ["And", "However", "Or", "So"], "a": 1, "u": 3, "hint": "Thua trận nhưng vẫn vui: However (đầu câu, có dấu phẩy)."}, {"s": "You should train harder, ___ you will not win the cup.", "o": ["or else", "so", "but", "and"], "a": 0, "u": 3, "hint": "Phải tập chăm hơn, nếu không sẽ thua: or else."}, {"s": "Mai is a ___ of the school swimming club.", "o": ["mountain", "market", "meeting", "member"], "a": 3, "u": 1, "hint": "member of the club = thành viên của câu lạc bộ."}, {"s": "The football ___ starts at three o'clock this afternoon.", "o": ["mat", "match", "mark", "mask"], "a": 1, "u": 1, "hint": "Trận bóng đá là match."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: Hung is <u>keen on</u> table tennis.", "o": ["bored with", "fond of", "afraid of", "worried about"], "a": 1, "u": 1, "hint": "keen on gần nghĩa với fond of."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: Minh is a <u>quick</u> runner.", "o": ["young", "tall", "fast", "slow"], "a": 3, "u": 2, "hint": "quick (nhanh) trái nghĩa với slow (chậm)."}, {"s": "– “Shall we play volleyball after school?” – “___”", "o": ["It's very good.", "No, we don't.", "Yes, let's.", "Yes, we are."], "a": 2, "u": 1, "hint": "Lời rủ Shall we ...?: đồng ý bằng Yes, let's."}, {"s": "Find the mistake: Tom <u>dislikes</u> <u>to get</u> up <u>early</u> on <u>Sundays</u>.", "o": ["dislikes", "to get", "early", "Sundays"], "a": 1, "u": 1, "hint": "Sau dislike dùng V-ing, nên lỗi ở to get."}]}, {"id": "d25-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Lan's brother (watch) ___ football on TV every Saturday evening.", "a": 0, "u": 1, "hint": "Hiện tại đơn, chủ ngữ ngôi thứ ba số ít: thêm -s/-es (đổi y thành ies nếu trước y là phụ âm).", "o": ["watches", "watch", "watching"], "c3": 1}, {"s": "Perhaps Nam (join) ___ the music club next month.", "a": 0, "u": 1, "hint": "Dự đoán, lời hứa về tương lai: will + động từ nguyên mẫu.", "o": ["will join", "joins", "joined"], "c3": 1}, {"s": "The twins (not spend) ___ much time on social networks.", "a": 0, "u": 1, "hint": "Phủ định hiện tại đơn: do/does not + động từ nguyên mẫu.", "o": ["do not spend", "does not spend", "do not spends"], "c3": 1}, {"s": "Why don't we (organise) ___ a picnic for the class?", "a": 0, "u": 2, "hint": "had better, should, Why don't we + động từ nguyên mẫu.", "o": ["organise", "to organise", "organising"], "c3": 1}, {"s": "My mother (make) ___ a beautiful scarf last winter.", "a": 0, "u": 1, "hint": "Có last, yesterday hoặc ago: quá khứ đơn, thêm -ed hoặc dùng dạng bất quy tắc.", "o": ["made", "make", "makes"], "c3": 1}]}, {"id": "d25-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "A smartphone is a ___ tool for learning. (USE)", "a": 0, "u": 1, "hint": "Cần tính từ: thêm -ful hoặc -y vào từ gốc (peace thành peaceful).", "o": ["useful", "useless", "usefully"], "c3": 1}, {"s": "The villagers live ___ in this quiet valley. (PEACEFUL)", "a": 0, "u": 2, "hint": "Cần trạng từ cách thức: tính từ + -ly.", "o": ["peacefully", "peaceful", "peace"], "c3": 1}, {"s": "Painting needs a lot of ___ . (CREATE)", "a": 0, "u": 1, "hint": "Cần danh từ trừu tượng: đuôi -ce, -ity, -th hoặc -ship.", "o": ["creativity", "creative", "creatively"], "c3": 1}, {"s": "He was ___ to join the trip because of his sore leg. (ABLE)", "a": 0, "u": 3, "hint": "Thêm tiền tố phủ định un- vào từ gốc (hoặc từ trái nghĩa).", "o": ["unable", "disable", "ability"], "c3": 1}, {"s": "It rained ___ all night, so the roads were flooded. (HEAVY)", "a": 0, "u": 3, "hint": "Cần trạng từ: tính từ + -ly (y đổi thành -ily).", "o": ["heavily", "heavy", "heaviness"], "c3": 1}]}, {"id": "d25-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Our school football ___ is the best in the district.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là đội.", "o": ["team", "practise", "win"], "c3": 1}, {"s": "They ___ shooting every afternoon to get better.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là luyện tập.", "o": ["practise", "match", "team"], "c3": 1}, {"s": "He played well and was able to ___ three goals.", "a": 0, "u": 1, "hint": "Từ cần điền: động từ, nghĩa là ghi (bàn thắng).", "o": ["score", "match", "team"], "c3": 1}, {"s": "Our class will play a ___ against Class 8B on Friday.", "a": 0, "u": 1, "hint": "Từ cần điền: danh từ, nghĩa là trận đấu.", "o": ["match", "score", "practise"], "c3": 1}, {"s": "If we play well, we will ___ the cup.", "a": 0, "u": 3, "hint": "Từ cần điền: động từ, nghĩa là giành chiến thắng.", "o": ["win", "match", "team"], "c3": 1}], "box": ["team", "match", "win", "score", "practise"]}, {"id": "d25-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "so", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: đưa ra lựa chọn: dùng or.", "o": ["or", "so", "but"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "but", "or else"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "so", "or else"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: nếu không thì (hậu quả xấu): dùng or else.", "o": ["or else", "so", "but"], "c3": 1}], "box": ["so", "but", "or else", "or", "and"], "passage": "Our school has two sports clubs, football {1} badminton. You can join one {2} both. Nam likes both sports, {3} he joined both clubs. He plays well, {4} his team often loses. They must practise more, {5} they will not win the cup."}, {"id": "d25-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["held", "holds", "holding", "hold"], "a": 0, "u": 2, "hint": "Last Saturday: quá khứ đơn, held."}, {"o": ["take", "took", "takes", "taking"], "a": 1, "u": 2, "hint": "take part in: took part."}, {"o": ["more fast", "faster", "fast", "fastest"], "a": 1, "u": 2, "hint": "Trạng từ ngắn so sánh hơn: faster than."}, {"o": ["so", "because", "or", "but"], "a": 3, "u": 3, "hint": "Thua cuộc nhưng vui (đối lập): but."}, {"o": ["will have", "having", "had", "have"], "a": 2, "u": 2, "hint": "After that: quá khứ đơn, had."}], "passage": "Last Saturday, our school {1} a sports day. Many students {2} part in football, badminton and running. I ran {3} than my friend Nam, so I won the race. He lost the race, {4} he was happy for me. After that, we {5} lunch together.", "ptitle": "Our School Sports Day"}, {"id": "d25-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "Our team / play / better / than / their team.", "a": 0, "u": 2, "hint": "So sánh hơn bất quy tắc: better than; plays.", "o": ["Our team plays better than their team.", "Our team plays more better than their team.", "Our team play better than their team."], "c3": 1}, {"s": "It / take / us / two hours / walk / to the stadium.", "a": 0, "u": 1, "hint": "It takes + người + thời gian + to V.", "o": ["It takes us two hours to walk to the stadium.", "It takes us two hours to walking to the stadium.", "It takes us two hours to walk to stadium."], "c3": 1}, {"s": "Nam / not mind / practise / badminton / every morning.", "a": 0, "u": 1, "hint": "doesn't mind + V-ing.", "o": ["Nam doesn't mind practising badminton every morning.", "Nam doesn't minds practising badminton every morning.", "Nam doesn't mind practise badminton every morning."], "c3": 1}, {"s": "We / lose / match / however / we / enjoy / it.", "a": 0, "u": 3, "hint": "However đứng đầu câu, quá khứ lost và enjoyed.", "o": ["We lost the match. However, we enjoyed it.", "We lost the match. Therefore, we enjoyed it.", "We lost the match. However, we enjoy it."], "c3": 1}, {"s": "If / the weather / be / fine / we / play / football / tomorrow.", "a": 0, "u": 3, "hint": "Câu điều kiện loại 1: If + hiện tại đơn, will + V.", "o": ["If the weather is fine, we will play football tomorrow.", "If the weather is fine, we will plays football tomorrow.", "If the weather are fine, we will play football tomorrow."], "c3": 1}]}, {"id": "d25-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Tom spent forty minutes making a paper plane yesterday.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing đổi qua lại với It takes + người + thời gian + to V.", "o": ["It took Tom forty minutes to make a paper plane yesterday.", "It took Tom forty minutes to making a paper plane yesterday.", "It took Tom forty minutes make a paper plane yesterday."], "c3": 1}, {"s": "It is not good to stay up late.", "a": 0, "u": 1, "hint": "Đưa V-ing lên làm chủ ngữ: It is + tính từ + to V thành V-ing + is + tính từ.", "o": ["Staying up late is not good.", "Staying up late are not good.", "Staying up late not good."], "c3": 1}, {"s": "Tom is good at football, but he doesn't join the team.", "a": 0, "u": 3, "hint": "although đổi qua lại với but: Although A, B thành A, but B.", "o": ["Although Tom is good at football, he doesn't join the team.", "Although Tom is good at football, he doesn't joins the team.", "Although Tom are good at football, he doesn't join the team."], "c3": 1}, {"s": "Nam was ill. He still came to the match. (However)", "a": 0, "u": 3, "hint": "Nối hai ý bằng However, Therefore hoặc or else.", "o": ["Nam was ill. However, he still came to the match.", "Nam were ill. However, he still came to the match.", "Nam was ill. However, he still came to match."], "c3": 1}, {"s": "Mai loves to sing in the school choir.", "a": 0, "u": 1, "hint": "prefer + V-ing to + V-ing đổi qua lại với like + V-ing more than; hate, love đi với V-ing hoặc to V.", "o": ["Mai loves singing in the school choir.", "Mai loves sing in the school choir.", "Mai love singing in the school choir."], "c3": 1}]}]}, {"id": "d26", "no": 26, "title": "Đề số 26", "acts": [{"id": "d26-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o</u>lf", "bl<u>ue</u>", "f<u>oo</u>d", "sch<u>oo</u>l"], "a": 0, "u": 1, "hint": "Ba từ có phần gạch chân đọc /uː/, một từ đọc /ʊ/. Chọn từ đọc /ʊ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>ou</u>ld", "w<u>o</u>man", "z<u>oo</u>", "p<u>u</u>ll"], "a": 2, "u": 1, "hint": "Ba từ có phần gạch chân đọc /ʊ/, một từ đọc /uː/. Chọn từ đọc /uː/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["bal<u>a</u>nce", "s<u>u</u>rprise", "<u>de</u>cide", "gener<u>ou</u>s"], "a": 2, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ə/, một từ đọc /ɪ/. Chọn từ đọc /ɪ/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["vill<u>age</u>", "c<u>o</u>mpare", "sh<u>i</u>p", "b<u>ui</u>ld"], "a": 1, "u": 2, "hint": "Ba từ có phần gạch chân đọc /ɪ/, một từ đọc /ə/. Chọn từ đọc /ə/."}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>ou</u>rist", "b<u>oy</u>", "v<u>oi</u>ce", "<u>oi</u>l"], "a": 0, "u": 3, "hint": "Ba từ có phần gạch chân đọc /ɔɪ/, một từ đọc /ʊə/. Chọn từ đọc /ʊə/."}]}, {"id": "d26-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu. Câu điều kiện loại 1 (ôn lớp 6-7): If + hiện tại đơn, S + will + động từ nguyên mẫu.", "items": [{"s": "Hung doesn't mind ___ his father in the field at weekends.", "o": ["to help", "help", "helping", "helped"], "a": 2, "u": 2, "hint": "Sau doesn't mind dùng V-ing."}, {"s": "My brother works ___ than me on the farm.", "o": ["hardest", "more hard", "hardly", "harder"], "a": 3, "u": 2, "hint": "hard là trạng từ ngắn, so sánh hơn thêm -er."}, {"s": "The soil was dry, ___ the farmers watered the rice every day.", "o": ["however", "but", "or", "so"], "a": 3, "u": 3, "hint": "Đất khô nên tưới nước mỗi ngày: liên từ chỉ kết quả."}, {"s": "You had better wear a hat, ___ you will feel hot in the sun.", "o": ["or else", "and", "so", "but"], "a": 0, "u": 3, "hint": "Phải đội mũ, nếu không sẽ nóng: or else."}, {"s": "The farmers are ___ the rice in the field now.", "o": ["skating", "surfing", "knitting", "harvesting"], "a": 3, "u": 2, "hint": "Đang gặt lúa: hiện tại tiếp diễn are harvesting."}, {"s": "The air in the village is ___ and clean.", "o": ["flat", "fish", "free", "fresh"], "a": 3, "u": 2, "hint": "Không khí ở quê trong lành: fresh."}, {"s": "Choose the word or phrase CLOSEST in meaning to the underlined part: The farmers are <u>busy</u> in the field.", "o": ["very old", "not free", "not happy", "very tall"], "a": 1, "u": 2, "hint": "busy (bận) gần nghĩa với not free."}, {"s": "Choose the word or phrase OPPOSITE in meaning to the underlined part: The road to the village is <u>narrow</u>.", "o": ["small", "wide", "short", "long"], "a": 1, "u": 2, "hint": "narrow (hẹp) trái nghĩa với wide (rộng)."}, {"s": "– “What are the farmers doing?” – “___”", "o": ["They will plant last week.", "They planted yesterday.", "They are planting rice.", "Yes, they are."], "a": 2, "u": 2, "hint": "Hỏi nông dân đang làm gì: trả lời hiện tại tiếp diễn They are planting."}, {"s": "Find the mistake: Hoa <u>adores</u> <u>to read</u> <u>comic books</u> in her <u>free time</u>.", "o": ["adores", "to read", "comic books", "free time"], "a": 1, "u": 1, "hint": "Sau adore dùng V-ing, nên lỗi ở to read."}]}, {"id": "d26-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Choose the correct form of the verbs in brackets (A, B or C).", "type": "choice", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing. Có tomorrow, next week, next month (ôn lớp 6-7) thì dùng will + động từ nguyên mẫu.", "items": [{"s": "Lan spends an hour (practise) ___ the piano every evening.", "a": 0, "u": 1, "hint": "spend/spent + thời gian + V-ing.", "o": ["practising", "practise", "practises"], "c3": 1}, {"s": "Nam will join the club if he (have) ___ free time.", "a": 0, "u": 3, "hint": "Mệnh đề If của câu điều kiện loại 1 dùng hiện tại đơn (ngôi thứ ba thêm -s).", "o": ["has", "have", "having"], "c3": 1}, {"s": "At the moment, my parents (watch) ___ a cooking programme.", "a": 0, "u": 1, "hint": "Có Look!, Listen! hoặc now, at the moment: hiện tại tiếp diễn am/is/are + V-ing.", "o": ["are watching", "watch", "watched"], "c3": 1}, {"s": "Linh doesn't mind (help) ___ her mother with the housework.", "a": 0, "u": 1, "hint": "Sau adore, fancy, detest, dislike, don't mind, keen on dùng V-ing.", "o": ["helping", "help", "helps"], "c3": 1}, {"s": "My uncle (not come) ___ to the festival last year.", "a": 0, "u": 2, "hint": "Phủ định quá khứ đơn: did not + động từ nguyên mẫu.", "o": ["did not come", "did not came", "does not come"], "c3": 1}]}, {"id": "d26-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Choose the correct form of the word in capitals (A, B or C).", "type": "choice", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "We got up ___ than usual on Sunday. (LATE)", "a": 0, "u": 2, "hint": "So sánh hơn: tính từ/trạng từ ngắn thêm -er, riêng good/well thành better, bad/badly thành worse.", "o": ["later", "latest", "lately"], "c3": 1}, {"s": "The ___ in this village grow rice and corn. (FARM)", "a": 0, "u": 2, "hint": "Cần danh từ chỉ người: từ gốc + -er/-or, thêm -s nếu số nhiều.", "o": ["farmers", "farming", "farms"], "c3": 1}, {"s": "My mother was ___ when I came home late. (WORRY)", "a": 0, "u": 3, "hint": "Tính từ đuôi -ed chỉ cảm xúc của người; đuôi -ing mô tả sự vật, sự việc. Ở đây cần dạng -ed.", "o": ["worried", "worry", "worries"], "c3": 1}, {"s": "The bus travels ___ than the old cart. (QUICK)", "a": 0, "u": 2, "hint": "So sánh hơn của trạng từ dài: more + trạng từ.", "o": ["more quickly", "most quickly", "more quick"], "c3": 1}, {"s": "I can't watch the film because the Internet ___ is very slow. (CONNECT)", "a": 0, "u": 1, "hint": "Cần danh từ: đuôi -tion hoặc -ment.", "o": ["connection", "connected", "connecting"], "c3": 1}]}, {"id": "d26-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Choose the correct word from the box (A, B or C) to fill in each blank.", "type": "choice", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "My father gets up at five to ___ the pigs.", "a": 0, "u": 2, "hint": "Từ cần điền: động từ, nghĩa là cho ăn.", "o": ["feed", "crop", "field"], "c3": 1}, {"s": "The farmers ___ the soil before they sow the seeds.", "a": 0, "u": 2, "hint": "Từ cần điền: động từ, nghĩa là cày.", "o": ["plough", "crop", "village"], "c3": 1}, {"s": "Rice is the main ___ in my village.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là cây trồng.", "o": ["crop", "feed", "plough"], "c3": 1}, {"s": "A group of boys are playing football in the ___ .", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là cánh đồng, sân.", "o": ["field", "plough", "feed"], "c3": 1}, {"s": "Every house in the ___ has a small garden.", "a": 0, "u": 2, "hint": "Từ cần điền: danh từ, nghĩa là làng.", "o": ["village", "feed", "plough"], "c3": 1}], "box": ["crop", "feed", "field", "village", "plough"]}, {"id": "d26-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Choose the correct conjunction (A, B or C) for each blank in the passage.", "type": "pchoice", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": 0, "u": 2, "hint": "Quan hệ hai ý: hai ý bổ sung, cùng hướng: dùng and.", "o": ["and", "but", "or"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: câu sau là kết quả của câu trước, đứng đầu câu có dấu phẩy: dùng Therefore.", "o": ["Therefore", "but", "and"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: đưa ra lựa chọn: dùng or.", "o": ["or", "but", "so"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: hai ý đối lập: dùng but.", "o": ["but", "so", "or"], "c3": 1}, {"a": 0, "u": 3, "hint": "Quan hệ hai ý: ý sau là kết quả của ý trước: dùng so.", "o": ["so", "but", "or"], "c3": 1}], "box": ["but", "and", "or", "Therefore", "so"], "passage": "Farmers in my village get up early {1} work until noon. The sun is hot at noon. {2}, they rest under big trees. In the afternoon they can feed the pigs {3} water the vegetables. The work is tiring, {4} they are happy. They grow a lot of rice, {5} the village is rich."}, {"id": "d26-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["helped", "helping", "helps", "help"], "a": 2, "u": 2, "hint": "On Sundays + he: hiện tại đơn ngôi thứ ba, helps."}, {"o": ["harvest", "will harvest", "harvested", "are harvesting"], "a": 3, "u": 2, "hint": "At the moment: hiện tại tiếp diễn, are harvesting."}, {"o": ["working", "to work", "worked", "work"], "a": 0, "u": 1, "hint": "doesn't mind + V-ing: working."}, {"o": ["will rain", "is raining", "rains", "rained"], "a": 3, "u": 2, "hint": "Last week: quá khứ đơn, rained."}, {"o": ["finishing", "will finish", "finished", "finishes"], "a": 1, "u": 3, "hint": "If ... tomorrow: will + V nguyên mẫu, will finish."}], "passage": "Hung is a farmer's son. On Sundays, he {1} his father in the field. At the moment, they {2} the rice. Hung doesn't mind {3} hard, because he loves his village. Last week, it {4} for two days, so they could not work. If it is sunny tomorrow, they {5} the rest.", "ptitle": "Hung's Sunday"}, {"id": "d26-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Choose the correct sentence (A, B or C) made from the prompts.", "type": "choice", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Although + mệnh đề, mệnh đề chính (ôn lớp 6-7), không dùng thêm but trong cùng câu. Em gõ cả câu.", "items": [{"s": "My father / spend / two hours / feed / pigs / every morning.", "a": 0, "u": 1, "hint": "spend + thời gian + V-ing; thêm the.", "o": ["My father spends two hours feeding the pigs every morning.", "My father spends two hours feed the pigs every morning.", "My father spends two hours to feed the pigs every morning."], "c3": 1}, {"s": "Hung / work / harder / than / his brother.", "a": 0, "u": 2, "hint": "harder than.", "o": ["Hung works harder than his brother.", "Hung works more harder than his brother.", "Hung work harder than his brother."], "c3": 1}, {"s": "The farmers / harvest / rice / now.", "a": 0, "u": 2, "hint": "Hiện tại tiếp diễn: are harvesting.", "o": ["The farmers are harvesting rice now.", "The farmers is harvesting rice now.", "The farmers harvesting rice now."], "c3": 1}, {"s": "It / rain / heavily / yesterday / so / they / not go / field.", "a": 0, "u": 3, "hint": "Quá khứ; so nối kết quả; go to the field.", "o": ["It rained heavily yesterday, so they did not go to the field.", "It rained heavily yesterday, so they did not went to the field.", "It rained heavily yesterday, so they did not go to field."], "c3": 1}, {"s": "You / had better / go / home / now / or else / your mother / worry.", "a": 0, "u": 3, "hint": "had better + V; or else + will + V.", "o": ["You had better go home now, or else your mother will worry.", "You had better go home now, or else your mother will worries.", "You had better to go home now, or else your mother will worry."], "c3": 1}]}, {"id": "d26-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Choose the sentence (A, B or C) which has the same meaning as the given one.", "type": "choice", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Lan plays chess better than Tom.", "a": 0, "u": 2, "hint": "Đổi cấu trúc so sánh: not as ... as đổi qua lại với so sánh hơn của đối tượng còn lại.", "o": ["Tom doesn't play chess as well as Lan.", "Tom doesn't plays chess as well as Lan.", "Tom doesn't play chess as good as Lan."], "c3": 1}, {"s": "Nam likes tennis. Nam doesn't like badminton.", "a": 0, "u": 3, "hint": "Gộp câu bằng both ... and, or, but hoặc so.", "o": ["Nam likes tennis but he doesn't like badminton.", "Nam likes tennis but he doesn't likes badminton.", "Nam like tennis but he doesn't like badminton."], "c3": 1}, {"s": "Nam is interested in collecting coins.", "a": 0, "u": 1, "hint": "Đổi qua lại giữa adore, fancy + V-ing và be keen on, fond of, into, interested in.", "o": ["Nam fancies collecting coins.", "Nam fancy collecting coins.", "Nam fancies collect coins."], "c3": 1}, {"s": "Mrs Lan is a more careful driver than her husband.", "a": 0, "u": 2, "hint": "Danh từ chỉ người đổi qua lại với động từ + trạng từ so sánh hơn (a faster swimmer, swims faster).", "o": ["Mrs Lan drives more carefully than her husband.", "Mrs Lan drives more careful than her husband.", "Mrs Lan drive more carefully than her husband."], "
