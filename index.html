    var ord = a._opt[k] = it.fix ? idOrder(it.o.length) : shuffled(it.o.length);   /* data-o giu chi so goc, chu A-D theo vi tri hien thi */
    h = '<li class="q" data-q="' + k + '"><span class="no">' + no + '</span><div class="qb"><p class="qs">' + blankHTML(it.s) + '</p><div class="opts">' +
      ord.map(function (j, p) { return '<button type="button" class="opt" data-o="' + j + '"><b>' + 'ABCD'.charAt(p) + '</b><span>' + it.o[j] + '</span></button>'; }).join('') +
      '</div></div>' + un + '</li>';
  } else if (a.type === 'gap') {
    var parts = esc(it.s).split('___'), inp = '<input class="gp" type="text" data-q="' + k + '" id="i-' + a.id + '-' + k + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu ' + no + '">';
    h = '<li class="q"><span class="no">' + no + '</span><div class="qb"><p class="qs">' + (parts.length > 1 ? parts[0] + inp + parts.slice(1).join('') : parts[0] + ' ' + inp) + '</p></div>' + un + '</li>';
  } else if (a.type === 'type') {
    h = '<li class="q"><span class="no">' + no + '</span><div class="qb"><p class="qs">' + esc(it.s) + '</p>' +
      (it.stub ? '<p class="stub">Bắt đầu bằng: <b>' + esc(it.stub) + '</b></p>' : '') +
      '<textarea class="ty" rows="2" data-q="' + k + '" id="i-' + a.id + '-' + k + '" autocomplete="off" spellcheck="false" aria-label="Câu ' + no + '"></textarea></div>' + un + '</li>';
  }
  return h;
}
function passHTML(a) {
  var t = esc(a.passage);
  a.items.forEach(function (it, k) {
    var no = a.start + k, ctl;
    if (a.type === 'pgap') ctl = '<span class="pb"><i>' + no + '</i><input class="gp" type="text" data-q="' + k + '" id="i-' + a.id + '-' + k + '" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Chỗ trống ' + no + '"></span>';
    else {
      var ord = a._opt[k] = it.fix ? idOrder(it.o.length) : shuffled(it.o.length);
      ctl = '<span class="pb"><i>' + no + '</i><select class="sl" data-q="' + k + '" id="i-' + a.id + '-' + k + '" aria-label="Chỗ trống ' + no + '"><option value="">Chọn</option>' +
        ord.map(function (j, p) { return '<option value="' + j + '">' + 'ABCD'.charAt(p) + '. ' + esc(it.o[j]) + '</option>'; }).join('') + '</select></span>';
    }
    t = t.replace('{' + (k + 1) + '}', ctl);
  });
  return '<div class="pass">' + (a.ptitle ? '<h4>' + esc(a.ptitle) + '</h4>' : '') + '<p>' + t + '</p></div>' +
    '<p class="unrow">' + a.items.map(function (it, k) { return '<span class="un">' + (a.start + k) + ': Unit ' + it.u + '</span>'; }).join('') + '</p>';
}
function actHTML(a) {
  a._opt = {};
  a._ord = a.passage ? idOrder(a.items.length) : shuffled(a.items.length);   /* phan doan van giu thu tu cau vi cho trong nam trong bai doc */
  var h = '<section class="act" data-act="' + a.id + '"><div class="ah"><div><h3>' + esc(a.title) + '</h3><p class="instr">' + esc(a.instr) + '</p></div><div class="stars" aria-label="Sao">' + stars(a.id) + '</div></div>';
  if (a.box) h += '<ul class="box" aria-label="Khung từ">' + shuffled(a.box.length).map(function (i) { return '<li>' + esc(a.box[i]) + '</li>'; }).join('') + '</ul>';
  if (a.passage) h += passHTML(a);
  else h += '<ol class="ql">' + a._ord.map(function (k, pos) { return itemHTML(a, a.items[k], k, pos); }).join('') + '</ol>';
  h += '<p class="rule">Em làm hết các câu rồi bấm Kiểm tra. Câu sai sẽ hiện đáp án đúng. Muốn làm lại, em phải làm lại cả bài từ đầu.</p>';
  h += '<div class="fb" hidden></div><div class="bt"><button type="button" class="btn pri" data-do="check">Kiểm tra</button><button type="button" class="btn" data-do="reset">Làm lại cả bài</button></div></section>';
  return h;
}

/* ---------- man hinh ---------- */
function homeView() {
  var h = '<header class="top"><p class="brand">Dịch vụ gia sư và dạy kèm Hoa Dũng</p><h1>Ôn tập Tiếng Anh 8</h1><p class="sub">Unit 1, 2, 3 · ' + DES.length + ' đề, mỗi đề 50 câu</p></header>';
  h += '<section class="who"><h2>Thông tin của em</h2><div class="row"><label for="ten">Họ và tên<input id="ten" type="text" value="' + esc(me.ten) + '" autocomplete="name"></label><label for="lop">Lớp<input id="lop" type="text" value="' + esc(me.lop) + '" autocomplete="off"></label></div>' +
    '<p class="note">Kết quả mỗi lần kiểm tra được gửi về cho thầy' + (WEB ? '' : ' khi thầy kết nối Google Sheets') + '. Làm đúng hết cả phần là Hoàn thành; còn câu sai là Chưa hoàn thành, em làm lại cả phần để hoàn thành.</p></section>';
  h += '<section><h2>Bảng ngữ pháp</h2><div class="grid3">' + GR.map(function (g) { return '<a class="card gcard" href="#' + g.id + '"><b>' + g.title + '</b><span>' + esc(g.topic) + '</span></a>'; }).join('') + '</div></section>';
  h += '<section><h2>Đề ôn tập</h2><div class="grid">' + DES.map(function (d) {
    var s = deStat(d);
    return '<a class="card dcard" href="#' + d.id + '"><b>' + d.title + '</b><span>' + s.done + '/9 phần đúng hết</span><span class="mini">' + s.st + '/27 sao</span></a>';
  }).join('') + '</div></section>';
  return h;
}
function grammarView(g) {
  var h = '<a class="back" href="#home">Về trang chính</a><header class="top"><p class="brand">Bảng ngữ pháp</p><h1>' + g.title + '</h1><p class="sub">' + esc(g.topic) + '</p></header><div class="gl">';
  g.cards.forEach(function (c) {
    h += '<article class="gc"><h3>' + icon(c.icon) + '<span>' + esc(c.h) + '</span></h3>' + c.body.map(function (b) { return '<p>' + b + '</p>'; }).join('') + (c.tip ? '<p class="tip"><b>Mẹo:</b> ' + esc(c.tip) + '</p>' : '') + '</article>';
  });
  h += '</div><nav class="pn">' + GR.map(function (x) { return '<a class="' + (x.id === g.id ? 'cur' : '') + '" href="#' + x.id + '">' + x.title + '</a>'; }).join('') + '<a href="#home">Đề ôn tập</a></nav>';
  return h;
}
function deView(d) {
  var t = curTab[d.id] || 0;
  var h = '<a class="back" href="#home">Về trang chính</a><header class="top"><p class="brand">Ôn tập giữa học kì I · Tiếng Anh 8</p><h1>' + d.title + '</h1></header><nav class="tabs" role="tablist">' +
    d.acts.map(function (a, i) {
      var p = prog[a.id], ok = p && p.best >= p.total;
      return '<button type="button" role="tab" class="tab' + (i === t ? ' cur' : '') + (ok ? ' done' : '') + '" data-tab="' + i + '" aria-selected="' + (i === t) + '">' + a.part + '</button>';
    }).join('') + '</nav><div id="actbox">' + actHTML(d.acts[t]) + '</div>';
  return h;
}

/* ---------- cham bai ---------- */
function findAct(id) {
  for (var i = 0; i < DES.length; i++) for (var j = 0; j < DES[i].acts.length; j++) if (DES[i].acts[j].id === id) return DES[i].acts[j];
}
function ctl(sec, k) { return sec.querySelector('[data-q="' + k + '"]'); }
function evalItem(a, sec, k) {
  var it = a.items[k], el = ctl(sec, k);
  if (a.type === 'choice') { var s = el.getAttribute('data-sel'); if (s === null || s === '') return null; return +s === it.a; }
  if (a.type === 'pchoice') { if (el.value === '') return null; return +el.value === it.a; }
  var v = el.value.trim(); if (!v) return null;
  if (a.type === 'pgap' || a.type === 'gap') return match(a, it, v);
  return match(a, it, v);
}
function lockOK(a, sec, k) {
  var el = ctl(sec, k);
  if (a.type === 'choice') { el.classList.add('ok'); el.classList.remove('bad'); el.querySelectorAll('.opt').forEach(function (b) { b.disabled = true; }); }
  else { el.classList.add('ok'); el.classList.remove('bad'); if (el.tagName === 'SELECT') el.disabled = true; else el.readOnly = true; }
}
function markBad(a, sec, k) { ctl(sec, k).classList.add('bad'); }
function insAns(el, text) { if (el.parentNode.querySelector('.ans')) return; var s = document.createElement('span'); s.className = 'ans'; s.textContent = 'Đáp án: ' + text; el.insertAdjacentElement('afterend', s); }
function lockWrong(a, sec, k) {
  var el = ctl(sec, k), it = a.items[k];
  if (a.type === 'choice') {
    el.classList.add('bad');
    el.querySelectorAll('.opt').forEach(function (b) { if (+b.getAttribute('data-o') === it.a) b.classList.add('key'); b.disabled = true; });
  } else if (a.type === 'pchoice') {
    var op = el.querySelector('option[value="' + it.a + '"]'); el.classList.add('bad'); el.disabled = true; insAns(el, op ? op.textContent : String(it.o[it.a]));
  } else {
    el.classList.add('bad'); if (el.tagName === 'SELECT') el.disabled = true; else el.readOnly = true; insAns(el, it.a[0]);
  }
}
function send(a, dung, tong) {
  if (!WEB) return;
  var p = new URLSearchParams({ ten: me.ten, lop: me.lop, unit: a.id.split('-')[0].replace('d', 'De '), bai: a.id, tieude: a.title, dung: dung, tong: tong, diem: (Math.round(dung / tong * 100) / 10).toFixed(1), sao: (dung / tong >= 1 ? 3 : dung / tong >= 0.9 ? 2 : dung / tong >= 0.8 ? 1 : 0) });
  var url = WEB + (WEB.indexOf('?') < 0 ? '?' : '&') + p.toString();
  try { fetch(url, { mode: 'no-cors' }).catch(function () { showSend(a, url); }); } catch (e) { showSend(a, url); }
}
function showSend(a, url) {
  var sec = root.querySelector('[data-act="' + a.id + '"]'); if (!sec) return;
  var fb = sec.querySelector('.fb'); fb.insertAdjacentHTML('beforeend', '<p><a class="lnk" target="_blank" rel="noopener" href="' + esc(url) + '">Gửi điểm cho thầy</a></p>');
}
/* "Cach lam": cau dau hien san, phan con lai de trong muc Xem them */
function howHTML(h) {
  var s = String(h || '').trim(); if (!s) return '';
  var i = s.search(/[.!?]\s/), first = i < 0 ? s : s.slice(0, i + 1), rest = i < 0 ? '' : s.slice(i + 1).trim();
  return '<p class="how"><b>Cách làm:</b> ' + esc(first) + '</p>' +
    (rest ? '<details class="more"><summary>Xem thêm</summary><p class="how">' + esc(rest) + '</p></details>' : '');
}
/* Kiem tra DUNG MOT LAN cho ca bai: sai thi khoa + hien dap an; muon lam lai phai bam "Lam lai ca bai" */
function check(a, sec) {
  var n = a.items.length, k, fb = sec.querySelector('.fb');
  if (!String(me.ten || '').trim()) {
    fb.hidden = false; fb.className = 'fb stop';
    fb.innerHTML = '<p><b>Em chưa nhập họ tên.</b> Em về trang chính, nhập họ tên và lớp rồi quay lại làm bài để điểm được ghi cho em.</p><p><a class="lnk" href="#home">Về trang chính</a></p>';
    return;
  }
  var blank = [];
  for (k = 0; k < n; k++) if (evalItem(a, sec, k) === null) blank.push(a.start + a._ord.indexOf(k));
  blank.sort(function (x, y) { return x - y; });
  if (blank.length) {
    fb.hidden = false; fb.className = 'fb stop';
    fb.innerHTML = '<p><b>Em chưa làm xong.</b> Còn ' + blank.length + ' câu chưa trả lời (câu ' + blank.join(', ') + '). Em làm hết rồi mới bấm Kiểm tra.</p>';
    return;
  }
  var dung = 0, wrong = 0;
  for (k = 0; k < n; k++) {
    if (evalItem(a, sec, k) === true) { dung++; lockOK(a, sec, k); } else { wrong++; lockWrong(a, sec, k); }
  }
  var p = prog[a.id] || (prog[a.id] = { first: dung, total: n, best: dung, lan: 0 });
  p.total = n; p.lan = (p.lan || 0) + 1; p.last = dung; if (dung > p.best) p.best = dung;
  ls('hd_prog', prog);
  send(a, dung, n);
  fb.hidden = false;
  if (wrong === 0) {
    fb.className = 'fb good';
    fb.innerHTML = '<p><b>Em đã làm đúng hết ' + n + ' câu.</b> Phần này được ghi nhận là <b>Hoàn thành</b>.</p><p>Em có thể bấm Làm lại cả bài để luyện thêm.</p>';
  } else {
    fb.className = 'fb warn';
    fb.innerHTML = '<p>Em đúng <b>' + dung + '/' + n + '</b> câu. Phần này được ghi nhận là <b>Chưa hoàn thành</b>.</p>' +
      '<p>Các câu sai đã được khóa và hiện đáp án đúng. Em đọc đáp án và làm theo cách làm dưới đây để hiểu vì sao chọn như vậy.</p>' + howHTML(a.huong) +
      '<p>Muốn hoàn thành, em bấm Làm lại cả bài và làm lại từ câu đầu tiên.</p>';
  }
  sec.querySelector('[data-do="check"]').hidden = true;
  sec.querySelector('.stars').innerHTML = stars(a.id);
  var tab = root.querySelector('.tab.cur'); if (tab && prog[a.id] && prog[a.id].best >= prog[a.id].total) tab.classList.add('done');
}

/* ---------- su kien ---------- */
var view = '';
function route() {
  var h = (location.hash || '#home').slice(1) || 'home', html = '';
  var g = GR.filter(function (x) { return x.id === h; })[0], d = DES.filter(function (x) { return x.id === h; })[0];
  if (g) { html = grammarView(g); } else if (d) { html = deView(d); } else { h = 'home'; html = homeView(); }
  view = h; root.innerHTML = html; window.scrollTo(0, 0);
}
root.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  var sec = t.closest('.act');
  if (t.classList.contains('opt')) {
    var q = t.closest('.q'); if (t.disabled) return;
    q.querySelectorAll('.opt').forEach(function (b) { b.classList.remove('sel'); }); t.classList.add('sel');
    q.setAttribute('data-sel', t.getAttribute('data-o')); q.classList.remove('bad'); return;
  }
  if (t.hasAttribute('data-tab')) {
    var dd = DES.filter(function (x) { return x.id === view; })[0]; if (!dd) return;
    curTab[dd.id] = +t.getAttribute('data-tab'); root.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('cur'); b.setAttribute('aria-selected', 'false'); });
    t.classList.add('cur'); t.setAttribute('aria-selected', 'true');
    document.getElementById('actbox').innerHTML = actHTML(dd.acts[curTab[dd.id]]); return;
  }
  if (!sec) return;
  var a = findAct(sec.getAttribute('data-act'));
  if (t.getAttribute('data-do') === 'check') check(a, sec);
  if (t.getAttribute('data-do') === 'reset') { mem[a.id] = {}; sec.outerHTML = actHTML(a); }
});
root.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'ten' || el.id === 'lop') { me.ten = (document.getElementById('ten') || {}).value || ''; me.lop = (document.getElementById('lop') || {}).value || ''; ls('hd_me', me); return; }
  if (el.classList && el.hasAttribute('data-q')) el.classList.remove('bad');
});
root.addEventListener('change', function (e) { var el = e.target; if (el.tagName === 'SELECT') el.classList.remove('bad'); });
window.addEventListener('hashchange', route);
route();
window.__hd = { DES: DES, norm: norm, match: match };
})();
</script>
