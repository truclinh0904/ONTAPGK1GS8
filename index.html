 than they did in the past.", "o": ["more quickly", "quicklier", "quick", "more quick"], "a": 0, "u": 2}, {"s": "A ferry moves ___ than a boat with a motor.", "o": ["slow", "more slowly", "slowlier", "most slowly"], "a": 1, "u": 2}, {"s": "This villager works ___ than the others in the orchard.", "o": ["hard", "harder", "hardest", "more hard"], "a": 1, "u": 2}, {"s": "It was snowing heavily; ___, they went snowboarding.", "o": ["so", "therefore", "however", "for"], "a": 2, "u": 3}, {"s": "My friends play chess, ___ I do puzzles.", "o": ["and", "so", "for", "however"], "a": 0, "u": 3}, {"s": "Teenagers feel ___ when they have too much pressure from schoolwork.", "o": ["delighted", "stressed", "relaxed", "confident"], "a": 1, "u": 3}]}, {"id": "d13-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Tom often (hang) ___ out with his friends.", "a": ["hangs"], "u": 1}, {"s": "We (not go) ___ to the resort last summer.", "a": ["did not go", "didn't go"], "u": 1}, {"s": "Mai is fond of (listen) ___ to music in her leisure time.", "a": ["listening"], "u": 1}, {"s": "The villagers (unload) ___ the cart yesterday afternoon.", "a": ["unloaded"], "u": 2}, {"s": "Do you fancy (try) ___ snowboarding?", "a": ["trying"], "u": 1}]}, {"id": "d13-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Teenagers should join school clubs to improve their ___ skills. (COMMUNICATE)", "a": ["communication"], "u": 3}, {"s": "Swimming makes our muscles ___. (STRONG)", "a": ["stronger"], "u": 1}, {"s": "This movie is ___ than the last one. (INTEREST)", "a": ["more interesting"], "u": 1}, {"s": "The students ran ___ than their teacher. (QUICK)", "a": ["more quickly"], "u": 2}, {"s": "She finished the project ___. (SUCCESS)", "a": ["successfully"], "u": 3}]}, {"id": "d13-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Minh isn't ___ in surfing the net.", "a": ["interested"], "u": 1}, {"s": "My aunt is ___ of knitting scarves.", "a": ["fond"], "u": 1}, {"s": "Hoa is very ___ on origami.", "a": ["keen"], "u": 1}, {"s": "Are you ___ about dragon-snake games?", "a": ["crazy"], "u": 2}, {"s": "My brother is ___ playing board games.", "a": ["into"], "u": 1}], "box": ["interested", "fond", "keen", "crazy", "into"]}, {"id": "d13-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 2}, {"a": ["or"], "u": 2}, {"a": ["so"], "u": 2}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["for", "and", "or", "so", "however"], "passage": "Life in the countryside has both good points and bad points. People enjoy fresh air {1} picturesque views. They can walk in the paddy fields {2} ride bikes along the canal. Villagers are friendly, {3} they often help each other at harvest time. Life there is peaceful; {4}, it is not very convenient. Many teens like the village, {5} they can play outdoors all day."}, {"id": "d13-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["so", "or", "for", "but"], "a": 0, "u": 3}, {"o": ["so", "and", "or", "for"], "a": 1, "u": 3}, {"o": ["fast", "faster", "more fast", "fastly"], "a": 1, "u": 2}, {"o": ["dry", "drying", "dried", "to dry"], "a": 2, "u": 2}, {"o": ["therefore", "however", "so", "or"], "a": 1, "u": 3}], "passage": "Harvest time is the busiest season in the village, {1} all villagers get up very early. Some cut the rice, {2} others load it onto carts. A combine harvester can work {3} than ten people. After the harvest, the rice must be {4} in the sun. It is hard work; {5}, everyone feels happy.", "ptitle": "Harvest time"}, {"id": "d13-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "My grandparents / live / village / near / vast / paddy field.", "a": ["My grandparents live in a village near a vast paddy field."], "u": 2}, {"s": "They / get up / early / than / people / city.", "a": ["They get up earlier than people in the city."], "u": 2}, {"s": "Villagers / love / catch / fish / canal / evening.", "a": ["Villagers love catching fish in the canal in the evening.", "Villagers love to catch fish in the canal in the evening."], "u": 1}, {"s": "The village / small / so / everyone / know / each other.", "a": ["The village is small, so everyone knows each other."], "u": 3}, {"s": "Life / countryside / be / peaceful / however / not convenient.", "a": ["Life in the countryside is peaceful; however, it is not convenient."], "u": 3}]}, {"id": "d13-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "She spends an hour knitting every evening.", "stub": "It takes", "a": ["It takes her an hour to knit every evening.", "her an hour to knit every evening."], "u": 1}, {"s": "My father loves doing DIY.", "stub": "My father is fond", "a": ["My father is fond of doing DIY.", "of doing DIY."], "u": 1}, {"s": "Linh hates playing board games.", "stub": "Linh isn't keen", "a": ["Linh isn't keen on playing board games.", "on playing board games."], "u": 1}, {"s": "Nam is stressed now, for he has a midterm test tomorrow.", "stub": "Nam has", "a": ["Nam has a midterm test tomorrow, so he is stressed now.", "a midterm test tomorrow, so he is stressed now.", "Nam has a midterm test tomorrow; therefore, he is stressed now.", "a midterm test tomorrow; therefore, he is stressed now."], "u": 3}, {"s": "My brother doesn't swim as well as his friend.", "stub": "His friend", "a": ["His friend swims better than my brother.", "swims better than my brother."], "u": 2}]}]}, {"id": "d14", "no": 14, "title": "Đề số 14", "acts": [{"id": "d14-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>ou<\/u>ld", "m<u>oo<\/u>n", "f<u>oo<\/u>d", "fr<u>ui<\/u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>oo<\/u>d", "t<u>oo<\/u>k", "bl<u>ue<\/u>", "c<u>ou<\/u>ld"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>be<\/u>have", "b<u>a<\/u>nana", "gener<u>ou<\/u>s", "answ<u>e<\/u>r"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["anxi<u>ou<\/u>s", "<u>ex<\/u>change", "<u>pre<\/u>dict", "k<u>i<\/u>t"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>oi<\/u>n", "b<u>oi<\/u>l", "t<u>ou<\/u>rist", "j<u>oy<\/u>"], "a": 2, "u": 3}]}, {"id": "d14-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "Mai doesn't mind ___ her little sister at weekends.", "o": ["look after", "looking after", "to look after", "looked after"], "a": 1, "u": 1}, {"s": "My brother is ___ on cooking and makes dinner every day.", "o": ["fond", "keen", "interested", "crazy"], "a": 1, "u": 1}, {"s": "Our teacher detests ___ late for class.", "o": ["is", "be", "being", "to be"], "a": 2, "u": 1}, {"s": "Are you interested ___ joining the Chess Club?", "o": ["in", "on", "at", "of"], "a": 0, "u": 1}, {"s": "Hung can ride a bike ___ than his cousin.", "o": ["fast", "faster", "more fast", "fastest"], "a": 1, "u": 2}, {"s": "Grandma gets up ___ than anyone else in the family.", "o": ["early", "earlier", "earliest", "more early"], "a": 1, "u": 2}, {"s": "The cattle in this farm are fed ___ than before.", "o": ["good", "best", "more well", "better"], "a": 3, "u": 2}, {"s": "He didn't study for the test, ___ he got a bad mark.", "o": ["so", "but", "or", "for"], "a": 0, "u": 3}, {"s": "Take a rest, ___ you will feel tired.", "o": ["so", "and", "or else", "however"], "a": 2, "u": 3}, {"s": "Peers can ___ their problems with the school helpline.", "o": ["discuss", "observe", "plough", "cultivate"], "a": 0, "u": 3}]}, {"id": "d14-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Nga (do) ___ puzzles with her grandfather every Sunday.", "a": ["does"], "u": 1}, {"s": "They (visit) ___ the orchard last month.", "a": ["visited"], "u": 2}, {"s": "My mother adores (grow) ___ flowers.", "a": ["growing"], "u": 1}, {"s": "He (not enjoy) ___ the football match yesterday.", "a": ["did not enjoy", "didn't enjoy"], "u": 1}, {"s": "The children (feed) ___ the pigs every afternoon.", "a": ["feed"], "u": 2}]}, {"id": "d14-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Exams are ___ for many teens. (STRESS)", "a": ["stressful"], "u": 3}, {"s": "The ___ of living near the market is great. (CONVENIENT)", "a": ["convenience"], "u": 2}, {"s": "This website is ___ than the old one. (USEFUL)", "a": ["more useful"], "u": 3}, {"s": "The farmers worked ___ than the machines. (SLOW)", "a": ["more slowly"], "u": 2}, {"s": "He has a strong ___ for outdoor activities. (PREFER)", "a": ["preference"], "u": 1}]}, {"id": "d14-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Tom is fond ___ playing the guitar.", "a": ["of"], "u": 1}, {"s": "She is keen ___ painting.", "a": ["on"], "u": 1}, {"s": "Are you interested ___ the school forum?", "a": ["in"], "u": 3}, {"s": "My cousin is crazy ___ football.", "a": ["about"], "u": 1}, {"s": "Lan is ___ origami these days.", "a": ["into"], "u": 1}], "box": ["of", "on", "in", "about", "into"]}, {"id": "d14-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["so"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["and"], "u": 3}, {"a": ["for"], "u": 3}, {"a": ["however"], "u": 3}], "box": ["so", "however", "and", "or", "for"], "passage": "Many teenagers feel stressed before a midterm test. They worry a lot, {1} they cannot concentrate on their schoolwork. Some students talk to their friends {2} their teachers. Others listen to music {3} do some exercise. Exercise is good for them, {4} it helps them stay calm. It is not easy to stay calm; {5}, a little help can make a big difference."}, {"id": "d14-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["for", "so", "or", "however"], "a": 1, "u": 3}, {"o": ["and", "but", "or", "so"], "a": 0, "u": 3}, {"o": ["herding", "herd", "herds", "to herding"], "a": 0, "u": 2}, {"o": ["better", "good", "well", "best"], "a": 0, "u": 2}, {"o": ["convenient", "convenience", "conveniently", "convene"], "a": 0, "u": 2}], "passage": "Many families in Mongolia live in gers. A ger is a home that is easy to move. The families keep cattle, {1} they must move to new fields every season. The grassland is vast, {2} it is very beautiful. Children enjoy {3} the herds with their parents. They are brave and can ride horses {4} than adults. Life there is not very {5}, but people are happy.", "ptitle": "Life in a Mongolian grassland"}, {"id": "d14-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Local people / not use / combine harvesters / so / they / work / slow.", "a": ["Local people do not use combine harvesters, so they work slowly.", "Local people don't use combine harvesters, so they work slowly."], "u": 3}, {"s": "Cars / move / much / fast / than / buffalo-drawn carts.", "a": ["Cars move much faster than buffalo-drawn carts."], "u": 2}, {"s": "Children / village / dislike / stay / indoors.", "a": ["Children in the village dislike staying indoors."], "u": 1}, {"s": "Villagers / feed / pigs / and / milk / cows / every day.", "a": ["Villagers feed pigs and milk cows every day."], "u": 2}, {"s": "The air / countryside / be / fresh / and / the views / be / picturesque.", "a": ["The air in the countryside is fresh and the views are picturesque."], "u": 2}]}, {"id": "d14-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Hung thirty minutes to cycle to school.", "stub": "Hung spends", "a": ["Hung spends thirty minutes cycling to school.", "thirty minutes cycling to school."], "u": 1}, {"s": "Nga loves growing flowers.", "stub": "Nga is fond", "a": ["Nga is fond of growing flowers.", "of growing flowers."], "u": 1}, {"s": "My cousin hates playing chess.", "stub": "My cousin isn't keen", "a": ["My cousin isn't keen on playing chess.", "on playing chess."], "u": 1}, {"s": "He is sad now, for he lost his notebook.", "stub": "He lost", "a": ["He lost his notebook, so he is sad now.", "his notebook, so he is sad now.", "He lost his notebook; therefore, he is sad now.", "his notebook; therefore, he is sad now."], "u": 3}, {"s": "Lan doesn't write as carefully as Mai.", "stub": "Mai", "a": ["Mai writes more carefully than Lan.", "writes more carefully than Lan."], "u": 2}]}]}, {"id": "d15", "no": 15, "title": "Đề số 15", "acts": [{"id": "d15-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["t<u>oo<\/u>th", "w<u>o<\/u>lf", "c<u>oo<\/u>l", "bl<u>ue<\/u>"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["f<u>oo<\/u>d", "w<u>ou<\/u>ld", "w<u>o<\/u>man", "p<u>u<\/u>sh"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["gener<u>ou<\/u>s", "hands<u>o<\/u>me", "<u>de<\/u>cide", "c<u>o<\/u>mpare"], "a": 2, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>de<\/u>cide", "c<u>o<\/u>ntrol", "w<u>i<\/u>n", "bagg<u>age<\/u>"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>oo<\/u>r", "t<u>ou<\/u>rist", "p<u>oi<\/u>nt", "t<u>ou<\/u>r"], "a": 2, "u": 3}]}, {"id": "d15-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My sister adores ___ stories to little children.", "o": ["read", "reading", "to read", "reads"], "a": 1, "u": 1}, {"s": "He is ___ about snowboarding and goes to the mountains every winter.", "o": ["fond", "interested", "crazy", "keen"], "a": 2, "u": 1}, {"s": "They don't mind ___ their classroom after school.", "o": ["clean", "to clean", "cleans", "cleaning"], "a": 3, "u": 1}, {"s": "Ba is not ___ on doing puzzles; he finds them boring.", "o": ["interested", "keen", "fond", "into"], "a": 1, "u": 1}, {"s": "The students answered the questions ___ than the teacher expected.", "o": ["more confident", "more confidently", "confidently", "most confidently"], "a": 1, "u": 3}, {"s": "Tractors work ___ than buffaloes.", "o": ["hard", "more hard", "harder", "hardest"], "a": 2, "u": 2}, {"s": "Farmers in this village harvest rice ___ than before.", "o": ["early", "earlier", "more early", "earliest"], "a": 1, "u": 2}, {"s": "The villagers were poor; ___, they were always generous.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "Do you want to join a language club ___ a sport club?", "o": ["and", "so", "or", "however"], "a": 2, "u": 3}, {"s": "A ___ is someone who is the same age as you.", "o": ["peer", "leader", "bully", "coach"], "a": 0, "u": 3}]}, {"id": "d15-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Lan (message) ___ her friends every evening.", "a": ["messages"], "u": 1}, {"s": "The villagers (catch) ___ fish in the canal yesterday.", "a": ["caught"], "u": 2}, {"s": "Peter hates (get) ___ up early.", "a": ["getting", "to get"], "u": 1}, {"s": "We (not have) ___ a midterm test last week.", "a": ["did not have", "didn't have"], "u": 3}, {"s": "My brother fancies (learn) ___ to knit.", "a": ["learning"], "u": 1}]}, {"id": "d15-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Lan feels ___ after winning the competition. (SATISFY)", "a": ["satisfied"], "u": 3}, {"s": "The teacher spoke ___ than the students. (LOUD)", "a": ["louder"], "u": 2}, {"s": "Teens need good ___ to talk about their stress. (ADVISE)", "a": ["advice"], "u": 3}, {"s": "We can improve our ___ by doing yoga. (BALANCE)", "a": ["balance"], "u": 1}, {"s": "Dancing is an ___ activity for teens. (ENJOY)", "a": ["enjoyable"], "u": 1}]}, {"id": "d15-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "I'm crazy ___ board games.", "a": ["about"], "u": 1}, {"s": "I'm not ___ of messaging friends.", "a": ["fond"], "u" "advising", "advised"], "a": 1, "u": 3}], "passage": "Our school has some clubs for teenagers. In the Sport Club, students play basketball {1} improve their health. The Language Club helps members speak English {2} confidently. The Craft Club is popular, {3} many students are fond of making home-made gifts. Members of this club are {4} on origami. The club leader always gives them {5}.", "ptitle": "Meet the school clubs"}, {"id": "d15-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "My family / live / small village / far / city.", "a": ["My family lives in a small village far from the city."], "u": 2}, {"s": "We / go / school / by bike / so / we / not need / a bus.", "a": ["We go to school by bike, so we do not need a bus."], "u": 3}, {"s": "Farmers / work / hard / than / usual / at harvest time.", "a": ["Farmers work harder than usual at harvest time."], "u": 2}, {"s": "The villagers / enjoy / sit / by the canal / evening.", "a": ["The villagers enjoy sitting by the canal in the evening."], "u": 1}, {"s": "Life / village / not be / as / busy / as / life / city.", "a": ["Life in the village is not as busy as life in the city."], "u": 2}]}, {"id": "d15-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mai spends one hour surfing the net every day.", "stub": "It takes", "a": ["It takes Mai one hour to surf the net every day.", "Mai one hour to surf the net every day."], "u": 1}, {"s": "My mother loves cooking.", "stub": "My mother is fond", "a": ["My mother is fond of cooking.", "of cooking."], "u": 1}, {"s": "Tom dislikes doing puzzles.", "stub": "Tom isn't keen", "a": ["Tom isn't keen on doing puzzles.", "on doing puzzles."], "u": 1}, {"s": "She is worried now, for she has a test tomorrow.", "stub": "She has", "a": ["She has a test tomorrow, so she is worried now.", "a test tomorrow, so she is worried now.", "She has a test tomorrow; therefore, she is worried now.", "a test tomorrow; therefore, she is worried now."], "u": 3}, {"s": "Hoa doesn't draw as well as Lan.", "stub": "Lan", "a": ["Lan draws better than Hoa.", "draws better than Hoa."], "u": 2}]}]}, {"id": "d16", "no": 16, "title": "Đề số 16", "acts": [{"id": "d16-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o<\/u>man", "n<u>oo<\/u>n", "j<u>ui<\/u>ce", "l<u>o<\/u>se"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>o<\/u>man", "p<u>u<\/u>ll", "t<u>oo<\/u>k", "t<u>oo<\/u>l"], "a": 3, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["freed<u>o<\/u>m", "s<u>u<\/u>rprise", "anxi<u>ou<\/u>s", "<u>be<\/u>come"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>ui<\/u>ld", "c<u>o<\/u>mpare", "<u>re<\/u>new", "<u>ex<\/u>change"], "a": 1, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oi<\/u>l", "p<u>oi<\/u>nt", "t<u>ou<\/u>r", "<u>oi<\/u>l"], "a": 2, "u": 3}]}, {"id": "d16-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My sister fancies ___ a cultural event this Sunday.", "o": ["join", "joining", "to join", "joined"], "a": 1, "u": 1}, {"s": "Nam is crazy ___ playing video games.", "o": ["about", "in", "on", "of"], "a": 0, "u": 1}, {"s": "They detest ___ in a long queue.", "o": ["wait", "waiting", "to wait", "waited"], "a": 1, "u": 1}, {"s": "Minh is fond ___ hanging out with his classmates.", "o": ["on", "of", "in", "at"], "a": 1, "u": 1}, {"s": "The keeper observes the sea ___ than other people.", "o": ["careful", "more careful", "more carefully", "carefuller"], "a": 2, "u": 2}, {"s": "Mai arrives ___ than her sister, so she always gets a good seat.", "o": ["late", "later", "latest", "more late"], "a": 1, "u": 2}, {"s": "The ferry crossed the canal ___ than the old boat.", "o": ["more safe", "safe", "more safely", "safest"], "a": 2, "u": 2}, {"s": "She was nervous; ___, she answered all the questions well.", "o": ["so", "therefore", "however", "and"], "a": 2, "u": 3}, {"s": "Is the competition in the morning ___ in the afternoon?", "o": ["so", "or", "but", "however"], "a": 1, "u": 3}, {"s": "A good team leader can ___ the members of the club.", "o": ["advise", "unload", "plough", "herd"], "a": 0, "u": 3}]}, {"id": "d16-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "My brother (join) ___ the Football Club last month.", "a": ["joined"], "u": 3}, {"s": "Lan adores (visit) ___ ancient villages.", "a": ["visiting"], "u": 2}, {"s": "The farmers (observe) ___ the weather every day.", "a": ["observe"], "u": 2}, {"s": "My sister (not fancy) ___ messaging friends all day.", "a": ["does not fancy", "doesn't fancy"], "u": 1}, {"s": "Bao detests (wash) ___ dishes.", "a": ["washing"], "u": 1}]}, {"id": "d16-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "Our team plays ___ than theirs. (WELL)", "a": ["better"], "u": 2}, {"s": "The ___ between the two teams is exciting. (COMPETE)", "a": ["competition"], "u": 3}, {"s": "She spoke ___ and everyone listened. (CONFIDENT)", "a": ["confidently"], "u": 3}, {"s": "Life in the village is very ___. (PEACE)", "a": ["peaceful"], "u": 2}, {"s": "My uncle walks ___ than I do. (FAST)", "a": ["faster"], "u": 2}]}, {"id": "d16-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Tom is ___ in snowboarding.", "a": ["interested"], "u": 1}, {"s": "My mother is ___ on watering the plants.", "a": ["keen"], "u": 1}, {"s": "Linh is ___ about folk music.", "a": ["crazy"], "u": 1}, {"s": "Are you ___ of strawberry ice cream?", "a": ["fond"], "u": 1}, {"s": "He's ___ playing chess.", "a": ["into"], "u": 1}], "box": ["fond", "keen", "interested", "crazy", "into"]}, {"id": "d16-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["or"], "u": 3}, {"a": ["and"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}, {"a": ["so"], "u": 3}], "box": ["or", "and", "however", "for", "so"], "passage": "Our school held a cultural event last week. Students could join a dance club {1} a music club. Some performed folk dances {2} others sang old songs. The event was long; {3}, nobody felt tired. Many parents came, {4} they wanted to see their children. The students practised hard, {5} the show was a great success."}, {"id": "d16-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["lights", "light", "lighting", "lit"], "a": 0, "u": 2}, {"o": ["safe", "safely", "more safe", "safer"], "a": 1, "u": 2}, {"o": ["visit", "visiting", "visits", "visited"], "a": 1, "u": 1}, {"o": ["therefore", "however", "so", "for"], "a": 1, "u": 3}, {"o": ["but", "so", "or", "for"], "a": 0, "u": 3}], "passage": "Our village has an ancient lighthouse near the sea. Every evening the keeper {1} the lamp. Ships can travel {2} at night because of its light. Many tourists like {3} the lighthouse. The road is bad; {4}, they still visit it. Climbing to the top is hard, {5} the view there is picturesque.", "ptitle": "A lighthouse by the sea"}, {"id": "d16-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Villagers / use / buffalo-drawn carts / carry / rice.", "a": ["Villagers use buffalo-drawn carts to carry rice."], "u": 2}, {"s": "Life / countryside / be / slow / than / life / city.", "a": ["Life in the countryside is slower than life in the city."], "u": 2}, {"s": "Many boys / love / herd / buffaloes / paddy fields.", "a": ["Many boys love herding buffaloes in the paddy fields.", "Many boys love to herd buffaloes in the paddy fields."], "u": 1}, {"s": "Farmers / be / busy / however / they / always / smile.", "a": ["Farmers are busy; however, they always smile."], "u": 3}, {"s": "The villagers / pick / fruit / orchard / every autumn.", "a": ["The villagers pick fruit in the orchard every autumn."], "u": 2}]}, {"id": "d16-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Minh forty minutes to ride to the lighthouse.", "stub": "Minh spends", "a": ["Minh spends forty minutes riding to the lighthouse.", "forty minutes riding to the lighthouse."], "u": 1}, {"s": "She loves watching folk dances.", "stub": "She is fond", "a": ["She is fond of watching folk dances.", "of watching folk dances."], "u": 1}, {"s": "My father hates surfing the net.", "stub": "My father isn't keen", "a": ["My father isn't keen on surfing the net.", "on surfing the net."], "u": 1}, {"s": "Tom is calm now, for he finished the midterm test.", "stub": "Tom finished", "a": ["Tom finished the midterm test, so he is calm now.", "the midterm test, so he is calm now.", "Tom finished the midterm test; therefore, he is calm now.", "the midterm test; therefore, he is calm now."], "u": 3}, {"s": "The old boat doesn't go as fast as the new one.", "stub": "The new boat", "a": ["The new boat goes faster than the old one.", "goes faster than the old one.", "The new boat goes faster than the old boat.", "goes faster than the old boat."], "u": 2}]}]}, {"id": "d17", "no": 17, "title": "Đề số 17", "acts": [{"id": "d17-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>oo<\/u>k", "bl<u>ue<\/u>", "pr<u>o<\/u>ve", "b<u>oo<\/u>t"], "a": 0, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["w<u>ou<\/u>ld", "f<u>oo<\/u>d", "f<u>oo<\/u>t", "w<u>o<\/u>lf"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["sil<u>e<\/u>nt", "c<u>o<\/u>mpare", "gener<u>ou<\/u>s", "k<u>i<\/u>t"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["<u>u<\/u>pon", "short<u>age<\/u>", "<u>re<\/u>new", "sh<u>i<\/u>p"], "a": 0, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["b<u>oi<\/u>l", "m<u>oo<\/u>r", "p<u>oo<\/u>r", "t<u>ou<\/u>rist"], "a": 0, "u": 3}]}, {"id": "d17-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My father dislikes ___ in the sun for a long time.", "o": ["stand", "standing", "to stand", "stood"], "a": 1, "u": 1}, {"s": "Hoa is ___ on yoga, so she practises every morning.", "o": ["keen", "interested", "fond", "crazy"], "a": 0, "u": 1}, {"s": "She doesn't mind ___ her account every week.", "o": ["update", "updated", "updating", "to update"], "a": 2, "u": 1}, {"s": "Doing yoga helps improve our ___.", "o": ["balance", "poultry", "crop", "canal"], "a": 0, "u": 1}, {"s": "Chickens and ducks are called ___.", "o": ["cattle", "poultry", "orchards", "canals"], "a": 1, "u": 2}, {"s": "The farmer works ___ than his son in the orchard.", "o": ["more hard", "hardest", "harder", "hard"], "a": 2, "u": 2}, {"s": "He drove ___ than usual because of the rain.", "o": ["slow", "slowly", "more slowly", "slowest"], "a": 2, "u": 2}, {"s": "You must log on to your account, ___ you cannot post a comment.", "o": ["so", "or else", "however", "and"], "a": 1, "u": 3}, {"s": "He studied hard; ___, he did not pass the midterm test.", "o": ["so", "therefore", "however", "for"], "a": 2, "u": 3}, {"s": "The teacher will ___ you on how to study better.", "o": ["advise", "unload", "plough", "stretch"], "a": 0, "u": 3}]}, {"id": "d17-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Bao (stay) ___ in shape by swimming twice a week.", "a": ["stays"], "u": 1}, {"s": "We (post) ___ photos on the school website yesterday.", "a": ["posted"], "u": 3}, {"s": "My aunt adores (feed) ___ the chickens.", "a": ["feeding"], "u": 2}, {"s": "The cows (not eat) ___ much grass last winter.", "a": ["did not eat", "didn't eat"], "u": 2}, {"s": "Lan (log) ___ on to her account every evening.", "a": ["logs"], "u": 3}]}, {"id": "d17-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "She runs ___ than her friends. (QUICK)", "a": ["more quickly"], "u": 2}, {"s": "Our coach gives us good ___. (ADVISE)", "a": ["advice"], "u": 3}, {"s": "The team did better than the coach's ___. (EXPECT)", "a": ["expectations", "expectation"], "u": 3}, {"s": "Our class had a ___ about school clubs. (DISCUSS)", "a": ["discussion"], "u": 3}, {"s": "The cows moved ___ along the canal. (SLOW)", "a": ["slowly"], "u": 2}]}, {"id": "d17-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "My brother is ___ about basketball.", "a": ["crazy"], "u": 1}, {"s": "Are you ___ on gardening?", "a": ["keen"], "u": 1}, {"s": "Lan isn't ___ in snowboarding.", "a": ["interested"], "u": 1}, {"s": "He is ___ of fresh fruit.", "a": ["fond"], "u": 1}, {"s": "She's ___ doing yoga.", "a": ["into"], "u": 1}], "box": ["interested", "fond", "keen", "crazy", "into"]}, {"id": "d17-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 3}, {"a": ["or"], "u": 3}, {"a": ["so"], "u": 3}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["and", "or", "so", "however", "for"], "passage": "Our class made a website for the school club. Members can post photos {1} share their ideas on it. They can log on with an account {2} a nickname. The website is new, {3} many students visit it every day. Some teens spend too much time online; {4}, they know how to balance it with sports. The teacher is happy, {5} the students work as a team."}, {"id": "d17-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["milks", "milk", "milking", "milked"], "a": 1, "u": 2}, {"o": ["and", "so", "or", "for"], "a": 0, "u": 2}, {"o": ["good", "well", "better", "best"], "a": 2, "u": 2}, {"o": ["and", "so", "or", "for"], "a": 0, "u": 3}, {"o": ["so", "but", "or", "for"], "a": 1, "u": 3}], "passage": "Many farmers in my village keep cattle and poultry. They {1} the cows early in the morning. Cows give milk, {2} chickens give eggs. Farmers feed their animals {3} than before because they have new food. They sell some eggs at the market, {4} they keep the rest for the family. Farm work is hard, {5} the farmers love it.", "ptitle": "Farm animals"}, {"id": "d17-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Farmers / feed / chickens / and / ducks / every morning.", "a": ["Farmers feed chickens and ducks every morning."], "u": 2}, {"s": "Tractors / plough / fields / fast / than / buffaloes.", "a": ["Tractors plough fields faster than buffaloes.", "Tractors plough the fields faster than buffaloes."], "u": 2}, {"s": "My uncle / not mind / get up / early / milk / cows.", "a": ["My uncle does not mind getting up early to milk the cows."], "u": 1}, {"s": "Life / village / be / simple / however / people / be / happy.", "a": ["Life in the village is simple; however, people are happy."], "u": 3}, {"s": "Many families / keep / cattle / and / poultry / village.", "a": ["Many families keep cattle and poultry in the village."], "u": 2}]}, {"id": "d17-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Hoa spends one hour doing yoga every morning.", "stub": "It takes", "a": ["It takes Hoa one hour to do yoga every morning.", "Hoa one hour to do yoga every morning."], "u": 1}, {"s": "My brother adores playing basketball.", "stub": "My brother is fond", "a": ["My brother is fond of playing basketball.", "of playing basketball."], "u": 1}, {"s": "Mr Binh detests using the website.", "stub": "Mr Binh isn't keen", "a": ["Mr Binh isn't keen on using the website.", "on using the website."], "u": 1}, {"s": "Hung is happy now, for his team won the competition.", "stub": "His team won", "a": ["His team won the competition, so Hung is happy now.", "the competition, so Hung is happy now.", "His team won the competition; therefore, Hung is happy now.", "the competition; therefore, Hung is happy now."], "u": 3}, {"s": "Ba doesn't read as carefully as Hoa.", "stub": "Hoa", "a": ["Hoa reads more carefully than Ba.", "reads more carefully than Ba."], "u": 2}]}]}, {"id": "d18", "no": 18, "title": "Đề số 18", "acts": [{"id": "d18-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn nh câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Some local people / live / ger / and / herd / cattle.", "a": ["Some local people live in gers and herd cattle.", "Some local people live in a ger and herd cattle."], "u": 2}, {"s": "Children / grassland / ride / horses / good / than / city children.", "a": ["Children on the grassland ride horses better than city children."], "u": 2}, {"s": "The villagers / love / dry / rice / in the sun.", "a": ["The villagers love drying rice in the sun.", "The villagers love to dry rice in the sun."], "u": 1}, {"s": "The grassland / be / vast / however / life / there / not be / easy.", "a": ["The grassland is vast; however, life there is not easy."], "u": 3}, {"s": "Herders / not have / electrical appliances / so / they / not watch / TV.", "a": ["Herders do not have electrical appliances, so they do not watch TV."], "u": 3}]}, {"id": "d19-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "It takes Tuan one hour to drive to the resort.", "stub": "Tuan spends", "a": ["Tuan spends one hour driving to the resort.", "one hour driving to the resort."], "u": 1}, {"s": "He loves playing beach games.", "stub": "He is fond", "a": ["He is fond of playing beach games.", "of playing beach games."], "u": 1}, {"s": "My mother detests cooking.", "stub": "My mother isn't keen", "a": ["My mother isn't keen on cooking.", "on cooking."], "u": 1}, {"s": "Binh is happy now, for he passed the midterm test.", "stub": "Binh passed", "a": ["Binh passed the midterm test, so he is happy now.", "the midterm test, so he is happy now.", "Binh passed the midterm test; therefore, he is happy now.", "the midterm test; therefore, he is happy now."], "u": 3}, {"s": "The cart doesn't go as quickly as the bus.", "stub": "The bus", "a": ["The bus goes more quickly than the cart.", "goes more quickly than the cart."], "u": 2}]}]}, {"id": "d20", "no": 20, "title": "Đề số 20", "acts": [{"id": "d20-I", "part": "I", "title": "Phần I. Phát âm", "instr": "Circle the letter A, B, C or D to indicate the word whose underlined part differs from the others.", "type": "choice", "start": 1, "huong": "Đọc to từng từ, tìm ba từ có âm gạch chân giống nhau, từ còn lại là đáp án. Unit 1: /uː/ trong food, moon, move, fruit khác /ʊ/ trong book, good, could, woman; Unit 2: /ə/ trong banana, silent, famous khác /ɪ/ trong village, cottage, decide, miss; Unit 3: /ʊə/ trong poor, tour khác /ɔɪ/ trong boy, coin, voice.", "items": [{"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["m<u>o<\/u>ve", "t<u>oo<\/u>th", "w<u>o<\/u>lf", "f<u>oo<\/u>d"], "a": 2, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>ou<\/u>ld", "fr<u>ui<\/u>t", "w<u>oo<\/u>d", "w<u>oo<\/u>l"], "a": 1, "u": 1}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["c<u>o<\/u>ntrol", "<u>u<\/u>pon", "<u>a<\/u>partment", "cott<u>age<\/u>"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["short<u>age<\/u>", "b<u>ui<\/u>ld", "bagg<u>age<\/u>", "sil<u>e<\/u>nt"], "a": 3, "u": 2}, {"s": "Chọn từ có phần gạch chân đọc khác các từ còn lại.", "o": ["j<u>oy<\/u>", "c<u>oi<\/u>n", "b<u>oy<\/u>", "t<u>ou<\/u>rist"], "a": 3, "u": 3}]}, {"id": "d20-II", "part": "II", "title": "Phần II. Trắc nghiệm", "instr": "Circle the letter A, B, C or D to indicate the correct answer to each of the following questions.", "type": "choice", "start": 6, "huong": "Đọc từ đứng ngay trước chỗ trống rồi nhớ quy tắc của Unit đó: enjoy, adore, fancy, dislike, detest, don't mind đi với V-ing; be keen on, fond of, interested in, crazy about, into đi với giới từ cố định; trạng từ dài thêm more, trạng từ ngắn thêm -er; so, but, or, however, therefore, or else chọn theo nghĩa của hai vế câu.", "items": [{"s": "My grandfather adores ___ the garden in his free time.", "o": ["water", "watering", "to water", "watered"], "a": 1, "u": 1}, {"s": "Lan is crazy ___ DIY projects.", "o": ["on", "of", "in", "about"], "a": 3, "u": 1}, {"s": "Does he fancy ___ a craft kit?", "o": ["buy", "buying", "to buy", "bought"], "a": 1, "u": 1}, {"s": "My brother is ___ on snowboarding.", "o": ["fond", "keen", "interested", "crazy"], "a": 1, "u": 1}, {"s": "Hoa speaks English ___ than Nam.", "o": ["more fluent", "more fluently", "fluently", "fluenter"], "a": 1, "u": 2}, {"s": "This tractor works ___ than that old one.", "o": ["well", "better", "good", "best"], "a": 1, "u": 2}, {"s": "Our team practised ___ than the others.", "o": ["more regularly", "regularlier", "more regular", "most regularly"], "a": 0, "u": 2}, {"s": "He is tired; ___, he still goes jogging.", "o": ["so", "however", "or", "for"], "a": 1, "u": 3}, {"s": "I will call you ___ send a message.", "o": ["or", "so", "however", "for"], "a": 0, "u": 3}, {"s": "The leader will ___ the team before the competition.", "o": ["coach", "herd", "plough", "unload"], "a": 0, "u": 3}]}, {"id": "d20-III", "part": "III", "title": "Phần III. Chia động từ", "instr": "Complete the sentences with the correct form of the verbs in brackets.", "type": "gap", "start": 16, "huong": "Nhìn từ báo thời gian và động từ đứng trước. Các từ như often, every day thì dùng hiện tại đơn, nhớ thêm s với he/she/it; last night, yesterday, last week thì dùng quá khứ; phủ định quá khứ là did not + động từ nguyên mẫu; sau enjoy, adore, fancy, detest, don't mind, keen on, fond of, interested in thì dùng V-ing.", "items": [{"s": "Her father (surf) ___ the net every night.", "a": ["surfs"], "u": 1}, {"s": "The students (share) ___ photos on the forum yesterday.", "a": ["shared"], "u": 3}, {"s": "The farmers detest (load) ___ carts in the rain.", "a": ["loading"], "u": 2}, {"s": "My aunt (not plant) ___ vegetables last year.", "a": ["did not plant", "didn't plant"], "u": 2}, {"s": "They love (cook) ___ together.", "a": ["cooking", "to cook"], "u": 1}]}, {"id": "d20-IV", "part": "IV", "title": "Phần IV. Dạng từ", "instr": "Complete the sentences with the correct form of the words in capitals.", "type": "gap", "start": 21, "huong": "Xác định chỗ trống cần loại từ nào (trạng từ so sánh hơn, danh từ, tính từ hay V-ing) rồi biến đổi từ viết hoa trong ngoặc. Trạng từ dài thêm more, trạng từ ngắn thêm -er, danh từ thường có đuôi -tion, -ment, -ence, -ity.", "items": [{"s": "He rode ___ than before. (CAREFUL)", "a": ["more carefully"], "u": 2}, {"s": "Outdoor ___ are good for teens. (ACTIVE)", "a": ["activities", "activity"], "u": 1}, {"s": "Walking is ___ to driving. (PREFER)", "a": ["preferable"], "u": 1}, {"s": "Teens need ___ to study well. (CONCENTRATE)", "a": ["concentration"], "u": 3}, {"s": "Her little brother is ___. (ADORE)", "a": ["adorable"], "u": 1}]}, {"id": "d20-V", "part": "V", "title": "Phần V. Điền từ trong khung", "instr": "Fill in each blank with a correct word from the box.", "type": "gap", "start": 26, "huong": "Mỗi từ trong khung chỉ dùng một lần. Đọc từ đứng ngay trước chỗ trống để biết cần giới từ hay tính từ trong cụm be keen on, be fond of, be interested in, be crazy about, be into, rồi thử nghĩa của cả câu.", "items": [{"s": "Tom is ___ in cultural events.", "a": ["interested"], "u": 1}, {"s": "My sister is ___ on knitting.", "a": ["keen"], "u": 1}, {"s": "He is ___ of fresh milk.", "a": ["fond"], "u": 1}, {"s": "Hoa is ___ about folk music.", "a": ["crazy"], "u": 1}, {"s": "I'm ___ DIY these days.", "a": ["into"], "u": 1}], "box": ["fond", "keen", "interested", "crazy", "into"]}, {"id": "d20-VI", "part": "VI", "title": "Phần VI. Điền liên từ vào đoạn văn", "instr": "Fill each blank with a conjunction in the box to complete the passage.", "type": "pgap", "start": 31, "huong": "Đọc cả đoạn văn, xác định hai ý quanh mỗi chỗ trống có quan hệ gì rồi chọn liên từ trong khung. And thêm ý, or đưa ra lựa chọn, so chỉ kết quả, for chỉ lí do, however chỉ sự đối lập và thường đứng sau dấu chấm phẩy, kèm dấu phẩy phía sau. Mỗi từ chỉ dùng một lần, em gõ đúng từ như trong khung.", "items": [{"a": ["and"], "u": 2}, {"a": ["so"], "u": 2}, {"a": ["or"], "u": 2}, {"a": ["however"], "u": 3}, {"a": ["for"], "u": 3}], "box": ["and", "so", "or", "however", "for"], "passage": "Hoa lives in a village with her grandparents. She helps them feed pigs {1} collect eggs. The village is far from the city, {2} she goes to school by bike. Does she go alone {3} with her friends? The road is long; {4}, she never feels bored. She loves country life, {5} it is peaceful and the air is fresh."}, {"id": "d20-VII", "part": "VII", "title": "Phần VII. Chọn đáp án cho đoạn văn", "instr": "Read the following passage and choose A, B, C or D to indicate the correct answer for each blank.", "type": "pchoice", "start": 36, "huong": "Đọc cả đoạn trước khi chọn. Chú ý từ đứng trước và sau mỗi chỗ trống để chọn đúng giới từ, dạng động từ (V-ing hay nguyên mẫu), dạng so sánh hơn hoặc liên từ.", "items": [{"o": ["feel", "feels", "felt", "feeling"], "a": 0, "u": 3}, {"o": ["so", "because", "or", "but"], "a": 1, "u": 3}, {"o": ["advise", "advice", "advising", "advised"], "a": 0, "u": 3}, {"o": ["and", "or", "so", "for"], "a": 0, "u": 3}, {"o": ["than", "as", "then", "that"], "a": 0, "u": 3}], "passage": "Many teenagers feel stressed because of schoolwork. They often {1} too much pressure from their parents. Some teens cannot concentrate {2} they are tired. A good coach can {3} them how to stay calm. They should talk to their peers {4} share their feelings. This is easier {5} they think.", "ptitle": "Teens and stress"}, {"id": "d20-VIII", "part": "VIII", "title": "Phần VIII. Viết câu từ từ gợi ý", "instr": "Write the sentences from the prompts about life in the countryside. You may have to make appropriate changes.", "type": "type", "start": 41, "huong": "Viết thành câu hoàn chỉnh, giữ nguyên thứ tự các từ gợi ý. Thêm mạo từ, giới từ và động từ to be cần thiết, chia động từ đúng thì. Có than thì dùng so sánh hơn (trạng từ ngắn thêm -er, trạng từ dài thêm more); however, so nối hai ý thành một câu. Em gõ cả câu.", "items": [{"s": "Life / village / be / simple / and / peaceful.", "a": ["Life in the village is simple and peaceful."], "u": 2}, {"s": "Combine harvesters / work / far / fast / than / villagers.", "a": ["Combine harvesters work far faster than villagers."], "u": 2}, {"s": "Many villagers / not mind / get up / early.", "a": ["Many villagers do not mind getting up early."], "u": 1}, {"s": "The fields / be / vast / however / farmers / not use / machines.", "a": ["The fields are vast; however, farmers do not use machines."], "u": 3}, {"s": "Children / village / catch / fish / canal / and / play / outdoors.", "a": ["Children in the village catch fish in the canal and play outdoors."], "u": 2}]}, {"id": "d20-IX", "part": "IX", "title": "Phần IX. Viết lại câu", "instr": "Rewrite the following sentences.", "type": "type", "start": 46, "huong": "Gõ cả câu hoàn chỉnh, bắt đầu bằng cụm đã cho. Spend + thời gian + V-ing đổi thành It takes + người + thời gian + to V; câu có for thì đổi thành so và đảo thứ tự hai vế; not as ... as đổi thành so sánh hơn với đối tượng còn lại.", "items": [{"s": "Mai spends two hours doing DIY every Sunday.", "stub": "It takes", "a": ["It takes Mai two hours to do DIY every Sunday.", "Mai two hours to do DIY every Sunday."], "u": 1}, {"s": "Linh adores folk music.", "stub": "Linh is fond", "a": ["Linh is fond of folk music.", "of folk music."], "u": 1}, {"s": "Nam dislikes washing dishes.", "stub": "Nam isn't keen", "a": ["Nam isn't keen on washing dishes.", "on washing dishes."], "u": 1}, {"s": "The ground is wet, for it rained all night.", "stub": "It rained", "a": ["It rained all night, so the ground is wet.", "all night, so the ground is wet.", "It rained all night; therefore, the ground is wet.", "all night; therefore, the ground is wet."], "u": 3}, {"s": "Hung doesn't run as fast as Tuan.", "stub": "Tuan", "a": ["Tuan runs faster than Hung.", "runs faster than Hung."], "u": 2}]}]}];

 { id: 'u2', no: 2, title: 'Unit 2', topic: 'Cuộc sống nông thôn', cards: [
  { icon: 'scale', h: 'So sánh hơn của trạng từ', body: [
    '<b>Trạng từ ngắn</b> (một âm tiết: fast, hard, late, high, near, far): thêm <b>-er</b>. Tận cùng e chỉ thêm r (late, later). early đổi thành earlier.',
    '<b>Trạng từ dài</b> (từ hai âm tiết, thường có đuôi -ly): thêm <b>more</b> trước trạng từ: slowly, more slowly; carefully, more carefully.',
    'Cấu trúc: S + V + trạng từ so sánh + than + O / N / Pro / clause.<br>Ví dụ: Tom runs faster than his brother. He runs more slowly than I do. Susan speaks French more fluently than her sister.'],
    tip: 'Nhìn đuôi -ly để nhận biết trạng từ dài và dùng more.' },
  { icon: 'star', h: 'Dạng bất quy tắc', body: [

    tip: 'Không nói gooder, more well hay badder.' },
  { icon: 'plus', h: 'Nhấn mạnh so sánh', body: [

  { icon: 'scale', h: 'So sánh không bằng (not as ... as)', body: [

  { icon: 'leaf', h: 'Từ vựng nông thôn', body: [

 ]},
 { id: 'u3', no: 3, title: 'Unit 3', topic: 'Tuổi teen và câu lạc bộ', cards: [
  { icon: 'link', h: 'Liên từ trong câu ghép', body: [
    '<table class="tb"><tr><td>and</td><td>bổ sung thông tin</td></tr><tr><td>but</td><td>hai ý tương phản</td></tr><tr><td>or</td><td>sự lựa chọn</td></tr><tr><td>so</td><td>kết quả</td></tr><tr><td>for</td><td>lí do</td></tr><tr><td>or else</td><td>nếu không (hậu quả)</td></tr></table>',
    'Luôn có dấu phẩy trước liên từ nối hai mệnh đề.<br>Ví dụ: Tommy found the folk game interesting, so he decided to join it. You must hurry or else you\'ll be late.'],
    tip: 'Thử nghĩa: kết quả dùng so, tương phản dùng but, lí do dùng for.' },
  { icon: 'swap', h: 'However, therefore (trạng từ nối)', body: [
    '<b>however</b> (tuy nhiên) diễn tả sự tương phản. <b>therefore</b> (do đó) diễn tả kết quả.',
    'Đứng sau dấu chấm phẩy hoặc dấu chấm, và luôn có dấu phẩy theo sau.<br>Ví dụ: Mid-Autumn Festival is considered a kid\'s event; however, it is mostly celebrated by people of all ages. He has studied hard the whole year; therefore, he looks forward to a long holiday.'],

<script>(function () {
'use strict';
var DES = window.DES || [], GR = window.GRAMMAR || [], WEB = window.WEBAPP_URL || '';
var root = document.getElementById('app');
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function ls(k, v) {
  try { if (v === undefined) { return JSON.parse(localStorage.getItem(k) || 'null'); } localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; }
}
var me = ls('hd_me') || { ten: '', lop: '' };
var prog = ls('hd_prog') || {};
var mem = {};     // trang thai trong phien: mem[actId] = { first: bool }
var curTab = {};  // tab dang mo cua tung de

var ICONS = {
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  swap: '<path d="M5 9h13l-3-3"/><path d="M19 15H6l3 3"/>',
  sound: '<path d="M4 10v4h3l5 4V6L7 10z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/>',
  scale: '<path d="M12 4v16"/><path d="M6 20h12"/><path d="M5 8h14"/><path d="M5 8l-2.5 6a3 3 0 0 0 5 0z"/><path d="M19 8l-2.5 6a3 3 0 0 0 5 0z"/>',
  star: '<path d="M12 4l2.4 5 5.4.7-4 3.8 1 5.4L12 16.3 7.2 18.9l1-5.4-4-3.8 5.4-.7z"/>',
  plus: '<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/>',
  leaf: '<path d="M5 19c0-8 5-14 14-14 0 9-6 14-14 14z"/><path d="M5 19c3-5 6-8 10-10"/>',
  chat: '<path d="M5 6h14v9H10l-4 3v-3H5z"/>'
};
function icon(n) { return '<svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }

/* ---------- so khop dap an ---------- */
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'")
    .replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not')
    .replace(/n't\b/g, ' not').replace(/\b(he|she|it|that|there|what|who)'s\b/g, '$1 is').replace(/'m\b/g, ' am').replace(/-/g, ' ')
    .replace(/[.,;:!?"“”()]/g, ' ').replace(/'/g, '').replace(/\s+/g, ' ').trim();
}
function normSent(s) { return norm(s).replace(/ (do|does|did)$/, ''); }
function match(a, it, val) {
  var v = a.type === 'type' ? normSent(val) : norm(val);
  return it.a.some(function (x) { return (a.type === 'type' ? normSent(x) : norm(x)) === v; });
}

/* ---------- ve giao dien ---------- */
function stars(id) {
  var p = prog[id]; if (!p) return '';
  var r = p.best / p.total, n = r >= 1 ? 3 : r >= 0.9 ? 2 : r >= 0.8 ? 1 : 0, h = '';
  for (var i = 0; i < 3; i++) h += '<span class="st' + (i < n ? ' on' : '') + '">' + icon('star') + '</span>';
  return h;
}
function deStat(d) {
  var done = 0, st = 0;
  d.acts.forEach(function (a) {
    var p = prog[a.id]; if (p) { if (p.best >= p.total) done++; var r = p.best / p.total; st += r >= 1 ? 3 : r >= 0.9 ? 2 : r >= 0.8 ? 1 : 0; }
  });
  return { done: done, st: st };
}
var SHUF = window.DAO_CAU !== false;   /* dat window.DAO_CAU = false de tat tinh nang dao cau/dap an */
function idOrder(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
function shuffled(n) {
  var r = idOrder(n), i, j, t;
  if (!SHUF) return r;
  for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function blankHTML(s) { return esc(s).replace(/___/g, '<span class="bk"></span>'); }

function itemHTML(a, it, k, pos) {
